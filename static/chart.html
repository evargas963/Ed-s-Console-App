<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ed Chart — terrain on price</title>
<style>
  :root { --bg:#0a0c0f; --panel:#111418; --border:#252c36; --text:#e5e7eb; --dim:#9ca3af;
          --green:#34d399; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa; --vio:#a5b4fc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:13px 'Segoe UI', system-ui, sans-serif; }
  #top { display:flex; gap:12px; align-items:center; padding:9px 14px;
         border-bottom:1px solid var(--border); flex-wrap:wrap; }
  #tk { background:var(--panel); color:var(--text); border:1px solid var(--border);
        border-radius:6px; padding:6px 10px; width:86px; font-weight:700;
        text-transform:uppercase; }
  #narrator { flex:1; min-width:220px; color:var(--amber); font-weight:600; }
  .chip { border:1px solid var(--border); background:var(--panel); color:var(--dim);
          border-radius:12px; padding:4px 12px; cursor:pointer; font-size:11px; }
  .chip.on { color:var(--text); border-color:var(--blue); background:#16213a; }
  #meta { color:var(--dim); font-size:11px; width:100%; }
  #layout { display:flex; }
  #wrap { position:relative; flex:1; min-width:0; }
  #histwrap { width:220px; border-left:1px solid var(--border); position:relative; }
  canvas { display:block; width:100%; }
  #tip { position:fixed; display:none; max-width:360px; background:var(--panel);
         border:1px solid var(--border); border-radius:8px; padding:10px 12px;
         font-size:12px; line-height:1.5; pointer-events:none; z-index:9;
         box-shadow:0 6px 24px rgba(0,0,0,.55); }
  #tip b { color:var(--amber); }
  #coachlines { padding:8px 14px; color:var(--dim); font-size:12px; line-height:1.6;
                border-top:1px solid var(--border); }
  a { color:var(--blue); text-decoration:none; }
</style>
</head>
<body>
<div id="top">
  <input id="tk" value="SPY" spellcheck="false">
  <span id="narrator">loading…</span>
  <span class="chip on" id="exp-all">ALL EXPIRIES</span>
  <span class="chip" id="exp-near">≤7 DTE</span>
  <span class="chip" id="exp-far">MONTHLY+</span>
  <span class="chip on" id="ghost">YESTERDAY GHOST</span>
  <span class="chip on" id="learn">LEARNING MODE</span>
  <a href="/">← console</a>
  <span id="meta"></span>
</div>
<div id="layout">
  <div id="wrap"><canvas id="cv" height="540"></canvas></div>
  <div id="histwrap"><canvas id="hv" height="540"></canvas></div>
</div>
<div id="tip"></div>
<div id="coachlines"></div>
<script>
/* CR-03 screen 1 — full v1 (operator directive 2026-07-23: "everything end to end").
   Candles /api/bars1m · levels+coach /api/terrain · per-strike gamma+volume+ghost
   /api/terrain/strikes · event badges /api/level_crosses. Every market sentence is
   SERVER-GENERATED (terrain read / level_crosses rows); this page renders state,
   never invents confidence. Polling v1 by design; typed WS replaces transport at
   CR-CAP — the drawing layer stays. */
'use strict';
const cv = document.getElementById('cv'), hv = document.getElementById('hv');
const tip = document.getElementById('tip'), wrap = document.getElementById('wrap');
let bars = [], terrain = null, strikes = null, crosses = [];
let zones = [], scope = 'all', showGhost = true, learning = true;

const fmt = (x, d = 2) => x == null ? '—' : Number(x).toFixed(d);

async function j(u) { const r = await fetch(u); return r.json(); }

async function load() {
  const tk = document.getElementById('tk').value.trim().toUpperCase() || 'SPY';
  try {
    const [b, t, s, c] = await Promise.all([
      j(`/api/bars1m?ticker=${tk}&limit=780`),
      j(`/api/terrain?ticker=${tk}`),
      // strikes endpoint is newer than a long-running server process — the page
      // must not lose candles/bands because the histogram feed 404s pre-restart.
      j(`/api/terrain/strikes?ticker=${tk}`).catch(() => null),
      j(`/api/level_crosses?ticker=${tk}&n=8`).catch(() => ({crosses: []})),
    ]);
    bars = (b.bars || []).slice(-390);
    terrain = t; strikes = s; crosses = c.crosses || [];
    document.getElementById('narrator').textContent = t.headline || '—';
    document.getElementById('meta').textContent =
      `spot ${fmt(s.spot ?? t.spot)} · regime ${t.regime || '—'} · confidence ` +
      `${t.confidence || '—'} · bars ${bars.length} · strikes ${s.today_source || '—'}` +
      (s.prior_source ? ` · ghost ${s.prior_source}` : ' · no prior capture yet');
    document.getElementById('coachlines').innerHTML = learning
      ? (t.lines || []).map(l => '· ' + l).join('<br>') : '';
    draw(); drawHist();
  } catch (e) {
    document.getElementById('narrator').textContent = 'load failed: ' + e.message;
  }
}

let scale = null;  // {lo, hi, y} shared with the histogram panel
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = 540;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  if (!bars.length) { g.fillStyle = '#9ca3af'; g.fillText('no bars yet — pre-market', 20, 40); }

  const padL = 8, padR = 58, padT = 12, padB = 20;
  const T = terrain || {}, S = strikes || {};
  let lo = Infinity, hi = -Infinity;
  for (const b of bars) { lo = Math.min(lo, b.l); hi = Math.max(hi, b.h); }
  for (const v of [T.gamma_flip, T.call_wall, T.put_wall, S.spot ?? T.spot])
    if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const span = (hi - lo) || 1; lo -= span * 0.05; hi += span * 0.05;
  const y = p => padT + (hi - p) / (hi - lo) * (H - padT - padB);
  scale = { lo, hi, y, H, padT, padB };
  const n = Math.max(bars.length, 1);
  const bw = Math.max(2, Math.min(9, (W - padL - padR) / n - 1));
  const x = i => padL + i * ((W - padL - padR) / n);

  zones = [];
  const unproven = T.regime === 'SIGN_UNPROVEN';
  const band = (level, kind) => {
    if (level == null) return;
    const h8 = Math.max(13, (H - padT - padB) * 0.042);
    const y0 = y(level) - h8 / 2, sell = kind === 'call';
    g.fillStyle = sell ? 'rgba(248,113,113,0.13)' : 'rgba(52,211,153,0.13)';
    g.fillRect(padL, y0, W - padL - padR, h8);
    g.fillStyle = sell ? '#f87171' : '#34d399'; g.font = '600 12px system-ui';
    g.fillText((sell ? 'CALL WALL ' : 'PUT WALL ') + fmt(level) +
      (unproven ? '' : (sell ? ' — dealers lean SELLING' : ' — dealers lean BUYING')),
      padL + 8, y0 - 4);
    zones.push({ y0, y1: y0 + h8,
      tipHtml: `<b>${sell ? 'Call wall' : 'Put wall'} ${fmt(level)}</b><br>` +
        `Heavy standing option inventory at this strike — dealer hedging ` +
        `${sell ? 'sells into strength' : 'buys into weakness'} here, which is why it acts as ` +
        `${sell ? 'resistance' : 'support'}.<br><i>Wall evidence: OI-weighted holds 70–72% on ` +
        `1,000+ of our own days (measured tonight; volume-built walls held only 62–66%).</i>` +
        (unproven ? '<br><i>Single name: BUY/SELL lean wording withheld — dealer-sign unproven (register row, due 2026-08-03).</i>' : '') });
  };
  band(T.call_wall, 'call'); band(T.put_wall, 'put');

  if (T.gamma_flip != null) {
    const yf = y(T.gamma_flip);
    g.strokeStyle = '#e5e7eb'; g.setLineDash([7, 5]); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(padL, yf); g.lineTo(W - padR, yf); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#e5e7eb'; g.font = '600 11px system-ui';
    g.fillText(`GAMMA FLIP ${fmt(T.gamma_flip)}`, padL + 8, yf - 5);
    zones.push({ y0: yf - 7, y1: yf + 7,
      tipHtml: `<b>Gamma flip ${fmt(T.gamma_flip)}</b><br>The regime line: below it dealer ` +
        `hedging trades WITH moves (amplifies); above it, AGAINST them (dampens).` +
        `<br><i>Confidence: ${T.confidence || '—'}.</i>` +
        (unproven ? '<br><i>Landmark only on this ticker — what the sign MEANS is the unproven part.</i>' : '') });
  }

  for (let i = 0; i < bars.length; i++) {
    const b = bars[i], up = b.c >= b.o, cx = x(i) + bw / 2;
    g.strokeStyle = up ? '#34d399' : '#f87171';
    g.beginPath(); g.moveTo(cx, y(b.h)); g.lineTo(cx, y(b.l)); g.stroke();
    g.fillStyle = up ? '#34d399' : '#f87171';
    g.fillRect(x(i), y(Math.max(b.o, b.c)), bw, Math.max(1, Math.abs(y(b.o) - y(b.c))));
  }

  // event badges — recent level crossings, drawn AT the level they crossed
  for (const cr of crosses) {
    const lv = cr.level_value; if (lv == null) continue;
    const yv = y(lv);
    g.fillStyle = '#fbbf24';
    g.beginPath(); g.arc(W - padR - 14, yv, 4, 0, 6.283); g.fill();
    zones.push({ y0: yv - 6, y1: yv + 6,
      tipHtml: `<b>${cr.level_name || 'level'} ${fmt(lv)} crossed ${cr.direction || ''}</b>` +
        `<br><i>Recent crossing logged by the console (level_crosses feed).</i>` });
  }

  const spot = (strikes && strikes.spot != null) ? strikes.spot : T.spot;
  if (spot != null) {
    const ys = y(spot);
    g.fillStyle = '#fbbf24'; g.font = '700 12px system-ui';
    g.fillText('SPOT ' + fmt(spot), W - padR + 3, ys + 4);
    g.fillRect(W - padR - 4, ys - 1, 6, 2);
  }
  g.fillStyle = '#9ca3af'; g.font = '10px system-ui';
  for (let k = 0; k <= 4; k++) {
    const p = lo + (hi - lo) * k / 4;
    g.fillText(fmt(p), W - padR + 3, y(p) + 3);
  }
}

function drawHist() {
  const dpr = window.devicePixelRatio || 1;
  const W = 220, H = 540;
  hv.width = W * dpr; hv.height = H * dpr; hv.style.height = H + 'px';
  const g = hv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  if (!scale) return;
  if (!strikes) {
    g.fillStyle = '#9ca3af'; g.font = '11px system-ui';
    g.fillText('histogram activates at the', 12, 24);
    g.fillText('next console start', 12, 38);
    return;
  }
  const { y } = scale;
  const rows = (strikes.today || {})[scope] || [];
  const ghost = showGhost ? ((strikes.prior || {})[scope] || []) : [];
  const inView = r => r[0] >= scale.lo && r[0] <= scale.hi;
  const vis = rows.filter(inView), gvis = ghost.filter(inView);
  const maxG = Math.max(1, ...vis.map(r => Math.abs(r[1])), ...gvis.map(r => Math.abs(r[1])));
  const maxV = Math.max(1, ...vis.map(r => r[2]));
  const x0 = 6, wMax = 150;
  g.fillStyle = '#9ca3af'; g.font = '10px system-ui';
  g.fillText(`gamma per strike (${scope.toUpperCase()})`, x0, 12);
  // yesterday ghosts (outline)
  g.strokeStyle = 'rgba(165,180,252,0.55)'; g.setLineDash([3, 2]);
  for (const r of gvis) {
    const w = Math.abs(r[1]) / maxG * wMax;
    g.strokeRect(x0, y(r[0]) - 2.5, Math.max(w, 1), 5);
  }
  g.setLineDash([]);
  // today's bars: color by sign (dealer long vs short at that strike)
  for (const r of vis) {
    const w = Math.abs(r[1]) / maxG * wMax;
    g.fillStyle = r[1] >= 0 ? 'rgba(96,165,250,0.85)' : 'rgba(248,113,113,0.85)';
    g.fillRect(x0, y(r[0]) - 2.5, Math.max(w, 1), 5);
    // live volume sliver beneath
    const wv = r[2] / maxV * wMax;
    if (wv > 0.5) { g.fillStyle = 'rgba(251,191,36,0.65)'; g.fillRect(x0, y(r[0]) + 3, wv, 2); }
  }
  g.fillStyle = '#9ca3af';
  g.fillText('■ +gamma  ■ −gamma  ▁ volume', x0, H - 20);
  g.fillText(showGhost ? '▢ yesterday (ghost)' : '', x0, H - 8);
}

wrap.addEventListener('mousemove', ev => {
  const r = wrap.getBoundingClientRect(), my = ev.clientY - r.top;
  const z = zones.find(z => my >= z.y0 && my <= z.y1);
  if (!z) { tip.style.display = 'none'; return; }
  tip.innerHTML = z.tipHtml; tip.style.display = 'block';
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 380) + 'px';
  tip.style.top = (ev.clientY + 14) + 'px';
});
wrap.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

function chip(id, fn) { document.getElementById(id).addEventListener('click', fn); }
function setScope(s) {
  scope = s;
  for (const [id, v] of [['exp-all', 'all'], ['exp-near', 'near'], ['exp-far', 'far']])
    document.getElementById(id).classList.toggle('on', v === s);
  drawHist();
}
chip('exp-all', () => setScope('all'));
chip('exp-near', () => setScope('near'));
chip('exp-far', () => setScope('far'));
chip('ghost', () => { showGhost = !showGhost;
  document.getElementById('ghost').classList.toggle('on', showGhost); drawHist(); });
chip('learn', () => { learning = !learning;
  document.getElementById('learn').classList.toggle('on', learning);
  document.getElementById('coachlines').innerHTML = learning
    ? ((terrain || {}).lines || []).map(l => '· ' + l).join('<br>') : ''; });
document.getElementById('tk').addEventListener('change', load);
window.addEventListener('resize', () => { draw(); drawHist(); });
load(); setInterval(load, 15000);
</script>
</body>
</html>
