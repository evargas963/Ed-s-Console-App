<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ed Chart — terrain on price</title>
<style>
  :root { --bg:#05070a; --panel:#10151c; --border:#2b3646; --text:#f4f6f8; --dim:#aab6c4;
          --green:#00e07a; --red:#ff3355; --amber:#ffc400; --blue:#33aaff; --vio:#c792ff;
          --cyan:#00e5ff; --pink:#ff66cc; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; color:var(--text); display:flex; flex-direction:column;
         overflow:auto;
         background:radial-gradient(1200px 600px at 70% -10%, #0b1420 0%, var(--bg) 60%) fixed var(--bg);
         font:14px 'Segoe UI', system-ui, sans-serif; }
  #top { flex:none; }
  #coachlines { flex:none; max-height:34px; overflow:auto; padding-top:3px;
                padding-bottom:3px; }
  /* if the window is still too short for everything, say so LOUDLY instead of
     hiding the gamma panel below an unscrollable fold */
  #foldwarn { display:none; position:fixed; bottom:8px; left:50%;
              transform:translateX(-50%); background:var(--amber); color:#031018;
              font-weight:800; font-size:13px; padding:6px 16px; border-radius:14px;
              z-index:10; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  #top { display:flex; gap:10px; align-items:center; padding:8px 14px;
         border-bottom:1px solid var(--border); flex-wrap:wrap; }
  #tk { background:var(--panel); color:var(--text); border:1px solid var(--border);
        border-radius:6px; padding:7px 10px; width:92px; font-weight:800; font-size:15px;
        text-transform:uppercase; }
  #narrator { flex:1; min-width:220px; color:var(--amber); font-weight:700; font-size:15px; }
  .chip { border:1px solid var(--border); background:var(--panel); color:var(--dim);
          border-radius:12px; padding:5px 13px; cursor:pointer; font-size:12px;
          font-weight:700; user-select:none; letter-spacing:.03em;
          transition:border-color .15s, color .15s, box-shadow .15s, transform .1s; }
  .chip:hover { border-color:var(--blue); color:var(--text); transform:translateY(-1px); }
  .chip.on { color:#031018; border-color:var(--blue); background:var(--blue);
             box-shadow:0 0 10px rgba(51,170,255,.45); }
  .tf.on { background:var(--amber); border-color:var(--amber);
           box-shadow:0 0 10px rgba(255,196,0,.45); }
  #livedot { width:9px; height:9px; border-radius:50%; background:var(--green);
             box-shadow:0 0 8px var(--green); animation:pulse 1.6s ease-in-out infinite;
             flex:none; }
  #livedot.stale { background:var(--amber); box-shadow:0 0 8px var(--amber); animation:none; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  #regchip { border-radius:12px; padding:5px 13px; font-size:12px; font-weight:800;
             letter-spacing:.04em; color:#031018; background:var(--dim); flex:none; }
  .card { border:1px solid var(--border); border-radius:12px; margin:8px 12px;
          overflow:hidden; background:rgba(16,21,28,.55);
          box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .sechead { display:flex; align-items:center; gap:10px; padding:10px 14px 6px;
             font-size:13px; font-weight:800; letter-spacing:.07em; color:var(--text); }
  .sechead::before { content:''; width:5px; height:16px; border-radius:3px;
                     background:var(--amber); }
  .sechead .src { margin-left:auto; color:var(--dim); font-weight:600;
                  letter-spacing:0; font-size:12px; }
  .legend { display:flex; gap:20px; padding:6px 16px 12px; color:var(--dim);
            font-size:12px; font-weight:700; flex-wrap:wrap; }
  .legend .sw { display:inline-block; width:12px; height:12px; border-radius:3px;
                vertical-align:-2px; margin-right:6px; }
  .legend .sw.ghostsw { background:transparent; border:1.5px dashed var(--vio); }
  #gwrap { position:relative; }
  .coach { position:absolute; right:14px; width:300px; border-radius:10px;
           padding:11px 14px; font-size:13px; line-height:1.5; display:none;
           border:1px solid; backdrop-filter:blur(2px); }
  .coach b { display:block; margin-bottom:4px; font-size:13.5px; }
  #coach1 { top:14%; background:rgba(199,146,255,.10); border-color:rgba(199,146,255,.5); }
  #coach1 b { color:var(--vio); }
  #coach2 { top:64%; background:rgba(255,196,0,.08); border-color:rgba(255,196,0,.5); }
  #coach2 b { color:var(--amber); }
  #biglegend { position:absolute; top:6px; left:10px; pointer-events:none; z-index:5;
               line-height:1.15; text-shadow:0 2px 6px rgba(0,0,0,.85); }
  #biglegend .sym { font-size:15px; font-weight:800; color:var(--dim); letter-spacing:.05em; }
  #biglegend .px { font-size:30px; font-weight:800; }
  #biglegend .chg { font-size:14px; font-weight:800; }
  #wrap .lastdot { position:absolute; width:10px; height:10px; border-radius:50%;
                   background:var(--amber); box-shadow:0 0 10px var(--amber);
                   animation:pulse 1.6s ease-in-out infinite; pointer-events:none;
                   display:none; }
  #meta { color:var(--dim); font-size:12px; width:100%; }
  #layout { display:flex; flex:1.4 1 0; min-height:360px; }
  #wrap { position:relative; flex:1; min-width:0; cursor:crosshair; }
  #histwrap { width:230px; border-left:1px solid var(--border); }
  #gammacard { flex:1 1 0; min-height:280px; display:flex; flex-direction:column; }
  #gammacard .sechead, #gammacard .legend { flex:none; }
  #gwrap { flex:1; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  #tip { position:fixed; display:none; max-width:380px; background:var(--panel);
         border:1px solid var(--blue); border-radius:8px; padding:11px 13px;
         font-size:13px; line-height:1.55; pointer-events:none; z-index:9;
         box-shadow:0 8px 28px rgba(0,0,0,.65); }
  #tip b { color:var(--amber); }
  #coachlines { padding:8px 14px; color:var(--dim); font-size:13px; line-height:1.65;
                border-top:1px solid var(--border); }
  a { color:var(--blue); text-decoration:none; font-weight:700; }
  a.navtab { color:var(--dim); }
  a.navtab:hover { color:var(--text); }
</style>
</head>
<body>
<div id="top">
  <input id="tk" value="SPY" spellcheck="false">
  <span id="livedot" title="feed state"></span>
  <span id="regchip">…</span>
  <span id="narrator">loading…</span>
  <span class="chip tf on" data-tf="1">1m</span>
  <span class="chip tf" data-tf="3">3m</span>
  <span class="chip tf" data-tf="5">5m</span>
  <span class="chip tf" data-tf="15">15m</span>
  <span class="chip tf" data-tf="60">1h</span>
  <span class="chip tf" data-tf="D">D</span>
  <span class="chip on" id="exp-all">ALL</span>
  <span class="chip" id="exp-near">≤7 DTE</span>
  <span class="chip" id="exp-far">MONTHLY+</span>
  <span class="chip on" id="ghost">GHOST</span>
  <span class="chip on" id="learn">COACH</span>
  <span class="chip" id="fit" title="reset zoom/pan">FIT</span>
  <a class="chip navtab" href="/">CONSOLE</a>
  <a class="chip navtab" href="/#terrain">TERRAIN</a>
  <span class="chip on">CHART</span>
  <span id="meta"></span>
</div>
<div id="layout" class="card">
  <div id="wrap"><canvas id="cv" height="560"></canvas><div id="biglegend"></div><div class="lastdot" id="lastdot"></div></div>
  <div id="histwrap"><canvas id="hv" height="560"></canvas></div>
</div>
<div class="card" id="gammacard">
  <div class="sechead">GAMMA PANEL — POSITIONING MIGRATION &amp; TODAY'S VOLUME
    <span class="src" id="gsrc"></span></div>
  <div id="gwrap">
    <canvas id="gv" height="430"></canvas>
    <div class="coach" id="coach1"></div>
    <div class="coach" id="coach2"></div>
  </div>
  <div class="legend">
    <span><i class="sw" style="background:#33aaff"></i>positive dealer gamma</span>
    <span><i class="sw" style="background:#ff3355"></i>negative dealer gamma</span>
    <span><i class="sw ghostsw"></i>yesterday (ghost)</span>
    <span><i class="sw" style="background:#ffc400"></i>today's option volume</span>
  </div>
</div>
<div id="tip"></div>
<div id="foldwarn">▼ GAMMA PANEL BELOW — click to jump</div>
<div id="coachlines"></div>
<script>
/* CR-03 screen 1 v2 — TradingView-grade interaction (operator directive 2026-07-23):
   wheel = zoom time axis at cursor · drag = pan time AND price · double-click/FIT =
   re-fit · timeframe chips aggregate client-side from canonical 1m bars · crosshair
   with axis readouts · ALL terrain key levels plotted · bright palette, loud scales.
   Every market sentence remains SERVER-GENERATED (terrain read / level_crosses). */
'use strict';
// any uncaught page error becomes VISIBLE in the narrator — never a silent blank
window.addEventListener('error', e => {
  const n = document.getElementById('narrator');
  if (n) n.textContent = 'page error: ' + (e.message || 'unknown') +
    (e.lineno ? ` (line ${e.lineno})` : '');
});
const cv = document.getElementById('cv'), hv = document.getElementById('hv');
const tip = document.getElementById('tip'), wrap = document.getElementById('wrap');
let raw = [], bars = [], terrain = null, strikes = null, crosses = [];
let zones = [], scope = 'all', showGhost = true, learning = true, tf = '1';
let view = null;          // {i0, i1} visible bar index range (fractional)
let yLock = null;         // {lo, hi} manual price domain when user pans/zooms Y
let cross = null;         // {mx, my} crosshair position
let scale = null;
let daily = null;         // {vwap:[[t,w]…], pdh, pdl, pdc} from canonical 1m rows
let scorecard = null;     // latest daily scorecard — coach numbers update with it
let scorecardStale = null;// present but PAST its freshness budget (RC-78): the reason,
                          // never the numbers, so staleness is stated not implied
let lastDragEnd = 0;      // suppress dblclick-fit right after a real drag
let liveSpot = null;      // 2.5s fast-poll spot (/api/spot); 15s cycle is the fallback
let forming = null;       // TradingView-style FORMING candle for the current minute:
                          // display-only synthesis from spot ticks; the canonical 1m bar
                          // REPLACES it the moment the server writes that minute
let sealedForming = null; // just-finished minute kept until /api/bars1m catches up
let chartTicker = null;   // ticker whose `raw` bars are loaded — gates forming/spot ticks
let feedFresh = false;    // newest canonical 1m bar ≤900s (livedot + lastdot)

const fmt = (x, d = 2) => x == null ? '—' : Number(x).toFixed(d);
const j = async u => (await fetch(u)).json();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]));
const hasStrikeBars = sc => !!(sc && Array.isArray(sc.all) && sc.all.length > 0);

function aggregate(src, tfv) {
  if (tfv === '1') return src.slice();
  const out = [], key = t => tfv === 'D'
    ? new Date(t * 1000).toLocaleDateString()
    : Math.floor(t / (60 * Number(tfv)));
  let cur = null, ck = null;
  for (const b of src) {
    const k = key(b.t);
    if (k !== ck) { if (cur) out.push(cur);
      cur = { t: b.t, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v || 0 }; ck = k; }
    else { cur.h = Math.max(cur.h, b.h); cur.l = Math.min(cur.l, b.l);
      cur.c = b.c; cur.v += (b.v || 0); }
  }
  if (cur) out.push(cur);
  return out;
}

function computeDaily() {
  // canonical-1m-only derivations (plan §5 main chart): session VWAP polyline +
  // yesterday's H/L/C. No bars outside the feed → the lines simply don't render.
  daily = null;
  if (!raw.length) return;
  const dkey = t => new Date(t * 1000).toLocaleDateString();
  const days = []; let cur = null, ck = null;
  for (const b of raw) { const k = dkey(b.t);
    if (k !== ck) { cur = []; days.push(cur); ck = k; } cur.push(b); }
  const today = days[days.length - 1];
  const prior = days.length > 1 ? days[days.length - 2] : null;
  let pv = 0, vv = 0; const vwap = [];
  for (const b of today) { const tp = (b.h + b.l + b.c) / 3;
    pv += tp * (b.v || 0); vv += (b.v || 0);
    vwap.push([b.t, vv ? pv / vv : null]); }
  daily = { vwap,
    pdh: prior ? Math.max(...prior.map(b => b.h)) : null,
    pdl: prior ? Math.min(...prior.map(b => b.l)) : null,
    pdc: prior ? prior[prior.length - 1].c : null };
}

function vwapAt(tEnd) {
  if (!daily || !daily.vwap.length) return null;
  const a = daily.vwap; let lo = 0, hi = a.length - 1, ans = null;
  while (lo <= hi) { const m = (lo + hi) >> 1;
    if (a[m][0] < tEnd) { ans = a[m][1]; lo = m + 1; } else hi = m - 1; }
  return ans;
}

function clampView() {
  const minVis = 5;
  if (view.i0 > bars.length - minVis) {
    const s = view.i0 - (bars.length - minVis); view.i0 -= s; view.i1 -= s; }
  if (view.i1 < minVis) {
    const s = minVis - view.i1; view.i0 += s; view.i1 += s; }
}

function rawWithForming() {
  // canonical rows stay PURE (raw feeds VWAP/PDH/PDL/PDC); synthetic minutes
  // append only while the server has no bar for that minute yet
  const tip = raw.length ? raw[raw.length - 1].t : null;
  if (sealedForming && tip != null && tip >= sealedForming.t) sealedForming = null;
  if (forming && tip != null && tip >= forming.t) forming = null;
  let out = raw;
  if (sealedForming && (tip == null || sealedForming.t > tip))
    out = out.concat([sealedForming]);
  if (forming && (tip == null || forming.t > tip))
    out = out.concat([forming]);
  return out;
}

function setBars() {
  bars = aggregate(rawWithForming(), tf);
  if (!view) {
    const show = Math.min(bars.length, tf === '1' ? 390 : 200);
    view = { i0: Math.max(0, bars.length - show), i1: bars.length };
  }
}

function noteSpotTick(s) {
  // grow the current-minute candle exactly like TradingView's forming bar
  if (!chartTicker) return;   // bars not yet for the selected ticker
  const v = Number(s);
  if (!isFinite(v)) return;
  const mt = Math.floor(Date.now() / 60000) * 60;
  if (!forming || forming.t !== mt) {
    // keep the just-finished synthetic minute until canonical bars catch up
    if (forming && (!raw.length || forming.t > raw[raw.length - 1].t))
      sealedForming = forming;
    forming = { t: mt, o: v, h: v, l: v, c: v, v: 0 };
  } else { forming.h = Math.max(forming.h, v); forming.l = Math.min(forming.l, v);
         forming.c = v; }
  const atEnd = view && view.i1 >= bars.length - 1 && view.i1 <= bars.length + 0.5;
  bars = aggregate(rawWithForming(), tf);
  if (view && atEnd) { const w = view.i1 - view.i0;
    view.i1 = bars.length; view.i0 = Math.max(0, bars.length - w); }
  draw();
}

async function load() {
  const tk = document.getElementById('tk').value.trim().toUpperCase() || 'SPY';
  try {
    const [b, t, s, c, sc] = await Promise.all([
      j(`/api/bars1m?ticker=${tk}&limit=3000`),
      j(`/api/terrain?ticker=${tk}`),
      j(`/api/terrain/strikes?ticker=${tk}`).catch(() => null),
      j(`/api/level_crosses?ticker=${tk}&n=8`).catch(() => ({ crosses: [] })),
      j(`/api/terrain/scorecard`).catch(() => null),
    ]);
    // coach numbers: accept only a real scorecard payload (an error body or a
    // pre-restart 404 must read as ABSENT -> tooltips say "measuring")
    // RC-78: a STALE scorecard is not a scorecard. The server withholds the figures past its
    // trading-day budget and sends the reason instead, so the coach says "measuring" rather than
    // quoting a four-day-old hold rate under "measured on our own history".
    scorecard = (sc && sc.generated_utc && !sc.stale) ? sc : null;
    scorecardStale = (sc && sc.stale) ? sc : null;
    const cur = (document.getElementById('tk').value || 'SPY').trim().toUpperCase();
    if (cur !== tk) return;   // superseded by a newer ticker selection
    // follow the right edge ONLY when actually sitting on it; a view dragged
    // past the newest bar stays where the operator placed it (snap-back class)
    const atEnd = !view ||
      (view.i1 >= bars.length - 1 && view.i1 <= bars.length + 0.5);
    raw = b.bars || []; terrain = t; crosses = c.crosses || [];
    if (chartTicker !== tk) { forming = null; sealedForming = null; liveSpot = null; }
    chartTicker = tk;
    // empty {all:[],…} shells and HTTP error bodies both read as ABSENT
    strikes = (s && hasStrikeBars(s.today)) ? s : null;
    computeDaily(); setBars();
    if (atEnd && view) { const w = view.i1 - view.i0;
      view.i1 = bars.length; view.i0 = Math.max(0, bars.length - w); }
    document.getElementById('narrator').textContent = t.headline || '—';
    // RC-81 — the spot lives in its OWN element so the 1.5s tick can repaint it. It used to be
    // baked into this string, which is rewritten once per 15s load(): same authority as the big
    // legend, but painted 15s apart, so the two showed different prices in the same frame
    // (MEASURED in the rendered DOM: big legend 737.73 beside meta bar 737.67). One faucet only
    // guarantees agreement between readers sampled at the same instant.
    document.getElementById('meta').innerHTML =
      `spot <span id="metapx">${esc(fmt(currentSpot()))}</span> · regime ${esc(t.regime || '—')} · ` +
      `${esc(t.confidence || '—')} · ${raw.length}×1m bars · ` +
      `strikes ${esc((strikes && strikes.today_source) || 'restart console to activate')} ` +
      `· scroll=wider/narrower · shift+scroll=taller/shorter · drag=move · dbl-click=fit`;
    document.getElementById('coachlines').innerHTML = learning
      ? (t.lines || []).map(l => '· ' + esc(l)).join('<br>') : '';
    // LIVE only when the newest 1m bar is fresh; otherwise honest STALE
    const lastTs = raw.length ? Number(raw[raw.length - 1].t) : 0;
    const barAgeSec = lastTs ? (Date.now() / 1000 - lastTs) : 1e9;
    feedFresh = !!(raw.length && barAgeSec <= 900);
    document.getElementById('livedot').className = feedFresh ? '' : 'stale';
    const rc = document.getElementById('regchip');
    const reg = String(t.regime || '—');
    rc.textContent = reg;
    rc.style.background = /SHORT/.test(reg) ? '#ff3355'
      : /LONG/.test(reg) ? '#00e07a'
      : /UNPROVEN/.test(reg) ? '#ffc400' : '#aab6c4';
    // RC-91: the SOURCE alone is not the story. The panel read `today: terrain_live_cache` while
    // serving levels 90 MINUTES old, because the terrain loop stops at the background-logging
    // window (16:30 ET) and nothing on screen said so. Naming the right tap proves only that it
    // was opened. Age and staleness now ride beside the source, in the operator's language.
    const _gsrc = document.getElementById('gsrc');
    if (!(strikes && strikes.today_source)) {
      _gsrc.textContent = 'feed activates at the next console start';
      _gsrc.style.color = '';
    } else if (t && t.levels_stale) {
      const mins = t.levels_age_sec != null ? Math.round(t.levels_age_sec / 60) : null;
      _gsrc.textContent = `STALE — levels ${mins != null ? mins + ' min' : 'unknown age'} old, ` +
        `not refreshing (source: ${strikes.today_source})`;
      _gsrc.style.color = '#ffc400';
      _gsrc.title = String(t.levels_stale_reason || '');
    } else {
      const age = t && t.levels_age_sec != null ? `${Math.round(t.levels_age_sec)}s` : 'live';
      _gsrc.textContent = `today: ${strikes.today_source} · ${age} old`;
      _gsrc.style.color = '';
      _gsrc.title = '';
    }
    // fallback tick: until /api/spot exists on the running server, the 15s
    // cycle's repriced spot still grows the forming candle
    const cs = currentSpot();   // RC-75: one client spot authority — never pick a faucet here
    if (cs != null) noteSpotTick(cs);
    draw(); drawHist();
  } catch (e) {
    document.getElementById('narrator').textContent = 'load failed: ' + e.message;
    feedFresh = false;
    // fail-closed coach: a failed cycle cannot vouch for the numbers it would
    // quote — tooltips say "measuring" until a cycle succeeds (Bugbot HIGH)
    scorecard = null; scorecardStale = null;
    document.getElementById('livedot').className = 'stale';
    document.getElementById('lastdot').style.display = 'none';
    // rebuild zones NOW — hover tooltips read zones built at the last draw,
    // so clearing state without redrawing left stale rates hoverable
    draw(); drawHist();
  }
}

const PADL = 6, PADR = 78, PADT = 14, PADB = 26;

function domain() {
  const i0 = Math.max(0, Math.floor(view.i0)), i1 = Math.min(bars.length, Math.ceil(view.i1));
  if (yLock) return { lo: yLock.lo, hi: yLock.hi };
  let lo = Infinity, hi = -Infinity;
  for (let i = i0; i < i1; i++) { lo = Math.min(lo, bars[i].l); hi = Math.max(hi, bars[i].h); }
  const T = terrain || {};
  for (const v of [T.gamma_flip, T.call_wall, T.put_wall])
    if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  // Live spot must stay in-frame — overnight/extended moves are the honesty case (v2.7)
  const spot = currentSpot();   // RC-75: one client spot authority
  if (spot != null && isFinite(Number(spot))) {
    lo = Math.min(lo, Number(spot)); hi = Math.max(hi, Number(spot));
  }
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  const span = (hi - lo) || 1;
  return { lo: lo - span * 0.05, hi: hi + span * 0.05 };
}

/** RTH 9:30–16:00 America/New_York — matches time_et.RTH_OPEN_MINS/RTH_END_MINS. */
function etSessionTag() {
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York',
    weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(new Date());
  const get = t => { const p = parts.find(x => x.type === t); return p ? p.value : ''; };
  const wd = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[get('weekday')];
  let h = Number(get('hour')); if (h === 24) h = 0;
  const mm = h * 60 + Number(get('minute'));
  if (wd >= 1 && wd <= 5 && mm >= 570 && mm < 960) return null;
  if (wd >= 1 && wd <= 5 && mm < 570) return 'PRE-MKT';
  return 'AFTER-HRS';
}

function niceStep(span, target) {
  const rough = span / target, p = Math.pow(10, Math.floor(Math.log10(rough)));
  for (const m of [1, 2, 2.5, 5, 10]) if (rough <= m * p) return m * p;
  return 10 * p;
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight || 560;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  if (!bars.length) {
    g.fillStyle = '#f4f6f8'; g.font = '800 20px system-ui'; g.textAlign = 'center';
    g.fillText('NO BARS YET', W / 2, H / 2 - 12);
    g.fillStyle = '#aab6c4'; g.font = '700 14px system-ui';
    g.fillText('pre-market, or the console feed is unreachable — retrying every 15s',
      W / 2, H / 2 + 14);
    g.textAlign = 'left';
    document.getElementById('lastdot').style.display = 'none'; return; }

  const { lo, hi } = domain();
  const y = p => PADT + (hi - p) / (hi - lo) * (H - PADT - PADB);
  const px2price = py => hi - (py - PADT) / (H - PADT - PADB) * (hi - lo);
  const nVis = Math.max(view.i1 - view.i0, 1);
  const x = i => PADL + (i - view.i0) * ((W - PADL - PADR) / nVis);
  const px2i = px => view.i0 + (px - PADL) / ((W - PADL - PADR) / nVis);
  scale = { lo, hi, y, x, px2price, px2i, W, H };

  // gridlines + LOUD price scale
  const step = niceStep(hi - lo, 8);
  g.font = '700 13px system-ui';
  for (let p = Math.ceil(lo / step) * step; p <= hi; p += step) {
    const yy = y(p);
    g.strokeStyle = 'rgba(170,182,196,0.14)';
    g.beginPath(); g.moveTo(PADL, yy); g.lineTo(W - PADR, yy); g.stroke();
    g.fillStyle = '#f4f6f8';
    g.fillText(p.toFixed(step < 1 ? 3 : 2), W - PADR + 6, yy + 4);
  }

  zones = [];
  const T = terrain || {};
  // RC-75 one client spot authority — hoisted here (RC-113): the sigma band and off-scale
  // pinning need the frame's spot before the level pass; every later use reads this same const.
  const spot = currentSpot();
  // Fail-closed lean: SIGN_UNPROVEN, UNAVAILABLE, or non-TRUSTED — never paint BUY/SELL advice
  const withholdLean = T.regime === 'SIGN_UNPROVEN' || T.regime === 'UNAVAILABLE'
    || T.confidence !== 'TRUSTED';
  // RC-86 — the drawn band is the strike's HISTOGRAM BUCKET (± half the median strike spacing),
  // which is the correct binning rule and nothing more. It carries no information about the wall:
  // a three-billion-dollar concentration and a thin smear get the same width, because the width
  // is a property of the strike GRID. Per SpotGamma, who originated the terms, a call/put wall is
  // a SINGLE STRIKE, and the two walls are the bounds of ONE range between them.
  //
  // `half` is now null when the grid is unknown. It used to default to a hardcoded 0.5 for every
  // instrument — measured 2026-07-27, the true half is 0.5 (SPY), 1.0 (NVDA), 1.25 (MET), so the
  // fallback drew MET 2.5x too narrow and printed invented bounds at 2dp. That is exactly the
  // state this page was in under RC-79 when the strikes panel served zero rows. Absence of a
  // strike grid now renders as absence: a line, no band, no numeric range.
  const ks = ((strikes && strikes.today && strikes.today.all) || []).map(r => r[0]);
  let half = null;
  if (ks.length > 2) {
    const gaps = []; for (let i = 1; i < ks.length; i++) gaps.push(ks[i] - ks[i - 1]);
    gaps.sort((a, b) => a - b);
    const med = gaps[Math.floor(gaps.length / 2)];
    if (med > 0) half = med / 2;
  }
  const wallLabelYs = [];
  // RC-110: a level that exists but sits beyond the day's auto-scaled window must DEGRADE to
  // an edge marker, never vanish — invisible walls read as "my walls are missing"
  // (operator 2026-07-28: call wall 750 / flip 746.5 against a 734–741 traded range).
  const offScale = [];
  const band = (level, kind) => {
    if (level == null) return;
    const sell = kind === 'call';
    const col = kind === 'both' ? '#ffc400' : sell ? '#ff3355' : '#00e07a';
    const name = kind === 'both' ? 'PUT + CALL WALL' : sell ? 'CALL WALL' : 'PUT WALL';
    // RC-115 operator directive: the range prints ON THE WALL LABEL — the surface the
    // operator reads — with the EARNED per-side value-area bounds (never grid spacing).
    const _rgTxt = (rg, tag) => (rg && rg.lo != null && rg.hi != null)
      ? ` · ${tag}RANGE ${fmt(rg.lo)}–${fmt(rg.hi)}` : '';
    const rangeTxt = kind === 'both'
      ? _rgTxt(T.put_wall_range, 'PUT ') + _rgTxt(T.call_wall_range, 'CALL ')
      : _rgTxt(sell ? T.call_wall_range : T.put_wall_range, '');
    if (level < lo || level > hi) {
      offScale.push({ v: level, col, text: name + ' ' + fmt(level) + rangeTxt,
        tip: name + ' ' + fmt(level) + ' — beyond today\'s traded range; the price axis fits the day\'s bars.' });
      return;
    }
    // RC-86: no strike grid -> no band. A line, not an invented width.
    const yTop = half == null ? y(level) : y(level + half);
    const yBot = half == null ? y(level) : y(level - half);
    if (half != null) {
      g.fillStyle = kind === 'both' ? 'rgba(255,196,0,0.20)'
        : sell ? 'rgba(255,51,85,0.20)' : 'rgba(0,224,122,0.20)';
      g.fillRect(PADL, yTop, W - PADL - PADR, yBot - yTop);
      g.strokeStyle = col; g.lineWidth = 1.5;
      g.strokeRect(PADL, yTop, W - PADL - PADR, yBot - yTop);
    } else {
      g.strokeStyle = col; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(PADL, yTop); g.lineTo(W - PADR, yTop); g.stroke();
    }
    g.fillStyle = col; g.font = '800 14px system-ui';
    // RC-86: the label names the STRIKE. It used to print `739.50–740.50`, a range invented from
    // the strike grid that reads as market structure — the wall is a single strike, and the only
    // real range is the corridor BETWEEN the two walls.
    // RC-83: when both walls land on one strike it is a two-sided concentration, a magnet rather
    // than a barrier. Calling it CALL WALL asserts resistance-above on a level that is equally
    // support-below. The server-side radar was fixed for this; the chart was not, and drew two
    // identical overlapping bands with opposite labels.
    const lean = kind === 'both' ? '  · TWO-SIDED — magnet, not a barrier'
      : withholdLean ? '' : (sell ? '  · DEALERS SELL' : '  · DEALERS BUY');
    g.fillText(`${name} ${fmt(level)}${rangeTxt}${lean}`, PADL + 8, yTop - 5);
    wallLabelYs.push(yTop - 5);
    // Coach numbers are LIVE from the daily scorecard — never a frozen study
    // figure (operator 2026-07-23). Absent scorecard = "measuring", not a
    // stale rate.
    const wh = scorecard && scorecard.wall_hold_trusted;
    const measured = (wh && wh.call_held_pct != null && wh.put_held_pct != null)
      ? `<i>Measured on our own history (updates with each daily scorecard` +
        (scorecard.generated_utc ? `, last ${esc(String(scorecard.generated_utc).slice(0, 10))}` : '') +
        `): call walls held ${wh.call_held_pct}%, put walls ${wh.put_held_pct}% on trusted days.</i>`
      : scorecardStale
        ? `<i>Hold-rate: measuring — the daily scorecard is out of date (` +
          `${esc(String(scorecardStale.stale_reason || 'stale'))}, last ` +
          `${esc(String(scorecardStale.generated_utc || '').slice(0, 10))}), so its numbers are ` +
          `withheld rather than quoted as current.</i>`
        : `<i>Hold-rate: measuring — this number fills from the daily scorecard.</i>`;
    const leanTip = kind === 'both'
      ? `Both walls sit on this ONE strike: heavy standing inventory on the call AND put side.<br>` +
        `Dealer hedging pulls toward it rather than pushing off it — a magnet, not a barrier. ` +
        `A one-sided BUY/SELL read would assert a direction the data does not support.<br>` + measured
      : withholdLean
        ? `Heavy standing option inventory at this strike (structure fact only).<br>` +
          measured + `<br>` +
          `<i>Dealer BUY/SELL lean withheld — regime ${esc(T.regime)} / ${esc(T.confidence)}.</i>`
        : `Heavy standing option inventory — dealer hedging ${sell ? 'sells strength' : 'buys weakness'} ` +
          `at this strike; acts as ${sell ? 'resistance' : 'support'}.<br>` + measured;
    // RC-86: the tooltip states what the drawn band IS — a strike bucket from the chain's own
    // grid — instead of implying a zone the wall operates over. With no grid there is no bucket
    // and the width is simply not claimed.
    const bucket = half == null
      ? `<br><i>Strike spacing unknown for this chain, so no bucket width is drawn or claimed.</i>`
      : `<br><i>Drawn bucket ±${fmt(half)} = half the chain's median strike spacing (chart ` +
        `resolution, not wall size).</i>`;
    const title = kind === 'both' ? `Two-sided gamma wall ${fmt(level)}`
      : `${sell ? 'Call wall' : 'Put wall'} ${fmt(level)}`;
    zones.push({ y0: yTop, y1: yBot,
      tipHtml: `<b>${title}</b><br>` + leanTip + bucket });
  };
  // RC-115: each wall's EARNED range — per-side gamma value area, computed SERVER-side
  // (Market-Profile POC expansion on that side's GEX mass to 68.2%). Shaded behind the wall
  // bands. Never derived client-side and never from the strike grid — the RC-86 falsehood
  // this replaces printed grid spacing as if it were market structure.
  const rangeShade = (rg, kind) => {
    if (!rg || rg.lo == null || rg.hi == null) return;
    const col = kind === 'call' ? '#ff3355' : '#00e07a';
    const name = kind === 'call' ? 'CALL RANGE' : 'PUT RANGE';
    const tip = `<b>${name} ${fmt(rg.lo)}–${fmt(rg.hi)}</b><br>` +
      `${esc(rg.method || '')} — covers ${esc(String(rg.coverage_pct))}% of that side's ` +
      `gamma mass. Recomputed with every terrain refresh.`;
    if (rg.hi < lo || rg.lo > hi) {   // wholly outside the window: pin, never vanish (RC-110)
      offScale.push({ v: (rg.lo + rg.hi) / 2, col,
        text: `${name} ${fmt(rg.lo)}–${fmt(rg.hi)}`, tip });
      return;
    }
    const yT = y(Math.min(rg.hi, hi)), yB = y(Math.max(rg.lo, lo));
    g.fillStyle = kind === 'call' ? 'rgba(255,51,85,0.07)' : 'rgba(0,224,122,0.07)';
    g.fillRect(PADL, yT, W - PADL - PADR, yB - yT);
    g.strokeStyle = col; g.lineWidth = 1; g.setLineDash([2, 4]);
    g.strokeRect(PADL, yT, W - PADL - PADR, yB - yT); g.setLineDash([]);
    g.fillStyle = col; g.font = '700 12px system-ui';
    g.fillText(`${name} ${fmt(rg.lo)}–${fmt(rg.hi)} · 68% gamma VA`, PADL + 8,
      kind === 'call' ? yT - 4 : Math.min(yB, H - PADB) + 14);
    zones.push({ y0: yT, y1: yB, tipHtml: tip });
  };
  rangeShade(T.put_wall_range, 'put');
  rangeShade(T.call_wall_range, 'call');

  // RC-83: one strike carrying both walls is ONE two-sided level, not two opposing ones —
  // but it is still BOTH walls, and the label says so (RC-115: 'GAMMA WALL' alone erased
  // the put/call framing the operator reads).
  if (T.call_wall != null && T.put_wall != null && Number(T.call_wall) === Number(T.put_wall)) {
    band(T.call_wall, 'both');
  } else {
    band(T.call_wall, 'call'); band(T.put_wall, 'put');
  }

  // ALL other key levels — bright, labeled, each with a coach tooltip
  const levels = [
    ['gamma_flip', 'FLIP', '#f4f6f8', 'The regime line — amplify below, dampen above.', [7, 5]],
    ['gamma_pin', 'PIN', '#c792ff', 'Largest gamma strike — tested NULL as a price magnet on our data; structure only.', []],
    ['hvl', 'HVL', '#33aaff', 'Highest-volatility level (absolute gamma) — SpotGamma-style anchor.', []],
    ['max_pain', 'MAX PAIN', '#ff66cc', 'Strike minimizing option-holder value — expiry-day context only.', []],
    ['key_delta_strike', 'KDS', '#00e5ff', 'Biggest total delta strike — hedging magnet candidate (unproven).', []],
    ['hvp', 'HVP', '#ffc400', 'Amplification pocket — most negative dealer gamma strike.', [2, 3]],
    ['lvp', 'LVP', '#00e07a', 'Damping pocket — most positive dealer gamma strike.', [2, 3]],
    ['call_charm_wall', 'C-CHARM', '#ff9e40', 'Largest call charm strike — hedge decay flow into the close.', [4, 3]],
    ['put_charm_wall', 'P-CHARM', '#40ffd0', 'Largest put charm strike — hedge decay flow into the close.', [4, 3]],
  ];
  // one item list (terrain levels labeled RIGHT, yesterday rows labeled LEFT);
  // draw the lines first, then lay the labels out with a collision pass so
  // levels sharing a price NEVER overlap (operator 2026-07-23)
  const pdRows = [
    ['pdh', 'PDH', [8, 4], "Yesterday's high — widely watched breakout/rejection reference."],
    ['pdl', 'PDL', [8, 4], "Yesterday's low — widely watched breakdown/reclaim reference."],
    ['pdc', 'PDC', [2, 3], "Yesterday's close — the gap fills or holds against this price."],
  ];
  const lvlItems = [];
  for (const [key, lab, col, why, dash] of levels) {
    const v = T[key]; if (v == null) continue;
    if (v < lo || v > hi) {   // RC-110: degrade to an edge marker, never vanish
      offScale.push({ v, col, text: `${lab} ${fmt(v)}`, tip: `${lab} ${fmt(v)} — ${why}` });
      continue;
    }
    const leanTips = {
      gamma_flip: 'Landmark strike only — structure fact; amplify/dampen lean withheld for this read.',
      hvp: 'Most negative gamma strike — structure fact; amplification lean withheld.',
      lvp: 'Most positive gamma strike — structure fact; damping lean withheld.',
    };
    const tipWhy = (withholdLean && leanTips[key]) || why;
    lvlItems.push({ v, text: `${lab} ${fmt(v)}`, col, dash,
      lw: key === 'gamma_flip' ? 2 : 1.25, side: 'right',
      tipHtml: `<b>${lab} ${fmt(v)}</b><br>${tipWhy}` });
  }
  for (const [k, lab, dash, why] of pdRows) {
    const v = daily && daily[k]; if (v == null) continue;
    if (v < lo || v > hi) {   // RC-110
      offScale.push({ v, col: '#f4f6f8', text: `${lab} ${fmt(v)}`, tip: `${lab} ${fmt(v)} — ${why}` });
      continue;
    }
    lvlItems.push({ v, text: `${lab} ${fmt(v)}`, col: '#f4f6f8', dash, lw: 1.25,
      side: 'left', tipHtml: `<b>${lab} ${fmt(v)}</b><br>${why}` });
  }
  for (const it of lvlItems) {
    const yy = y(it.v);
    g.strokeStyle = it.col; g.lineWidth = it.lw;
    g.setLineDash(it.dash); g.beginPath(); g.moveTo(PADL, yy); g.lineTo(W - PADR, yy);
    g.stroke(); g.setLineDash([]);
    zones.push({ y0: yy - 6, y1: yy + 6, tipHtml: it.tipHtml });
  }
  g.font = '700 12px system-ui';
  for (const side of ['right', 'left']) {
    const list = lvlItems.filter(i => i.side === side).sort((a, b) => y(a.v) - y(b.v));
    const fixed = side === 'left' ? wallLabelYs.slice().sort((a, b) => a - b) : [];
    let prev = -Infinity;
    for (const it of list) {
      let pos = Math.max(y(it.v) - 4, prev + 13);
      for (const fy of fixed) if (Math.abs(pos - fy) < 13) pos = fy + 13;
      prev = pos;
      g.fillStyle = it.col;
      g.fillText(it.text, side === 'right' ? W - PADR - 92 : PADL + 8, pos);
    }
  }

  // ── RC-113: WALL RANGE + sigma band, to the named institutional standard ──────────────
  // SpotGamma — whose levels product ships on Bloomberg — defines the wall as ONE strike
  // and THE range as the corridor BETWEEN the put wall and the call wall (the dealer-
  // hedging containment zone; their published hold rates: call wall 83%, put wall 89% of
  // sessions). The sigma overlay is the Implied 1-Day Move: a one-standard-deviation band.
  // Nothing here is invented client-side: the corridor is the two walls the server already
  // certified, and the band half-width comes from the payload's ATM-IV computation.
  if (T.call_wall != null && T.put_wall != null
      && Number(T.call_wall) !== Number(T.put_wall)) {
    const wLo = Math.min(Number(T.put_wall), Number(T.call_wall));
    const wHi = Math.max(Number(T.put_wall), Number(T.call_wall));
    if (wLo < hi && wHi > lo) {
      const yA = y(Math.min(wHi, hi)), yB = y(Math.max(wLo, lo));
      g.fillStyle = 'rgba(143,168,255,0.055)';
      g.fillRect(PADL, yA, W - PADL - PADR, yB - yA);
      g.fillStyle = 'rgba(143,168,255,0.9)'; g.font = '700 12px system-ui';
      g.fillText(`WALL RANGE ${fmt(wLo)} ↔ ${fmt(wHi)}`, PADL + 8, Math.min(yB, H - PADB) - 8);
      zones.push({ y0: yA, y1: yB, tipHtml:
        `<b>WALL RANGE ${fmt(wLo)} ↔ ${fmt(wHi)}</b><br>` +
        `The dealer-hedging containment corridor between the put wall and the call wall — ` +
        `the institutional range definition (SpotGamma standard, as shipped on Bloomberg: ` +
        `the wall is one strike; THE range is between the walls).` });
    }
  }
  const _em = T.implied_1d_move;
  if (_em && _em.points != null && spot != null && isFinite(Number(spot))) {
    for (const pair of [[Number(spot) + _em.points, '+1σ EM'],
                        [Number(spot) - _em.points, '−1σ EM']]) {
      const v = pair[0], lab = pair[1];
      const tip = `${lab} ${fmt(v)} — Implied 1-Day Move (68.3% one-sigma band centered on ` +
                  `the live spot): ${_em.method}. ATM IV ${_em.iv_pct_atm}%.`;
      if (v < lo || v > hi) {
        offScale.push({ v, col: '#8fa8ff', text: `${lab} ${fmt(v)}`, tip });
        continue;
      }
      const yy = y(v);
      g.strokeStyle = '#8fa8ff'; g.lineWidth = 1.25; g.setLineDash([3, 4]);
      g.beginPath(); g.moveTo(PADL, yy); g.lineTo(W - PADR, yy); g.stroke(); g.setLineDash([]);
      g.fillStyle = '#8fa8ff'; g.font = '700 12px system-ui';
      g.fillText(`${lab} ${fmt(v)}`, W - PADR - 170, yy - 4);
      zones.push({ y0: yy - 6, y1: yy + 6, tipHtml: `<b>${tip}</b>` });
    }
  }

  // RC-110: everything collected as off-scale renders as a compact pinned row at the chart
  // edge it sits beyond — with its real price and a tooltip — so "present but out of window"
  // can never be confused with "absent".
  const pinRow = (items, top) => {
    if (!items.length) return;
    items.sort((a, b) => a.v - b.v);
    const yy = top ? PADT + 13 : H - PADB - 5;
    g.font = '800 12px system-ui';
    // The big-legend DOM overlay owns the top-left corner — start the top pin row past it.
    let xx = top ? PADL + 400 : PADL + 8;
    for (const o of items) {
      const t = (top ? '▲ ' : '▼ ') + o.text;
      g.fillStyle = o.col; g.fillText(t, xx, yy);
      xx += g.measureText(t).width + 18;
    }
    zones.push({ y0: yy - 11, y1: yy + 3,
      tipHtml: `<b>Off-scale ${top ? 'above' : 'below'} today's traded range</b><br>`
        + items.map(o => o.tip || o.text).join('<br>') });
  };
  pinRow(offScale.filter(o => o.v > hi), true);
  pinRow(offScale.filter(o => o.v < lo), false);

  // candles — thick and bright
  const bw = Math.max(2, Math.min(13, (W - PADL - PADR) / nVis - 2));
  const i0 = Math.max(0, Math.floor(view.i0)), i1 = Math.min(bars.length, Math.ceil(view.i1));
  for (let i = i0; i < i1; i++) {
    const b = bars[i], up = b.c >= b.o, cx = x(i) + bw / 2;
    g.strokeStyle = up ? '#00e07a' : '#ff3355'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(cx, y(b.h)); g.lineTo(cx, y(b.l)); g.stroke();
    g.fillStyle = up ? '#00e07a' : '#ff3355';
    g.fillRect(x(i), y(Math.max(b.o, b.c)), bw, Math.max(1.5, Math.abs(y(b.o) - y(b.c))));
  }

  // pulsing marker only while canonical 1m tip is fresh (same gate as #livedot)
  const dotEl = document.getElementById('lastdot');
  const lb = bars[bars.length - 1];
  const ldx = x(bars.length - 1) + bw / 2, ldy = y(lb.c);
  if (feedFresh && ldx > PADL && ldx < W - PADR && ldy > PADT && ldy < H - PADB) {
    dotEl.style.left = (ldx - 5) + 'px'; dotEl.style.top = (ldy - 5) + 'px';
    dotEl.style.display = 'block';
  } else dotEl.style.display = 'none';

  // session VWAP — computed on canonical 1m rows only, sampled per visible bar
  if (daily && daily.vwap.length) {
    const t0 = daily.vwap[0][0];
    g.strokeStyle = '#ff8c00'; g.lineWidth = 2; g.beginPath();
    let started = false, lastPt = null;
    for (let i = i0; i < i1; i++) {
      const b = bars[i]; if (!b || b.t < t0) continue;
      const tEnd = i + 1 < bars.length ? bars[i + 1].t : Infinity;
      const w = vwapAt(tEnd); if (w == null) continue;
      const px = x(i) + bw / 2, py = y(w);
      if (!started) { g.moveTo(px, py); started = true; } else g.lineTo(px, py);
      lastPt = [px, py];
    }
    g.stroke();
    if (lastPt) { g.fillStyle = '#ff8c00'; g.font = '800 13px system-ui';
      g.fillText('VWAP', Math.min(lastPt[0] + 6, W - PADR - 46), lastPt[1] - 6); }
  }

  // time scale
  g.fillStyle = '#aab6c4'; g.font = '700 12px system-ui';
  for (let k = 0; k <= 5; k++) {
    const i = Math.round(view.i0 + (nVis - 1) * k / 5);
    if (!bars[i]) continue;
    const d = new Date(bars[i].t * 1000);
    const lab = tf === 'D' ? d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
      : d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    g.fillText(lab, Math.min(x(i), W - PADR - 46), H - 8);
  }

  // event badges
  for (const cr of crosses) {
    const lv = cr.level_value; if (lv == null || lv < lo || lv > hi) continue;
    const yv = y(lv);
    g.fillStyle = '#ffc400';
    g.beginPath(); g.arc(W - PADR - 16, yv, 5, 0, 6.283); g.fill();
    zones.push({ y0: yv - 7, y1: yv + 7,
      tipHtml: `<b>${esc(cr.level_name || 'level')} ${fmt(lv)} crossed ${esc(cr.direction || '')}</b>` +
        `<br><i>Recent crossing from the console's own log.</i>` });
  }

  // spot — ONE price authority app-wide (resolve_spot, RC-14). Candles end at the
  // last regular-session bar, so outside RTH the live spot can sit far from the
  // last close; the dashed line + session label make that gap self-explanatory.
  // Auto domain includes spot; under yLock clamp to the pane edge so the cue never vanishes.
  // (`spot` is hoisted to the top of draw() — RC-113 — and read here unchanged.)
  // RC-81: every spot display repaints from THIS value in THIS frame. The meta bar used to be
  // written only by the 15s load() cycle, so it lagged the legend below it by up to a full cycle.
  const _mpx = document.getElementById('metapx');
  if (_mpx) _mpx.textContent = fmt(spot);
  // RC-111: the gamma panel's canvas SPOT marker must tick with THIS frame too — it froze at
  // its last data-load repaint, and the screen showed two spots at once (RC-81 class; canvas
  // markers were outside RC-81's DOM enumeration).
  if (spot != null && _gammaSpotDrawn != null
      && Math.abs(Number(spot) - _gammaSpotDrawn) > 1e-9) drawGamma();
  const bl = document.getElementById('biglegend');
  if (spot != null && isFinite(Number(spot))) {
    // TradingView-style big legend: ticker · price · change vs yesterday's close
    const pdc = daily && daily.pdc;
    const dn = pdc ? Number(spot) - pdc : null;
    const col = dn == null ? '#f4f6f8' : dn >= 0 ? '#00e07a' : '#ff3355';
    const sym = esc((document.getElementById('tk').value || 'SPY').trim().toUpperCase());
    bl.innerHTML = `<span class="sym">${sym}</span> ` +
      `<span class="px" style="color:${col}">${fmt(spot)}</span>` +
      (dn == null ? '' : ` <span class="chg" style="color:${col}">${dn >= 0 ? '+' : ''}${dn.toFixed(2)} ` +
        `(${(dn / pdc * 100).toFixed(2)}%) vs yday close</span>`);
  } else bl.innerHTML = '';
  if (spot != null && isFinite(Number(spot))) {
    const off = Number(spot) < lo || Number(spot) > hi;
    const ys = Math.max(PADT + 2, Math.min(H - PADB - 2, y(Number(spot))));
    g.strokeStyle = 'rgba(255,196,0,0.55)'; g.lineWidth = 1; g.setLineDash([2, 3]);
    g.beginPath(); g.moveTo(PADL, ys); g.lineTo(W - PADR, ys); g.stroke();
    g.setLineDash([]);
    g.fillStyle = '#ffc400'; g.font = '800 14px system-ui';
    g.fillRect(W - PADR, ys - 10, PADR - 2, 20);
    g.fillStyle = '#05070a';
    g.fillText((off ? (Number(spot) > hi ? '↑ ' : '↓ ') : '') + fmt(spot), W - PADR + 4, ys + 5);
    const sess = etSessionTag();
    if (sess) {
      g.fillStyle = '#ffc400'; g.font = '800 11px system-ui';
      g.fillText(sess, W - PADR + 6, ys - 14);
    }
    zones.push({ y0: ys - 6, y1: ys + 6,
      tipHtml: `<b>Live price ${fmt(spot)}</b>` +
        (off ? ' <i>(outside locked Y range)</i>' : '') + `<br>` +
        `One price authority feeds every screen. Candles end at the last ` +
        `regular-session bar, so outside market hours the live price can sit ` +
        `away from the last candle — that gap is the overnight move, not a ` +
        `disagreement between data sources.` });
  }

  // crosshair + readout
  if (cross) {
    const { mx, my } = cross;
    g.strokeStyle = 'rgba(244,246,248,0.45)'; g.setLineDash([4, 4]); g.lineWidth = 1;
    g.beginPath(); g.moveTo(mx, PADT); g.lineTo(mx, H - PADB); g.stroke();
    g.beginPath(); g.moveTo(PADL, my); g.lineTo(W - PADR, my); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#33aaff'; g.fillRect(W - PADR, my - 10, PADR - 2, 20);
    g.fillStyle = '#05070a'; g.font = '800 13px system-ui';
    g.fillText(fmt(px2price(my)), W - PADR + 6, my + 5);
    const bi = Math.floor(px2i(mx));
    if (bars[bi]) {
      const b = bars[bi];
      g.fillStyle = '#f4f6f8'; g.font = '700 13px system-ui';
      g.fillText(`O ${fmt(b.o)}  H ${fmt(b.h)}  L ${fmt(b.l)}  C ${fmt(b.c)}` +
        (b.v ? `  V ${b.v.toLocaleString()}` : ''), PADL + 6, 72);   // below big legend
    }
  }
}

function drawHist() {
  drawGamma();   // gamma panel renders in every state, including feed-absent
  const dpr = window.devicePixelRatio || 1;
  const W = 230, H = hv.clientHeight || 560;
  hv.width = W * dpr; hv.height = H * dpr;
  const g = hv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  if (!scale) return;
  g.font = '700 12px system-ui';
  if (!strikes) { g.fillStyle = '#aab6c4';
    g.fillText('histogram activates at the', 12, 26);
    g.fillText('next console start', 12, 42); return; }
  const { y } = scale;
  const rows = (strikes.today || {})[scope] || [];
  const ghost = showGhost ? ((strikes.prior || {})[scope] || []) : [];
  const inView = r => r[0] >= scale.lo && r[0] <= scale.hi;
  const vis = rows.filter(inView), gvis = ghost.filter(inView);
  const maxG = Math.max(1, ...vis.map(r => Math.abs(r[1])), ...gvis.map(r => Math.abs(r[1])));
  const maxV = Math.max(1, ...vis.map(r => r[2]));
  const x0 = 6, wMax = 158;
  g.fillStyle = '#f4f6f8';
  g.fillText(`GAMMA / STRIKE (${scope.toUpperCase()})`, x0, 14);
  g.strokeStyle = 'rgba(199,146,255,0.8)'; g.setLineDash([3, 2]);
  for (const r of gvis) g.strokeRect(x0, y(r[0]) - 3, Math.max(Math.abs(r[1]) / maxG * wMax, 1), 6);
  g.setLineDash([]);
  for (const r of vis) {
    g.fillStyle = r[1] >= 0 ? '#33aaff' : '#ff3355';
    g.fillRect(x0, y(r[0]) - 3, Math.max(Math.abs(r[1]) / maxG * wMax, 1), 6);
    const wv = r[2] / maxV * wMax;
    if (wv > 0.5) { g.fillStyle = '#ffc400'; g.fillRect(x0, y(r[0]) + 4, wv, 2.5); }
  }
  g.fillStyle = '#aab6c4';
  g.fillText('■ +γ  ■ −γ  ▁ volume', x0, H - 24);
  if (showGhost) g.fillText('▢ yesterday (ghost)', x0, H - 10);
}

/* ── gamma panel: the two full-size charts from the CR-03 mockup ──────────
   1 · POSITIONING MIGRATION — today's per-strike gamma (solid) vs yesterday
       (ghost outlines), strikes on the X axis
   2 · WHERE TODAY'S OPTION VOLUME IS — per-strike volume vs the walls
   scroll = more/fewer strikes · drag = slide the strike window · hover = numbers */
const gvEl = document.getElementById('gv');
let gWin = { n: 24, off: 0 };
let gZones = [];
let gHover = null;        // hovered strike band index
let gLayout = null;       // {bandW, count} of the last gamma render

const fmtBig = v => {
  if (v == null) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return (v / 1e3).toFixed(0) + 'K';
  return Number(v).toFixed(0);
};

// RC-111: the value this panel last painted its SPOT marker at. The candle pane compares the
// live spot against it every frame and re-triggers the panel when they diverge — two rendered
// spots on one screen is the RC-81 class, and canvas markers were outside RC-81's enumeration.
let _gammaSpotDrawn = null;

function drawGamma() {
  const dpr = window.devicePixelRatio || 1;
  const W = gvEl.clientWidth, H = gvEl.clientHeight || 430;
  gvEl.width = W * dpr; gvEl.height = H * dpr;
  const g = gvEl.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  g.strokeStyle = '#2b3646'; g.beginPath(); g.moveTo(0, 0.5); g.lineTo(W, 0.5); g.stroke();
  const coach1 = document.getElementById('coach1'), coach2 = document.getElementById('coach2');
  const rows = ((strikes && strikes.today) || {})[scope] || [];
  if (!rows.length) {
    gZones = []; gLayout = null;
    coach1.style.display = coach2.style.display = 'none';
    g.fillStyle = '#f4f6f8'; g.font = '800 14px system-ui';
    g.fillText('GAMMA PANEL — migration + volume by strike', 14, 28);
    g.fillStyle = '#aab6c4'; g.font = '700 13px system-ui';
    g.fillText('activates at the next console start (per-strike feed not on the running server yet)', 14, 52);
    return;
  }

  const priorRows = ((strikes && strikes.prior) || {})[scope] || [];
  const ghost = new Map(priorRows.map(r => [r[0], r[1]]));
  const spot = currentSpot();   // RC-75: one client spot authority
  _gammaSpotDrawn = spot == null ? null : Number(spot);   // RC-111
  let c = 0, best = Infinity;
  for (let i = 0; i < rows.length; i++) {
    const d = Math.abs(rows[i][0] - (spot ?? rows[i][0]));
    if (d < best) { best = d; c = i; }
  }
  gWin.off = Math.max(-c, Math.min(rows.length - 1 - c, gWin.off));
  const i0 = Math.max(0, c - gWin.n + gWin.off);
  const i1 = Math.min(rows.length, c + gWin.n + gWin.off);
  const vis = rows.slice(i0, i1);
  if (!vis.length) return;
  const CARDW = W > 980 ? 330 : 0;   // reserve the right rail for the coach cards
  const bandW = (W - 24 - CARDW) / vis.length;
  const xs = i => 12 + i * bandW;
  gLayout = { bandW, count: vis.length };

  const base1 = H * 0.45, amp1 = H * 0.30, base2 = H * 0.93, amp2 = H * 0.27;
  const maxG = Math.max(1, ...vis.map(r => Math.abs(r[1])),
    ...vis.map(r => Math.abs(ghost.get(r[0]) || 0)));
  const maxV = Math.max(1, ...vis.map(r => r[2] || 0));

  g.font = '800 14px system-ui'; g.fillStyle = '#f4f6f8';
  g.fillText('1 · POSITIONING MIGRATION — today (solid) vs yesterday (ghost)', 14, 24);
  g.fillText("2 · WHERE TODAY'S OPTION VOLUME IS — vs the walls", 14, H * 0.61);
  g.strokeStyle = 'rgba(170,182,196,0.35)';
  g.beginPath(); g.moveTo(12, base1); g.lineTo(W - 12, base1); g.stroke();
  g.beginPath(); g.moveTo(12, base2); g.lineTo(W - 12, base2); g.stroke();

  gZones = [];
  g.lineWidth = 1.5;
  for (let i = 0; i < vis.length; i++) {
    const [k, gx, vol] = vis[i], gy = ghost.get(k);
    const x0 = xs(i), bwS = Math.max(2, bandW * 0.44), bwG = Math.max(3, bandW * 0.62);
    if (i === gHover) { g.fillStyle = 'rgba(244,246,248,0.08)';
      g.fillRect(x0, 30, bandW, H - 50); }
    if (gy != null && showGhost) {
      const h = Math.abs(gy) / maxG * amp1;
      g.strokeStyle = '#c792ff'; g.setLineDash([3, 2]);
      g.strokeRect(x0 + (bandW - bwG) / 2, gy >= 0 ? base1 - h : base1, bwG, h);
      g.setLineDash([]);
    }
    const h = Math.abs(gx) / maxG * amp1;
    g.fillStyle = gx >= 0 ? '#33aaff' : '#ff3355';
    g.fillRect(x0 + (bandW - bwS) / 2, gx >= 0 ? base1 - h : base1, bwS, h);
    const hv2 = (vol || 0) / maxV * amp2;
    g.fillStyle = '#ffc400';
    g.fillRect(x0 + (bandW - bwS) / 2, base2 - hv2, bwS, hv2);
    const dG = gy != null ? gx - gy : null;
    gZones.push({ x0, x1: x0 + bandW,
      tipHtml: `<b>Strike ${fmt(k)}</b><br>` +
        `Dealer gamma today: ${fmtBig(gx)}<br>` +
        `Yesterday: ${gy != null ? fmtBig(gy) : 'no wide capture'}` +
        (dG != null ? ` · shift ${dG >= 0 ? '+' : ''}${fmtBig(dG)}` : '') +
        `<br>Option volume today: ${fmtBig(vol)}` });
    if (bandW > 26 || (Math.round(k) === k && Math.round(k) % 5 === 0)) {
      g.fillStyle = '#aab6c4'; g.font = '700 11px system-ui';
      g.fillText(fmt(k, 0), x0 + bandW / 2 - 9, H - 8);
    }
  }

  // spot + walls, marked on both charts
  const T = terrain || {};
  const mark = (price, col, lab, yTop) => {
    if (price == null) return;
    let xi = null;
    for (let i = 0; i < vis.length; i++)
      if (Math.abs(vis[i][0] - price) < 1e-9) { xi = xs(i) + bandW / 2; break; }
    if (xi == null) {
      if (price < vis[0][0] || price > vis[vis.length - 1][0]) return;
      for (let i = 1; i < vis.length; i++)
        if (vis[i][0] >= price) {
          xi = xs(i - 1) + bandW / 2 +
            (price - vis[i - 1][0]) / (vis[i][0] - vis[i - 1][0]) * bandW; break; }
    }
    if (xi == null) return;
    g.strokeStyle = col; g.lineWidth = 2; g.setLineDash([6, 4]);
    g.beginPath(); g.moveTo(xi, yTop); g.lineTo(xi, H - 20); g.stroke(); g.setLineDash([]);
    g.fillStyle = col; g.font = '800 12px system-ui';
    g.fillText(lab, Math.min(xi + 5, W - CARDW - 120), yTop + 12);
  };
  mark(spot, '#ffc400', `SPOT ${fmt(spot)}`, 30);
  mark(T.call_wall, '#ff3355', `CALL WALL ${fmt(T.call_wall, 0)}`, 46);
  mark(T.put_wall, '#00e07a', `PUT WALL ${fmt(T.put_wall, 0)}`, 62);

  // measured migration line: biggest per-strike shifts vs yesterday
  const deltas = vis.filter(r => ghost.get(r[0]) != null)
    .map(r => [r[0], r[1] - ghost.get(r[0])])
    .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 3);
  if (deltas.length && !CARDW) {
    g.fillStyle = '#c792ff'; g.font = '700 12px system-ui';
    g.fillText('biggest shifts vs yesterday: ' + deltas.map(([k, d]) =>
      `${fmt(k, 0)} ${d >= 0 ? '+' : ''}${fmtBig(d)}`).join(' · '), 14, 42);
  }

  // coach cards (right rail) — every number computed from the data above
  if (!CARDW) { coach1.style.display = coach2.style.display = 'none'; return; }
  const withG = vis.filter(r => ghost.get(r[0]) != null);
  if (!withG.length) {
    coach1.innerHTML = '<b>Coach: migration view warming up</b>' +
      'The first day-over-day comparison lands after the next wide morning capture.';
  } else {
    const wmean = pick => {
      let s2 = 0, w2 = 0;
      for (const r of withG) { const v = pick(r); if (v > 0) { s2 += r[0] * v; w2 += v; } }
      return w2 ? s2 / w2 : null;
    };
    const wmT = wmean(r => r[1]), wmY = wmean(r => ghost.get(r[0]));
    const dir = (wmT != null && wmY != null)
      ? (wmT - wmY > 0.15 ? 'UP the chain' : wmY - wmT > 0.15 ? 'DOWN the chain' : 'with little net drift')
      : 'with no positive-gamma mass in view';
    const sorted = withG.map(r => [r[0], r[1] - ghost.get(r[0])])
      .sort((a, b) => b[1] - a[1]);
    const grew = sorted.filter(d => d[1] > 0).slice(0, 2).map(d => fmt(d[0], 0)).join('/');
    const shrank = sorted.filter(d => d[1] < 0).slice(-2).map(d => fmt(d[0], 0)).join('/');
    coach1.innerHTML = `<b>Coach: positive gamma mass moved ${dir}</b>` +
      (grew ? `Grew most at ${grew}` : 'No strike grew') +
      (shrank ? `; shrank most at ${shrank}. ` : '. ') +
      `Opened or closed? Tomorrow's ΔOI confirms.`;
  }
  const byVol = vis.slice().sort((a, b) => (b[2] || 0) - (a[2] || 0)).slice(0, 2)
    .filter(r => (r[2] || 0) > 0);
  if (byVol.length) {
    const kk = byVol.map(r => r[0]);
    const loc = (T.call_wall != null && Math.min(...kk) > T.call_wall) ? 'ABOVE the call wall'
      : (T.put_wall != null && Math.max(...kk) < T.put_wall) ? 'BELOW the put wall'
      : 'inside the wall range';
    coach2.innerHTML = `<b>Coach: heaviest option trading at ${kk.map(k => fmt(k, 0)).join('–')}</b>` +
      `That is ${loc}. Activity fact only — buyer/seller split stays unproven until the ΔOI test.`;
    coach2.style.display = 'block';
  } else coach2.style.display = 'none';
  coach1.style.display = 'block';
}

let gDrag = null;
gvEl.addEventListener('wheel', ev => {
  ev.preventDefault();
  const d = ev.deltaY || ev.deltaX;
  gWin.n = Math.round(Math.max(6, Math.min(400, gWin.n * (d > 0 ? 1.25 : 0.8))));
  drawGamma();
}, { passive: false });
gvEl.addEventListener('mousedown', ev => { gDrag = { x: ev.clientX, off: gWin.off }; });
window.addEventListener('mouseup', () => { gDrag = null; });
gvEl.addEventListener('mousemove', ev => {
  if (gDrag) {
    const bandW = (gvEl.clientWidth - 24) / Math.max(1, gWin.n * 2);
    gWin.off = gDrag.off - Math.round((ev.clientX - gDrag.x) / Math.max(bandW, 1));
    drawGamma(); return;
  }
  const r = gvEl.getBoundingClientRect();
  const mx = ev.clientX - r.left;
  if (gLayout) {
    const idx = Math.floor((mx - 12) / gLayout.bandW);
    const h2 = (idx >= 0 && idx < gLayout.count) ? idx : null;
    if (h2 !== gHover) { gHover = h2; drawGamma(); }
  }
  const z = gZones.find(z => mx >= z.x0 && mx < z.x1);
  if (z) { tip.innerHTML = z.tipHtml; tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX + 16, window.innerWidth - 400) + 'px';
    tip.style.top = (ev.clientY + 16) + 'px';
  } else tip.style.display = 'none';
});
gvEl.addEventListener('mouseleave', () => {
  tip.style.display = 'none';
  if (gHover !== null) { gHover = null; drawGamma(); }
});

/* ── interactions: wheel zoom, drag pan (x+y), dbl-click fit, crosshair ── */
wrap.addEventListener('wheel', ev => {
  ev.preventDefault();
  if (!bars.length || !scale) return;
  const r = wrap.getBoundingClientRect();
  const d = ev.deltaY || ev.deltaX;
  const f = d > 0 ? 1.18 : 1 / 1.18;
  if (ev.shiftKey) {
    // shift+scroll: chart TALLER/SHORTER (price span), anchored at the cursor
    const dom = yLock || domain();
    const anchorP = scale.px2price(ev.clientY - r.top);
    let span = (dom.hi - dom.lo) * f;
    span = Math.max(0.02, Math.min((dom.hi - dom.lo) * 50, span));
    const frac = (dom.hi - anchorP) / (dom.hi - dom.lo);
    const hi = anchorP + frac * span;
    yLock = { lo: hi - span, hi };
  } else {
    // plain scroll: chart WIDER (scroll up) / NARROWER (scroll down),
    // anchored at the bar under the cursor (operator correction 2026-07-23)
    const anchor = scale.px2i(ev.clientX - r.left);
    let w = (view.i1 - view.i0) * f;
    w = Math.max(12, Math.min(bars.length * 1.2, w));
    const frac = (anchor - view.i0) / (view.i1 - view.i0);
    view.i0 = anchor - frac * w; view.i1 = view.i0 + w;
    clampView();
  }
  draw(); drawHist();
}, { passive: false });

let drag = null;
wrap.addEventListener('mousedown', ev => {
  drag = { mx: ev.clientX, my: ev.clientY, v: { ...view }, moved: 0,
           dom: yLock ? { ...yLock } : domain() };
});
window.addEventListener('mouseup', () => {
  if (drag && drag.moved > 3) lastDragEnd = performance.now();
  drag = null;
});
wrap.addEventListener('dblclick', () => {
  // a fast pair of drags must NOT be read as "reset view" (snap-back class)
  if (performance.now() - lastDragEnd < 500) return;
  yLock = null; view = null; setBars(); draw(); drawHist();
});
document.getElementById('fit').addEventListener('click', () => {
  yLock = null; view = null; setBars(); draw(); drawHist(); });

wrap.addEventListener('mousemove', ev => {
  const r = wrap.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  if (drag && scale) {
    drag.moved = Math.max(drag.moved,
      Math.abs(ev.clientX - drag.mx) + Math.abs(ev.clientY - drag.my));
    const dxBars = (drag.mx - ev.clientX) / ((scale.W - PADL - PADR) / (view.i1 - view.i0));
    view.i0 = drag.v.i0 + dxBars; view.i1 = drag.v.i1 + dxBars;
    clampView();
    const span = drag.dom.hi - drag.dom.lo;
    const dy = (ev.clientY - drag.my) / (scale.H - PADT - PADB) * span;
    yLock = { lo: drag.dom.lo + dy, hi: drag.dom.hi + dy };
    cross = { mx, my }; draw(); drawHist(); return;
  }
  cross = { mx, my };
  const hits = zones.filter(z => my >= z.y0 && my <= z.y1);
  if (hits.length) {
    tip.innerHTML = hits.map(h => h.tipHtml)
      .join('<div style="border-top:1px solid var(--border);margin:7px 0"></div>');
    tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX + 16, window.innerWidth - 400) + 'px';
    tip.style.top = (ev.clientY + 16) + 'px';
  } else tip.style.display = 'none';
  draw();
});
wrap.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross = null; draw(); });

function chip(id, fn) { document.getElementById(id).addEventListener('click', fn); }
for (const el of document.querySelectorAll('.tf')) {
  el.addEventListener('click', () => {
    tf = el.dataset.tf;
    for (const e2 of document.querySelectorAll('.tf')) e2.classList.toggle('on', e2 === el);
    view = null; yLock = null; setBars(); draw(); drawHist();
  });
}
function setScope(s) {
  scope = s;
  for (const [id, v] of [['exp-all', 'all'], ['exp-near', 'near'], ['exp-far', 'far']])
    document.getElementById(id).classList.toggle('on', v === s);
  drawHist();
}
chip('exp-all', () => setScope('all'));
chip('exp-near', () => setScope('near'));
chip('exp-far', () => setScope('far'));
chip('ghost', () => { showGhost = !showGhost;
  document.getElementById('ghost').classList.toggle('on', showGhost); drawHist(); });
chip('learn', () => { learning = !learning;
  document.getElementById('learn').classList.toggle('on', learning);
  document.getElementById('coachlines').innerHTML = learning
    ? ((terrain || {}).lines || []).map(l => '· ' + esc(l)).join('<br>') : ''; });
document.getElementById('tk').addEventListener('change', () => {
  view = null; yLock = null; liveSpot = null; liveSpotAsOf = 0;
  forming = null; sealedForming = null; chartTicker = null; load(); });

// fast spot poll (1.5s behind 1.25s server cache). Fail-closed on error.
// In-flight guard + spot_as_of_ts_utc: a slow reply never overwrites a fresher tick.
let spotPollInflight = false;
let liveSpotAsOf = 0;
// RC-75 — THE CLIENT SPOT AUTHORITY. Every rendered spot reads through this and nothing else.
// Five call sites used to inline their own precedence: the drawn price line included liveSpot
// while the cycle tick, the level bands, the gamma mark and the fallback helper all SKIPPED it,
// so the amber line showed the 1.5s poll while the y-domain and gamma mark showed the 15s cycle
// value — several different spots on one screen in one frame. The server has had one spot
// authority since RC-14 (resolve_spot); this is its browser counterpart.
// Precedence is deliberate: freshest first. liveSpot (1.5s poll) > strikes.spot > terrain.spot.
function currentSpot() {
  if (liveSpot != null) return liveSpot;
  return _cycleSpot();
}
// The 15s cycle value ONLY — used where the live poll must be deliberately excluded (seeding a
// tick when no live spot exists yet, and dropping the live spot on ticker change). Never call
// this to RENDER a spot; render through currentSpot().
function _cycleSpot() {
  return (strikes && strikes.spot != null) ? strikes.spot
    : (terrain ? terrain.spot : null);
}
function _dropLiveSpot() {
  liveSpot = null; liveSpotAsOf = 0;
  const cs = _cycleSpot();
  if (cs != null && chartTicker) noteSpotTick(cs); else draw();
}
let spotPollBackoffUntil = 0;   // 404 = server predates the endpoint: back off,
                                // do not spam the operator's console log at 1.5s
async function pollSpot() {
  if (spotPollInflight || Date.now() < spotPollBackoffUntil) return;
  const tk = (document.getElementById('tk').value || 'SPY').trim().toUpperCase();
  spotPollInflight = true;
  try {
    const r = await fetch(`/api/spot?ticker=${tk}`);
    const cur = (document.getElementById('tk').value || 'SPY').trim().toUpperCase();
    if (cur !== tk || chartTicker !== tk) return;
    if (!r.ok) {
      if (r.status === 404) spotPollBackoffUntil = Date.now() + 60000;
      _dropLiveSpot(); return;
    }
    const j = await r.json();
    if ((document.getElementById('tk').value || 'SPY').trim().toUpperCase() !== tk
        || chartTicker !== tk) return;
    if (j.ticker === tk && j.spot != null && isFinite(Number(j.spot))) {
      const asOf = Number(j.spot_as_of_ts_utc) || 0;
      if (asOf && liveSpotAsOf && asOf < liveSpotAsOf) return;
      if (asOf) liveSpotAsOf = asOf;
      liveSpot = Number(j.spot);
      noteSpotTick(liveSpot);
    } else {
      _dropLiveSpot();
    }
  } catch (e) { _dropLiveSpot(); }
  finally { spotPollInflight = false; }
}
setInterval(pollSpot, 1500);   // server caches upstream at 1.25s — budget-safe

// short-window guard: if anything overflows the viewport, a bright pill says so
// and one click scrolls the gamma panel into view (the charts eat wheel-scroll)
function checkFold() {
  const fw = document.getElementById('foldwarn');
  const gc = document.getElementById('gammacard').getBoundingClientRect();
  const hidden = gc.bottom > window.innerHeight + 4;
  fw.style.display = hidden ? 'block' : 'none';
}
document.getElementById('foldwarn').addEventListener('click', () => {
  // the document root is the scroller (measured: scrollingElement === html);
  // window.scrollTo drives it regardless of engine quirks
  const el = document.getElementById('gammacard');
  const top = Math.max(0, el.offsetTop + el.offsetHeight - window.innerHeight + 12);
  window.scrollTo(0, top);   // instant — a jump button should jump
  checkFold();
});
setInterval(checkFold, 2000);
window.addEventListener('resize', () => { draw(); drawHist(); checkFold(); });
load(); setInterval(load, 15000);
</script>
