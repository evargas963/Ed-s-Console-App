default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: secrets-and-paths
        name: secrets and operator-home paths
        entry: python -m tools.check_credential_leak
        language: system
        pass_filenames: false
        always_run: true
      - id: eol-style-invariant
        name: line-ending style survives the edit
        entry: python -m tools.check_eol_style_invariant
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-correctness
        name: ruff (pyproject.toml's selection)
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format (the one Python formatter)
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: no-patch-shapes
        name: no patch shape on a line this push brings (check_end_to_end, as locks runs it)
        entry: python -m tools.check_end_to_end --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: no-lost-assertion
        name: no test assertion lost (check_integrity, as locks runs it)
        entry: python tools/check_integrity.py --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: no-count-rises
        name: no locks count rises (check_locks, as locks runs it)
        entry: python tools/check_locks.py --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
