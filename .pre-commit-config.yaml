default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: secrets-and-paths
        name: secrets and operator-home paths
        entry: python tools/check_credential_leak.py --and-private-paths
        language: system
        pass_filenames: false
        always_run: true
      - id: eol-style-invariant
        name: line-ending style survives the edit
        entry: python tools/check_eol_style_invariant.py
        language: system
        pass_filenames: false
        always_run: true
      - id: venv-parity
        name: virtualenv parity (repo .venv)
        entry: python tools/run_with_repo_venv.py tools/check_venv_parity.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-correctness
        name: ruff (the rules pyproject.toml selects)
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      # vulture in pre-commit's own environment, never the repo .venv. CI (pytest-full) is the gate:
      # here the libraries the code imports are absent, so the rule "a library reads it" clears nothing.
      - id: dead-code
        name: the change leaves no dead code (vulture, its own environment)
        entry: python tools/check_dead_code.py --base origin/main
        language: python
        additional_dependencies: ["vulture==2.16"]
        pass_filenames: false
        files: \.py$
