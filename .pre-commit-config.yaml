repos:
  - repo: local
    hooks:
      - id: prepush-fast-gate
        name: prepush fast gate (clean working tree)
        entry: python tools/check_prepush_fast_gate.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: generated-artifacts-clean-check
        name: generated governance artifacts clean (check-only)
        entry: python tools/check_governance_generated_artifacts_clean.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # GOV-GATE-PARITY-01 (2026-07-11, operator-directed): local twins of the
      # remote fast-fail checks, derived from the canonical workflow files at
      # runtime. Evidence: five local-green->CI-red escapes on 2026-07-11
      # (check-stack staleness, mega4 coverage, ruff x2, CSV-first x2). This
      # supersedes the Phase 2B "two fast gates only" pre-push budget BY
      # OPERATOR DIRECTION; remote CI remains the unchanged authority.
      # ED CONSOLE SLIMMING 1C: the prepush-parity-gate hook and
      # tools/check_prepush_parity.py were retired with the enforcement stack they
      # mirrored (enforce-static + the universal-fix / governance-consolidation
      # suites, all deleted in 1B). Full runtime coverage is the required
      # "pytest-full" CI job (.github/workflows/pytest.yml); fast local correctness
      # is ruff + the money-path gate at the pre-commit stage (below).
      # ED CONSOLE SLIMMING 2a-mission-auth: the mission-authorization hooks (and
      # tools/check_mission_authorization.py + tools/mission_authorization.py +
      # governance/mission_authorization/**) were retired. Mission-auth was process
      # machinery — it gated which agent could commit on which branch lane; it never
      # guarded market correctness, money-path behavior, or data honesty. Those guards
      # survive it (money-path gate + pytest-full + operator review per the charter).
      - id: no-grep-subprocess
        name: no grep/rg subprocess in staged Python
        entry: python tools/check_no_grep_subprocess.py
        language: system
        types: [python]
      # ED CONSOLE SLIMMING 1B: the deferral-language and fix-everything-we-touch
      # hooks (and their tools) were retired. Enforcement is now operator review
      # per the one-page AGENTS.md charter; the money-path gate below plus the
      # required pytest-full suite carry the mechanical checks that matter.
      # PR41 privacy root cause: operator-home absolute paths must never land in
      # tracked evidence or mission-authorization content (early lock; the same
      # module is exercised by required-CI pytest-full via its adversarial tests).
      - id: no-private-paths
        name: no operator-home paths in tracked evidence
        entry: python tools/check_private_paths.py
        language: system
        pass_filenames: false
        always_run: true
      # SLIMMING 1C: fast local ruff correctness, parity with the Hardening CI
      # quality job (F401 unused import, F821 undefined name, E9 syntax). Replaces
      # the ruff stage of the retired pre-push parity gate.
      - id: ruff-correctness
        name: ruff (correctness — F401,F821,E9)
        entry: python -m ruff check . --select F401,F821,E9
        language: system
        pass_filenames: false
        always_run: true
      # SLIMMING Phase 1 (Commit 1A): the single fast money-path correctness gate
      # that replaces the retired enforcement stack. Installed alongside the old
      # hooks here; Commit 1B removes the old machine and this becomes the gate.
      - id: market-correctness
        name: market correctness (money-path static gate)
        entry: python tools/check_market_correctness.py
        language: system
        pass_filenames: false
        always_run: true
