repos:
  - repo: local
    hooks:
      # ED CONSOLE SLIMMING: the pre-push stage has no hooks. Every pre-push
      # governance-meta gate was retired as the charter's "enforcement is operator
      # review" superseded it: the mission-authorization hooks (2a), the prepush-parity
      # gate (1C), and — final — the prepush-fast-gate (meta-governance about the hook
      # stack) + generated-artifacts-clean-check (freshness of generated governance-
      # hygiene JSON) subsystems (2b). Required CI (pytest-full + the Hardening quality
      # job) is the authority; the pre-commit hooks below carry the mission-critical
      # fast checks (ruff, money-path gate, no-grep, no-private-paths).
      - id: no-grep-subprocess
        name: no grep/rg subprocess in staged Python
        entry: python tools/check_no_grep_subprocess.py
        language: system
        types: [python]
      # ED CONSOLE SLIMMING 1B: the deferral-language and fix-everything-we-touch
      # hooks (and their tools) were retired. Enforcement is now operator review
      # per the one-page AGENTS.md charter; the money-path gate below plus the
      # required pytest-full suite carry the mechanical checks that matter.
      # PR41 privacy root cause: operator-home absolute paths must never land in
      # tracked evidence or mission-authorization content (early lock; the same
      # module is exercised by required-CI pytest-full via its adversarial tests).
      - id: no-private-paths
        name: no operator-home paths in tracked evidence
        entry: python tools/check_private_paths.py
        language: system
        pass_filenames: false
        always_run: true
      - id: credential-leak
        name: credential leak firewall (staged secrets / home paths)
        entry: python tools/check_credential_leak.py
        language: system
        pass_filenames: false
        always_run: true
      - id: venv-parity
        name: virtualenv parity (interpreter must be repo .venv; CI exempt)
        entry: python tools/run_with_repo_venv.py tools/check_venv_parity.py
        language: system
        pass_filenames: false
        always_run: true
      # SLIMMING 1C: fast local ruff correctness, parity with the Hardening CI
      # quality job (F401 unused import, F821 undefined name, E9 syntax). Replaces
      # the ruff stage of the retired pre-push parity gate.
      - id: ruff-correctness
        name: ruff (correctness — F401,F821,E9)
        entry: python -m ruff check . --select F401,F821,E9
        language: system
        pass_filenames: false
        always_run: true
      # SLIMMING Phase 1 (Commit 1A): the single fast money-path correctness gate
      # that replaces the retired enforcement stack. Installed alongside the old
      # hooks here; Commit 1B removes the old machine and this becomes the gate.
      - id: market-correctness
        name: market correctness (money-path static gate)
        entry: python tools/run_with_repo_venv.py tools/check_market_correctness.py
        language: system
        pass_filenames: false
        always_run: true
      # Institutional Correctness gate — the ONE lock (GOVERNING LAW, OPEN_ITEMS).
      # The repo is institutional in nature; new correctness requirements register as
      # CHECKS inside this one gate, never as new separate locks. Check 1: no synthetic
      # option-chain fixtures in tests — correctness is proven on REAL data
      # (tests/fixtures/); fail-closed/edge tests declare themselves with
      # '# institutional-synthetic-ok: <reason>'.
      # run_with_repo_venv re-execs under .venv locally (CI falls through).
      # RC-406 (latency): the whole-tree ADDED-VIOLATION delta (two detached worktrees +
      # the enforced catalog run twice, ~250s/commit) is RELOCATED to CI — the SAME owner
      # runs in .github/workflows/hardening.yml on every PR, the authority before merge. On
      # commit this hook now runs fast; enforced-check-SURFACE edits (removing/downgrading a
      # check) stay gated at commit by the operating-process hook below.
      - id: institutional-correctness
        name: institutional correctness (one gate — no fake tests, single source of truth)
        # Local hooks ignore env:; the wrapper passes the AMBIENT ED_AGENT_ROLE through and
        # leaves it unset when there is none (RC-240 — it used to hardcode 'cursor', which
        # made the sole writer's own commit read as writer-drift).
        entry: python tools/precommit_institutional.py
        language: system
        pass_filenames: false
        always_run: true
      # RC-217: index=WT parity + staged ENFORCED checks on HEAD before commit lands.
      - id: operating-process
        name: operating process (index parity, staged checks, orphan patch warn)
        entry: python tools/run_with_repo_venv.py tools/operating_process_lock.py --pre-commit
        language: system
        pass_filenames: false
        always_run: true
      # RC-270: db-health is wired because it PASSES ON MERIT -- 22 checks, 0
      # failures, every rule extracted from a cited external standard. It reads
      # the database on disk, which no other gate does, and returns 0 for an
      # absent default database so a fresh clone is never blocked.
      #
      # duplication_audit and check_one_faucet_live are deliberately NOT wired.
      # They cannot pass today, and the only way to wire them was a tolerance
      # the operator never authorised: --kind scoping that silenced thirteen of
      # fourteen duplication classes, and a --max ceiling set twice and wrong
      # twice. Both have been removed. A tool that cannot pass does not get a
      # gate built around it to hide that -- it gets run by hand until the
      # defect is fixed:
      #     python tools/duplication_audit.py
      #     python tools/check_one_faucet_live.py
      - id: db-health
        name: database health (DAMA dimensions + OHLC invariants, cited sources)
        entry: python tools/run_with_repo_venv.py tools/check_db_health.py
        language: system
        pass_filenames: false
        always_run: true
