default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: secrets-and-paths
        name: secrets and operator-home paths
        entry: python tools/check_credential_leak.py
        language: system
        pass_filenames: false
        always_run: true
      - id: eol-style-invariant
        name: line-ending style survives the edit
        entry: python tools/check_eol_style_invariant.py
        language: system
        pass_filenames: false
        always_run: true
      - id: venv-parity
        name: virtualenv parity (repo .venv)
        entry: python tools/run_with_repo_venv.py tools/check_venv_parity.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-correctness
        name: ruff (F401, F821, E9)
        entry: python -m ruff check . --select F401,F821,E9
        language: system
        pass_filenames: false
        always_run: true
