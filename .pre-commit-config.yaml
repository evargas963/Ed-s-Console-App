default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: secrets-and-paths
        name: secrets and operator-home paths
        entry: python tools/check_credential_leak.py
        language: system
        pass_filenames: false
        always_run: true
      - id: eol-style-invariant
        name: line-ending style survives the edit
        entry: python tools/check_eol_style_invariant.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-correctness
        name: ruff (pyproject.toml's selection)
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format (the one Python formatter)
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
