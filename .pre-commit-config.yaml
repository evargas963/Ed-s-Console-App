---
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: secrets-and-paths
        name: secrets and operator-home paths (gitleaks, on what the commit adds)
        entry: gitleaks git --pre-commit --staged --config .gitleaks.toml --redact --no-banner -v .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-correctness
        name: ruff (pyproject.toml's selection)
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format (the one Python formatter)
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: compileall
        name: every Python file compiles (as hardening runs it)
        entry: python -m compileall -q -x "([\\/](\.venv|venv|node_modules|__pycache__)[\\/])" .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: one-reader
        name: one module reads each Schwab field (check_one_reader, as hardening runs it)
        entry: python -m tools.check_one_reader --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: no-patch-shapes
        name: no patch shape on a line this push brings (check_end_to_end, as locks runs it)
        entry: python -m tools.check_end_to_end --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: no-lost-assertion
        name: no test assertion lost (check_integrity, as locks runs it)
        entry: python tools/check_integrity.py --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: no-count-rises
        name: no locks count rises (check_locks, as locks runs it)
        entry: python tools/check_locks.py --base origin/main
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
