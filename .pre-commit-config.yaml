repos:
  - repo: local
    hooks:
      - id: governance-consolidation-tests
        name: governance consolidation tests
        entry: python -m pytest tests/test_governance_consolidation.py tests/test_forbidden_phrases.py tests/test_money_path_roster.py -q
        language: system
        pass_filenames: false
        always_run: true
      - id: no-grep-subprocess
        name: no grep/rg subprocess in staged Python
        entry: python tools/check_no_grep_subprocess.py
        language: system
        types: [python]
      - id: no-deferral-language-msg
        name: no deferral language in commit message
        entry: python tools/check_no_deferral_language.py
        language: system
        stages: [commit-msg]
      - id: no-deferral-language-files
        name: no deferral language in staged source/test files
        entry: python tools/check_no_deferral_language.py
        language: system
        types: [text]
        exclude: '^(OPEN_ITEMS\.md|ACTIVE_PROGRAM\.md|governance/.*|tools/check_no_deferral_language\.py|tests/test_check_no_deferral_language\.py)$'
