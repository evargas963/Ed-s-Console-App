# The locks' rules, counted by tools/check_locks.py on every tracked Python file with every `noqa`
# ignored. It stands alone: no other file changes what it counts. A count may only fall, but for
# `check_locks.FREE`; at 0 a rule is absolute. A count asks for no fix; the rules the operator ruled
# out stay out.
line-length = 100
target-version = "py313"

[lint]
select = [
    "ARG", # an argument nothing reads
    "B", # likely bugs
    "BLE", # a catch-all except
    "C90", # a function too complex to read
    "E", "F", "I", "UP", "W", # PEP 8, unused and undefined names, import order, old syntax
    "ERA", # code left in a comment
    "PERF", # needless work in a loop
    "PLC0415", # an import outside the module's top
    "RET", # a return that says nothing
    "S102", "S307", # code run from text
    "S110", "S112", # an error passed over in silence
    "SIM107", "SIM113", "SIM114", "SIM116", "SIM117", "SIM118", "SIM208", "SIM300", "SIM905",
    "SIM910", "SIM911", # needless complexity
    "T20", # print
    "TID251", # the banned names below
    "TRY", # an except that hides what failed
]
ignore = [
    "B004", "B006", "B007", "B011", "B028", "B905", "B912", "E711", "E712", "E731",
    "UP042",
    # TRY003 is not an except that hides what failed: it asks that a built-in exception's
    # message (`ValueError(f"... {x!r}")`, as Python's own library raises them) move into a new
    # class, a style of one plugin that adds a class per message and fixes nothing
    "TRY003",
]

[lint.mccabe]
max-complexity = 10

[lint.flake8-tidy-imports.banned-api]
"http.client".msg = "Only Feed talks to Schwab."
"urllib.request".msg = "Only Feed talks to Schwab."
"websockets".msg = "Only Feed talks to Schwab."
"sqlite3".msg = "Only the Recorder uses a database."
"time_et.now_et".msg = "Only an entry point reads the clock; pass `now`."
"importlib.__import__".msg = "A module is imported by name at the top."
"importlib.import_module".msg = "A module is imported by name at the top."
"importlib.machinery".msg = "No code runs from a data file."
"importlib.util".msg = "No code runs from a data file."
"runpy".msg = "No code runs from a data file."
