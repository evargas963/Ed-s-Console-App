# The import contracts, which `.github/workflows/locks.yml` runs from the base. grimp takes no
# top-level module as a root, and most of ours are, so the checkout itself is the root: `head`,
# read from the folder that holds it, every file `head.<its path>` and none of its code importable.
# Our own imports between root modules are therefore not edges, and layers wait for the folders.
# ruff's INP and N999 (locks.ruff.toml) refuse a file grimp would not walk to.
[tool.importlinter]
root_packages = ["head"]
include_external_packages = true

# A protected name nothing imports stops the run: take it out here before its last import goes.
# ruff keeps the names this cannot hold: grimp stops at `urllib` and `http`, and nothing imports
# `aiohttp` or `requests`. `feed` is the folder Feed's modules move into; `as_packages = false` lets
# an entry match nothing, so the base's rules can judge the move out of the old name.
[[tool.importlinter.contracts]]
name = "Only Feed talks to Schwab"
type = "protected"
protected_modules = ["schwab", "authlib", "httpx"]
as_packages = false
allowed_importers = [
    "head.feed.**",
    "head.schwab_client",
    "head.app.market_data.schwab.streaming.capture",
    "head.calibration.complete_chain_capture",
    "head.tests.schwab_rest_standin", # its httpx transport takes Schwab's host's place in tests
]
