# The import contracts, which `.github/workflows/locks.yml` runs from the base. grimp takes no
# top-level module as a root, and most of ours are, so the checkout itself is the root: `head`,
# read from the folder that holds it, every file `head.<its path>` and none of its code importable.
# `import schwab_client` is then the outside name `schwab_client`, not `head.schwab_client`, so no
# chain runs through a root module, and layers wait for the folders. `tools/check_locks.py` refuses
# a file Python can load that grimp may not read. ruff keeps `http.client` and `urllib.request`: grimp stops at
# `http` and `urllib`, which the rest of each serves.
[tool.importlinter]
root_packages = ["head"]
include_external_packages = true

# A protected name nothing imports stops the run: take it out here before its last import goes.
# `feed` is the folder Feed's modules are in; `as_packages = false` lets an entry match nothing,
# so the base's rules can judge a module's move into it.
[[tool.importlinter.contracts]]
name = "Only Feed talks to Schwab"
type = "protected"
protected_modules = ["schwab", "authlib", "httpx"]
as_packages = false
allowed_importers = ["head.feed.**"]

# Feed is protected as `schwab` is: `from feed import ...` is the outside name `feed` (the header
# above), reached only by the daemon, the operator's sign-in, the field inventory and the tests
[[tool.importlinter.contracts]]
name = "Only the daemon reaches Feed"
type = "protected"
protected_modules = ["feed"]
as_packages = false
allowed_importers = [
    "head.feed.**",
    "head.app.market_data.schwab.streaming.capture",
    "head.reauth_schwab",
    "head.tools.schwab_field_inventory",
    "head.tests.**",
]

[[tool.importlinter.contracts]]
name = "Feed has one HTTP client"
type = "forbidden"
source_modules = ["head"]
forbidden_modules = ["aiohttp", "requests"]
allow_indirect_imports = true

# The Calculators are pure (AGENTS.md rule 11): each takes its inputs and `now`, and imports no
# State, Push, Feed, database or network. The files are the ones `pyproject.toml`'s
# `[tool.pyright]` holds as Calculators; each forbidden name is an outside name (the header
# above), so the contract reads their own import statements, and a chain through another root
# module waits for the folders.
[[tool.importlinter.contracts]]
name = "The Calculators read no State, Push, Feed, database or network"
type = "forbidden"
source_modules = [
    "head.terrain_engine",
    "head.terrain_read",
    "head.terrain_atr",
    "head.math_exposure_core",
    "head.math_levels",
    "head.math_volatility",
    "head.math_forces",
    "head.confluence_composite",
    "head.liquidity_value_engine",
    "head.liquidity_models",
    "head.micro_structure",
    "head.l1_trade_observation",
    "head.app.options.order_flow.engine",
]
forbidden_modules = [
    "state",
    "push",
    "feed",
    "server",
    "db",
    "live_market_plane",
    "live_price_rows",
    "sqlite3",
    "socket",
    "http",
    "urllib",
]
