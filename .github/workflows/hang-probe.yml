name: Hang probe

on:
  pull_request:

jobs:
  hang-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -r requirements-dev.txt -r requirements.txt
      - name: A forced failure at each open socket on the old test, three times each
        env:
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
        run: |
          set +e
          probe() {
            cp "$1" keep.py
            python hang_force.py "$1" "$2" || exit 1
            for i in 1 2 3; do
              timeout 60 python -m pytest "$1" -q -p no:cacheprovider --tb=line > out.txt 2>&1
              echo "case $1 run $i exit $?"
            done
            tail -1 out.txt
            cp keep.py "$1"
          }
          probe tests/test_options_order_flow_semantics_v1.py "bus.publish(*_message(m))"
          probe tests/test_data_path_silent_price_v1.py "await ws.send(frame)"
