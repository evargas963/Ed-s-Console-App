name: Hang probe

on:
  pull_request:

jobs:
  hang-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -r requirements-dev.txt -r requirements.txt
      - name: The test file on the old route, six times
        env:
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
          PYTHONFAULTHANDLER: "1"
        run: |
          git show 72c2184d:server.py > server.py
          set +e
          for i in 1 2 3 4 5 6; do
            echo "=== run $i"
            timeout -s ABRT 120 python -m pytest tests/test_data_path_one_watchlist_v1.py -v -s -p no:cacheprovider -p no:faulthandler --tb=line > "out$i.txt" 2>&1
            rc=$?
            echo "run $i exit $rc"
            tail -4 "out$i.txt"
            if [ "$rc" -ge 124 ]; then tail -90 "out$i.txt"; break; fi
          done
