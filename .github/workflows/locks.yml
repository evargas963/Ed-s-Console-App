name: Locks

# pull_request_target: GitHub runs this file and tools/check_locks.py from the base, so a pull
# request cannot edit its judge. The head is only read as data; none of its code runs. `locks` is
# a required check, and a change it refuses cannot merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: judge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: the base's ruff
        run: python -m pip install "$(grep '^ruff==' judge/requirements-dev.txt)"
      - name: the change, against the base
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -C judge fetch -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "refs/pull/$PR/merge:refs/heads/judged"
          test "$(git -C judge rev-parse refs/heads/judged^2)" = "$HEAD_SHA"
          test "$(git -C judge rev-parse refs/heads/judged^1)" = "$(git -C judge rev-parse HEAD)"
          git -C judge worktree add -q --detach "$PWD/head" refs/heads/judged
          cd head
          python ../judge/tools/check_locks.py --base "$(git rev-parse HEAD^1)"
