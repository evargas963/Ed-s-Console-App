name: Locks

# pull_request_target: GitHub runs this file and the tools it names from the base, so a pull
# request cannot edit its judge. The head is only read as data; none of its code runs. `locks` is
# a required check, and a change it refuses cannot merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: judge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: the base's ruff, and its Babel for page code
        run: |
          python -m pip install "$(grep '^ruff==' judge/requirements-dev.txt)"
          npm ci --prefix judge
      - name: the change, against the base
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" > pr_body.md
          git -C judge fetch -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            "refs/pull/$PR/merge:refs/heads/judged"
          test "$(git -C judge rev-parse refs/heads/judged^2)" = "$HEAD_SHA"
          test "$(git -C judge rev-parse refs/heads/judged^1)" = "$(git -C judge rev-parse HEAD)"
          git -C judge worktree add -q --detach "$PWD/head" refs/heads/judged
          cd head
          base="$(git rev-parse HEAD^1)"
          python ../judge/tools/check_locks.py --base "$base"
          python ../judge/tools/check_end_to_end.py --base "$base" --body-file ../pr_body.md
          python ../judge/tools/check_integrity.py --base "$base" --body-file ../pr_body.md \
            --head-sha "$HEAD_SHA"
