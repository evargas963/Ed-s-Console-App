---
name: Locks

# pull_request_target: GitHub runs this file and the tools it names from the base, so a pull
# request cannot edit its judge. The head is only read as data; none of its code runs. `locks` is
# a required check, and a change it refuses cannot merge.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  locks:
    # `edited` also fires for a closed pull request, which has no test merge left to judge
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none # every commit; a file's old versions only when one is read
          persist-credentials: false
          path: judge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: the base's ruff and import-linter, and its Babel for page code
        run: |
          python -m pip install "$(grep '^ruff==' judge/requirements-dev.txt)" \
            "$(grep '^import-linter==' judge/requirements-dev.txt)" \
            "$(grep '^grimp==' judge/requirements-dev.txt)"
          npm ci --prefix judge
      - name: the change, against the base
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # GitHub builds the test merge commit in a background job after the event: until it
          # has, refs/pull/N/merge is missing or still the last head's. Its REST docs say to give
          # that job time and ask again (`mergeable` null); asked every 5 s for up to 2 minutes
          for _ in $(seq 24); do
            git -C judge fetch -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              "+refs/pull/$PR/merge:refs/heads/judged" \
              && [ "$(git -C judge rev-parse refs/heads/judged^2)" = "$HEAD_SHA" ] && break
            sleep 5
          done
          test "$(git -C judge rev-parse refs/heads/judged^2)" = "$HEAD_SHA"
          test "$(git -C judge rev-parse refs/heads/judged^1)" = "$(git -C judge rev-parse HEAD)"
          git -C judge worktree add -q --detach "$PWD/head" refs/heads/judged
          cd head
          base="$(git rev-parse HEAD^1)"
          python ../judge/tools/check_locks.py --base "$base"
          python ../judge/tools/check_end_to_end.py --base "$base"
          python ../judge/tools/check_integrity.py --base "$base"
          cd ..
          lint-imports --config judge/locks.imports.toml --no-cache
      - name: the pull request lists how it can fail and gives measured before and after counts
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          section() {
            printf '%s\n' "$BODY" | tr -d '\r' \
              | awk -v h="## $1" '$0 == h { on = 1; next } /^## / { on = 0 } on' \
              | grep -v -e '^[[:space:]]*$' -e '^[[:space:]]*<!--'
          }
          section 'Failure modes' | grep -q . \
            || { echo "::error::no '## Failure modes' section with content"; exit 1; }
          section 'Census before and after' | grep -Eq '[0-9][0-9,]* -> [0-9]' \
            || { echo "::error::'## Census before and after' has no count (N -> M)"; exit 1; }
