name: Locks

# pull_request_target: GitHub runs this file and tools/check_locks.py from the base, so a pull
# request cannot edit its judge. The head is only read as data; none of its code runs.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  lock-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.touched.outputs.touched }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - id: touched
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          git fetch -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/pull/$PR/merge:merged"
          files="$(python tools/check_locks.py --changed merged^1 merged)"
          echo "touched=$([ -n "$files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  locks:
    needs: lock-files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # a change to a lock file waits here for the operator's approval in GitHub
    environment: ${{ needs.lock-files.outputs.touched == 'true' && 'operator-locks' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: judge
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: the base's ruff
        run: python -m pip install "$(grep '^ruff==' judge/requirements-dev.txt)"
      - name: no count rises
        env:
          PR: ${{ github.event.pull_request.number }}
          LOCK_FILES_APPROVED: ${{ needs.lock-files.outputs.touched }}
        run: |
          git -C judge fetch -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/pull/$PR/merge:merged"
          git -C judge worktree add -q --detach "$PWD/head" merged
          cd head
          python ../judge/tools/check_locks.py --base "$(git rev-parse HEAD^1)"
