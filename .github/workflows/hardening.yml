name: Hardening Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: ruff (correctness)
        run: python -m ruff check . --select F401,F821,E9
      - name: compileall
        run: python -m compileall -q -x '([\\/](\.venv|venv|node_modules|__pycache__|models)[\\/])' .
