name: Hardening Gates

# Code-quality / security / supply-chain gates (hardening program 2026-06-03).
# Separate from pytest.yml (full suite) and the schwab-*.yml gates.
# BLOCKING steps fail the build. The F841 lint-debt step is a visible RATCHET: it reports the
# remaining unused-variable count (56 → 0 target) without blocking, because those sites are
# money-path and reviewed individually, not blind-swept. It flips to blocking when the count hits 0.

on:
  pull_request:
  # RC-405 (engineering-cycle latency): `pull_request` runs this job before merge (branch
  # protection's required check), so a `push` event on a FEATURE branch only duplicates it.
  # Restrict the push trigger to `main` for post-merge trunk validation. No check weakened.
  push:
    branches: [main]

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # RC-396: this job once exported a fabricated `ED_AGENT_ROLE: cursor` and the required
    # run read a whole PR as the wrong agent's drift (`writer_no_drift: 0 -> 27`). The role
    # machinery was removed entirely in the 2026-08-24 Architecture A teardown; CI carries
    # no agent identity because there is none to carry.
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL_FIXES_ONLY_V2: FINAL_SHA verification needs full history
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff bandit pip-audit
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # --- BLOCKING: correctness lint (undefined names, unused imports, syntax) — all at 0 today ---
      - name: ruff (correctness rules — blocking)
        run: python -m ruff check . --select F401,F821,E9

      - name: compileall (no unparseable files — blocking)
        run: python -m compileall -q -x '([\\/](\.venv|venv|node_modules|__pycache__|models)[\\/])' .

      # --- BLOCKING: money-path correctness gate. Replaces the retired enforcement
      #     stack (no-deferral / fix-everything-we-touch / enforce-static, all
      #     deleted in the ED CONSOLE SLIMMING wave). Enforcement is now operator
      #     review + this gate + the required pytest-full suite. ---
      - name: market correctness (money-path static gate + self-test)
        run: |
          python tools/check_market_correctness.py --self-test
          python tools/check_market_correctness.py

      # BLOCKING: the SAME institutional debt owner the local pre-commit hook runs.
      #
      # RC-395: this step used to invoke check_institutional_correctness.py directly, and
      # its own comment claimed "pre-commit parity" — which stopped being true the moment
      # RC-391 moved the local hook to the delta owner. Parity was asserted in PROSE while
      # the two paths diverged in FACT, and the divergence was not theoretical: this
      # required check has been RED on origin/main itself for every recent commit
      # (MEASURED via `gh run list --branch main`: Hardening Gates failure at 4983eb57,
      # 573b96e8, b6bde57e, ca6d7b27), because absolute zero is unreachable on a trunk
      # carrying ~57 inherited violations. A required check no honest change can turn
      # green teaches people to route around it — the exact --no-verify habit RC-389 exists
      # to stop — and it cannot distinguish a commit that ADDS debt from one that PAYS it.
      #
      # The delta owner enforces MORE than the old step did, not less:
      #   NEW violation                  -> BLOCK
      #   WORSENED count                 -> BLOCK
      #   REMOVED/DEMOTED enforced check -> BLOCK  (deleting the failing check is not paying)
      #   crash / unreadable output      -> BLOCK  (silence is not cleanliness)
      #   unchanged inherited debt       -> PASS
      #   improvement                    -> PASS
      # One implementation, one CHECKS roster, two callers — no second delta tool.
      - name: institutional debt delta (same owner as local pre-commit)
        run: |
          git fetch --no-tags origin main
          python tools/check_delta_adds_no_debt.py --base origin/main

      # REPO REHABILITATION RATCHET (RC-505). Architecture no-regression ONLY: new root
      # production modules, new tracked runtime/generated state, growth in the directories the
      # TARGET does not name, migrated code moving back toward root, forbidden dependency
      # direction inside app/. It does NOT recompute institutional debt — the step above owns
      # that question and a second opinion would be a second authority. Inherited debt may
      # remain; it may not grow. Removing, deleting or demoting this step is itself a
      # regression the ratchet refuses: it reads the BASE ref, so a change cannot authorise
      # dropping its own gate in the same delta.
      - name: repo rehabilitation ratchet (architecture no-regression)
        run: python tools/repo_rehab_status.py --ratchet --base origin/main

      - name: institutional closure gate (no inflated parent closures)
        run: python tools/check_institutional_closure_gate.py
      - name: no-grep subprocess
        run: python tools/check_no_grep_subprocess.py

      # --- RATCHET (visible, NON-blocking until HIGH findings are triaged) ---
      # These end in `|| true`, so they report but cannot fail the job. The name says so —
      # a step called "blocking" that cannot block is the security theater this repo audits for.
      - name: bandit (high severity — non-blocking ratchet)
        run: python -m bandit -r . -ll -q -c pyproject.toml || true   # RATCHET: triage HIGH then drop the `|| true` to make it block

      # --- RATCHET (visible, non-blocking until cleared) ---
      - name: lint debt — unused vars + redefs (F841/F811 ratchet, target 0 this week)
        run: python -m ruff check . --select F841,F811 --statistics || true
      - name: dependency vulnerabilities (pip-audit — ratchet until requirements pinned)
        run: python -m pip_audit || true
