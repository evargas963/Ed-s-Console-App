name: Hardening Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0            # the end-to-end check diffs the PR against its base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: ruff (the rules pyproject.toml selects)
        run: python -m ruff check .
      - name: compileall
        run: python -m compileall -q -x '([\\/](\.venv|venv|node_modules|__pycache__|models)[\\/])' .
      - name: no patches, only end-to-end fixes (AGENTS.md rule 1)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"
          python tools/check_end_to_end.py --base "origin/$BASE_REF" --body-file "$RUNNER_TEMP/pr_body.md"
      - name: no new or changed test patches the code it tests (TEST-PATCHES)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_no_new_patches.py --base "origin/$BASE_REF"
      - name: a deleted name leaves no mention behind (cleanup)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/check_stale_references.py --base "origin/$BASE_REF"
