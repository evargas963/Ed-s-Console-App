---
name: Hardening Gates

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the run it replaces; every commit to main runs whole.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the checks below diff the PR against its base
          filter: blob:none # every commit; a file's old versions only when one is read
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - name: ruff (pyproject.toml's selection)
        run: python -P -m ruff check .
      - name: ruff format (the one Python formatter)
        run: python -P -m ruff format --check .
      - name: compileall
        run: python -m compileall -q -x '([\\/](\.venv|venv|node_modules|__pycache__)[\\/])' .
      - name: typed records, pyright strict (AGENTS.md rule 12; pyproject.toml's files)
        run: |
          python -m pip install -r requirements.txt "$(grep '^pyright==' requirements-dev.txt)"
          python -m pyright
      - name: the type stubs match the installed schwab-py and authlib (stubtest; typings/)
        env:
          MYPYPATH: typings
        run: |
          python -m pip install "$(grep '^mypy==' requirements-dev.txt)"
          python -m mypy.stubtest --ignore-missing-stub schwab authlib
      - name: no library with a known vulnerability (pip-audit)
        run: |
          python -m pip install "$(grep '^pip-audit==' requirements-dev.txt)"
          python -m pip_audit -r requirements.txt -r requirements-dev.txt
      - name: no secret or operator-home path, in the files and in the PR's commits (gitleaks)
        if: github.event_name == 'pull_request' && (success() || failure())
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          set +e
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner -v
          files_rc=$?
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner -v \
            --log-opts="origin/$BASE_REF..HEAD"
          history_rc=$?
          [ "$files_rc" -eq 0 ] && [ "$history_rc" -eq 0 ]
      - name: one module reads each Schwab field (AGENTS.md rule 3, ENF-23)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.check_one_reader --base "origin/$BASE_REF"
