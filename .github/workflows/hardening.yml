name: Hardening Gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0            # the end-to-end check diffs the PR against its base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
          npm ci        # the end-to-end check reads page code with Playwright's Babel (tools/js_code_tree.js)
      - name: ruff (pyproject.toml's selection)
        run: python -m ruff check .
      - name: ruff format (the one Python formatter)
        run: python -m ruff format --check .
      - name: compileall
        run: python -m compileall -q -x '([\\/](\.venv|venv|node_modules|__pycache__|models)[\\/])' .
      - name: no patch shapes in added product code (AGENTS.md rule 1)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.check_end_to_end --base "origin/$BASE_REF"
      - name: one module reads each Schwab field (AGENTS.md rule 3, ENF-23)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.check_one_reader --base "origin/$BASE_REF"
      - name: no credential or operator-home path is committed (AGENTS.md Authority)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.check_credential_leak --base "origin/$BASE_REF"
      - name: a file keeps its line endings (AGENTS.md Authority)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.check_eol_style_invariant --base "origin/$BASE_REF"
