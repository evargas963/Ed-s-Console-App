---
# The census of everything in the repository that must reach 0 (tools/census/census.py), on every
# pull request and on main. On a pull request the base is counted too, by the head's census (one
# ruler), and the job summary shows before and after; every item is in the artifact.
name: Census

"on":
  pull_request:
  push:
    branches: [main]
  # run at any time from GitHub's Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

# a pull request's newer commit replaces the census of its older one, as pytest.yml's run does
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ED_CI_OFFLINE: "1"
      ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
      SCHWAB_API_KEY: "ci-not-live-placeholder"
      SCHWAB_APP_SECRET: "ci-not-live-placeholder"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: head
          fetch-depth: 0 # branches and history are counted

      - name: Check out the base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Set up the tools
        uses: ./head/.github/actions/set-up-tools
        with:
          npm-lock: head/tools/census/package-lock.json

      - name: Install the program's and the census's Python checkers
        working-directory: head
        run: >-
          uv pip install --system -r requirements-dev.txt -r requirements.txt -r
          tools/census/requirements.txt

      - name: Install the census's checkers for every other language
        run: npm ci --prefix head/tools/census

      - name: Take each commit's coverage from its own pytest run (pytest.yml)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # the census counts the statements no test runs from coverage.py's report of the
          # commit's pytest run: the run is found, waited for, and its report taken
          take() {
            for _ in $(seq 40); do
              id=$(gh run list -R "$GITHUB_REPOSITORY" -w pytest.yml -c "$1" -L 1 \
                --json databaseId -q '.[0].databaseId')
              [ -n "$id" ] && break
              sleep 30
            done
            gh run watch "$id" -R "$GITHUB_REPOSITORY" -i 60 > /dev/null
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n coverage -D "$2"
          }
          take "$HEAD_SHA" coverage-head
          if [ -n "$BASE_SHA" ]; then take "$BASE_SHA" coverage-base; fi

      - name: Count the head (after)
        working-directory: head
        run:
          python -m tools.census.census ../census-out/after --coverage
          ../coverage-head/coverage.json

      - name: Count the base with the head's census (before)
        if: github.event_name == 'pull_request'
        working-directory: head
        run: |
          # a base whose pytest run wrote no coverage.json (before pytest.yml wrote one) is
          # counted with that row reported as not counted
          if [ -f ../coverage-base/coverage.json ]; then
            python -m tools.census.census ../census-out/before --repo ../base \
              --coverage ../coverage-base/coverage.json
          else
            python -m tools.census.census ../census-out/before --repo ../base
          fi

      - name: Before and after in the job summary
        if: github.event_name == 'pull_request'
        working-directory: head
        run: >-
          python -m tools.census.compare ../census-out/before/census_*.md
          ../census-out/after/census_*.md >> "$GITHUB_STEP_SUMMARY"

      - name: The report in the job summary
        run: cat census-out/after/census_*.md >> "$GITHUB_STEP_SUMMARY"

      - name: Every item as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: census
          path: census-out/
