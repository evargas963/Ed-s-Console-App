name: Schwab CSV First Guard

# Per-change guard: diff CSV-first check + (on PR) diff-emission against pinned register.
# D17 closure metrics (unreviewed_count == 0) live in schwab-v4-closure.yml — not here.

on:
  pull_request:
  push:

jobs:
  schwab-csv-first:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare PR diff for Schwab guards
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/schwab_csv_first.diff
          else
            git diff HEAD~1..HEAD > /tmp/schwab_csv_first.diff
          fi

      - name: Run Schwab CSV-first guard
        shell: bash
        run: python tools/check_schwab_csv_first.py --diff-file /tmp/schwab_csv_first.diff

      - name: Coherent Schwab meta vs scoreboard (committed artifacts)
        shell: bash
        run: |
          python <<'PY'
          import json, pathlib, sys

          meta_p = pathlib.Path("governance/artifacts/schwab_v4_register_build_meta.json")
          sb_p = pathlib.Path("governance/artifacts/schwab_v4_scoreboard.json")
          meta = json.loads(meta_p.read_text(encoding="utf-8"))
          sb = json.loads(sb_p.read_text(encoding="utf-8"))
          m_sha = meta.get("register_content_sha256")
          s_sha = (sb.get("register_build") or {}).get("register_content_sha256")
          if not m_sha or m_sha != s_sha:
              print(
                  "Committed scoreboard register_build.register_content_sha256 must equal "
                  "meta.register_content_sha256 (rebuild scoreboard after register/meta pin change).",
                  "scoreboard:",
                  s_sha,
                  "meta:",
                  m_sha,
                  file=sys.stderr,
              )
              sys.exit(1)
          print("Committed meta/scoreboard register pin coherent", m_sha[:16])
          PY

      - name: Generate V4 register (gitignored; pin in schwab_v4_register_build_meta.json)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python -m tools.schwab_universal_coverage_scanner_v3 \
            --output governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv \
            --embedding-mode mock
          python <<'PY'
          import csv, hashlib, json, pathlib, sys
          meta = json.loads(pathlib.Path("governance/artifacts/schwab_v4_register_build_meta.json").read_text(encoding="utf-8"))
          p = pathlib.Path("governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          exp = meta.get("register_content_sha256")
          if not exp or h != exp:
              print("register_content_sha256 mismatch", h, exp, file=sys.stderr)
              sys.exit(1)
          want_rows = meta.get("register_rows_written")
          if want_rows:
              with p.open(newline="", encoding="utf-8") as f:
                  n = sum(1 for _ in csv.DictReader(f))
              if n != want_rows:
                  print("register_rows_written mismatch", n, want_rows, file=sys.stderr)
                  sys.exit(1)
          print("V4 register pin OK", h[:16])
          PY

      - name: V4 diff-emission register gate (PR 2)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python tools/check_schwab_csv_first.py \
            --diff-file /tmp/schwab_csv_first.diff \
            --diff-emission-gate \
            --register governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv
