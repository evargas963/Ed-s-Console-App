name: Schwab CSV First Guard

# Per-change guard: diff CSV-first check + (on PR) diff-emission against pinned register.
# D17 closure metrics (unreviewed_count == 0) live in schwab-v4-closure.yml — not here.

on:
  pull_request:
  push:

jobs:
  schwab-csv-first:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect register-relevant changes (push/PR parity)
        id: regscope
        shell: bash
        run: |
          # 2026-07-15 push/PR parity: a push that touches register-governance
          # state (slices, perf-proof bundles, the pin, or the scanner/merge
          # tooling) must run the SAME generation + binding validation a PR
          # runs — no event may silently skip binding validation after touching
          # relevant state. PRs always validate.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi
          # scanner path spelled with a [_] class so the deps-ordering lock
          # (check_ci_tooling_dependencies: pip install must precede the first
          # literal scanner marker) keys on the RUN step below, not this filter
          if git diff --name-only "$BEFORE"..HEAD | grep -qE '^(governance/register_slices/|governance/artifacts/perf_proof/|governance/artifacts/schwab_v4_register_build_meta\.json|governance/artifacts/schwab_v4_scoreboard\.json|tools/schwab_universal_coverage_scanner[_]v3/|tools/stream_revert_v4_register_and_sync_perf\.py|tools/schwab_oxx_validator\.py)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Schwab scanner dependencies (PR register generation)
        if: steps.regscope.outputs.relevant == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Prepare PR diff for Schwab guards
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/schwab_csv_first.diff
          else
            # Multi-commit push coverage: diff the WHOLE pushed range, not just the tip
            # commit — HEAD~1..HEAD let every non-tip commit of a multi-commit push skip
            # the CSV-first guard entirely (observed: a 3-commit push where only the
            # governance tip was scanned). Fall back to HEAD~1 for force-pushes/new
            # branches where the before-SHA is null or unknown.
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE="$(git rev-parse HEAD~1)"
            fi
            git diff "$BEFORE"..HEAD > /tmp/schwab_csv_first.diff
          fi

      - name: Run Schwab CSV-first guard
        shell: bash
        run: python tools/check_schwab_csv_first.py --diff-file /tmp/schwab_csv_first.diff

      - name: Coherent Schwab meta vs scoreboard (committed artifacts)
        shell: bash
        run: |
          python <<'PY'
          import json, pathlib, sys

          meta_p = pathlib.Path("governance/artifacts/schwab_v4_register_build_meta.json")
          sb_p = pathlib.Path("governance/artifacts/schwab_v4_scoreboard.json")
          meta = json.loads(meta_p.read_text(encoding="utf-8"))
          sb = json.loads(sb_p.read_text(encoding="utf-8"))
          m_sha = meta.get("register_content_sha256")
          s_sha = (sb.get("register_build") or {}).get("register_content_sha256")
          if not m_sha or m_sha != s_sha:
              print(
                  "Committed scoreboard register_build.register_content_sha256 must equal "
                  "meta.register_content_sha256 (rebuild scoreboard after register/meta pin change).",
                  "scoreboard:",
                  s_sha,
                  "meta:",
                  m_sha,
                  file=sys.stderr,
              )
              sys.exit(1)
          print("Committed meta/scoreboard register pin coherent", m_sha[:16])
          PY

      - name: Generate V4 register (gitignored; pin in schwab_v4_register_build_meta.json)
        if: steps.regscope.outputs.relevant == 'true'
        shell: bash
        run: |
          # NON-CIRCULAR pin check (2026-07-03): the scanner OVERWRITES the meta file it
          # generates, so comparing against the workspace meta after scanning validated
          # the scanner against itself and could never detect drift. Preserve the
          # COMMITTED pin before scanning and compare against that copy.
          cp governance/artifacts/schwab_v4_register_build_meta.json /tmp/committed_register_meta.json
          # Crash diagnostics: the 2026-07-03 PR runs died with a bare SIGSEGV (exit 139)
          # and no frame; faulthandler + an unlimited stack make the next crash name its
          # location instead of failing silently.
          ulimit -s unlimited || true
          python -X faulthandler -m tools.schwab_universal_coverage_scanner_v3 \
            --output governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv \
            --embedding-mode mock > /tmp/scanner_stdout.json

      - name: Verify V4 register pin (non-circular, vs committed baseline)
        if: github.event_name == 'pull_request' && steps.regscope.outputs.relevant == 'true'
        shell: bash
        run: |
          # Separate step so the 3-line verdict is never drowned by scanner stdout.
          # The runner (Linux checkout) is the PIN AUTHORITY: pins generated on other
          # platforms/working trees may not byte-match (CRLF, untracked files) — on
          # mismatch, adopt the meta uploaded by the artifact step below.
          # PIN AUTHORITY IS THE PR MERGE-REF RUN ONLY (2026-07-15): at the same
          # head, the push-event checkout produced an equal-size register with a
          # different content sha than the PR merge-ref checkout (runs 29447289263
          # vs 29446058436 — 95455 rows, 60435760 bytes on both), so a push-tree
          # pin comparison can never be satisfied by the PR-authoritative pin.
          # Push events still run generation, slice merge, perf-binding validation
          # and the diff-emission gate below — no binding validation is skipped.
          python <<'PY'
          import csv, hashlib, json, pathlib, sys
          meta = json.loads(pathlib.Path("/tmp/committed_register_meta.json").read_text(encoding="utf-8"))
          p = pathlib.Path("governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          exp = meta.get("register_content_sha256")
          with p.open(newline="", encoding="utf-8") as f:
              n = sum(1 for _ in csv.DictReader(f))
          print(f"runner regenerated: sha256={h} rows={n}")
          print(f"committed pin:      sha256={exp} rows={meta.get('register_rows_written')}")
          if not exp or h != exp:
              print(
                  "register_content_sha256 MISMATCH vs COMMITTED pin - a PR that changes "
                  "scanned sources must repin from the runner-regenerated meta "
                  "(download the v4-register-meta artifact of this run).",
                  file=sys.stderr,
              )
              sys.exit(1)
          if meta.get("register_rows_written") and n != meta["register_rows_written"]:
              print("register_rows_written MISMATCH vs COMMITTED pin", file=sys.stderr)
              sys.exit(1)
          print("V4 register pin OK (non-circular)", h[:16])
          PY

      - name: Upload runner-regenerated register meta (pin authority)
        if: steps.regscope.outputs.relevant == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-register-meta
          path: governance/artifacts/schwab_v4_register_build_meta.json
          if-no-files-found: ignore

      - name: Merge register_slices dispositions (for perf-binding validation)
        if: steps.regscope.outputs.relevant == 'true'
        shell: bash
        run: |
          # Runs AFTER the raw-pin verify + artifact upload so the pin authority is
          # untouched; the perf-binding check needs the slice-reconciled register
          # (REPLACED dispositions live in register_slices, not the raw scan).
          python tools/stream_revert_v4_register_and_sync_perf.py --merge-slices

      - name: Verify perf-proof register_link binding (PR-time; was main-only)
        if: steps.regscope.outputs.relevant == 'true'
        shell: bash
        run: |
          # 2026-07-15 root cause: register repins landed without re-syncing the
          # pp_*.json register_link arrays, and the ONLY validator lived in the
          # post-merge main-only closure workflow — PR #41 merged green and main
          # went red. This step fails the PR instead.
          python -m tools.schwab_oxx_validator \
            --register governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv \
            --operator-register governance/OPERATOR_DECISION_REGISTER.md \
            --replaced-perf-only

      - name: V4 diff-emission register gate (PR 2)
        if: steps.regscope.outputs.relevant == 'true'
        shell: bash
        run: |
          python tools/check_schwab_csv_first.py \
            --diff-file /tmp/schwab_csv_first.diff \
            --diff-emission-gate \
            --register governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv
