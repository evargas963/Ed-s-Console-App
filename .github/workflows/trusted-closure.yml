name: Trusted Closure

# UNIVERSAL_QUANTITATIVE_CLOSURE_AND_NON_BYPASS_V1 (2026-09-10, RC-539).
#
# THE TRUST BOUNDARY. `pull_request_target` runs the workflow file, and every tool it
# executes, from the BASE branch — the candidate cannot edit the judge it is judged by.
# The candidate is checked out as DATA into its own directory; the base's delta gate
# materialises it, overlays the base's trust-anchor files on it and judges it with the
# base validator and the base acceptance contract (tools/check_delta_adds_no_debt.py
# --trusted, governance/acceptance.py).
#
# WHY IT IS SAFE TO USE pull_request_target HERE: the job holds `contents: read` only, it
# references no secret, and it never runs with a write token. Candidate code IS executed in
# two places by design — the candidate's own institutional gate (for the validator
# monotonicity measurement) and the closure commands a candidate ledger row cites — both
# with the same read-only token an ordinary `pull_request` job would have. There is no
# privilege to escalate to.
#
# WHAT THIS JOB IS NOT: the required tests. pytest-full and hardening stay the candidate
# lanes (ordinary untrusted-code testing, `pull_request`). This job is the closure verdict.
#
# NOT YET PROVEN (REQ-GOV-REMOTE-NON-BYPASS, OPEN_ITEMS.md): branch protection matches a
# required check by NAME; a candidate workflow can post a same-named check run. Until an
# expected-source primitive (a GitHub App status with `app_id` pinned in branch protection)
# and the operator credential boundary are installed and attacked, this job's verdict is
# a required check by working agreement, not by proof. The measurement is in RC-539.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the BASE branch (the judge)
        uses: actions/checkout@v4
        with:
          # pull_request_target checks out the base ref by default; say so explicitly.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the candidate head as data
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          echo "candidate ${{ github.event.pull_request.head.sha }} on branch ${{ github.event.pull_request.head.ref }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the base's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Trusted closure — base validator and base contract judge the candidate
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
          ED_TERRAIN_QUARANTINE_LEDGER: /tmp/ci-terrain-quarantine-ledger.jsonl
        run: |
          python tools/check_delta_adds_no_debt.py --trusted \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --candidate "${{ github.event.pull_request.head.sha }}" \
            --branch "${{ github.event.pull_request.head.ref }}" \
            --report-json trusted-closure-report.json

      - name: Upload the quantitative acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-closure-report
          path: trusted-closure-report.json
          if-no-files-found: ignore
