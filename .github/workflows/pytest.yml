name: Pytest Full Suite

# Playwright E2E then the full Python suite, on Linux and on Windows: the two required
# runtime-correctness jobs, beside hardening.

on:
  pull_request:
  # A feature branch runs once, as its pull request; a push runs only on main.
  push:
    branches: [main]

jobs:
  pytest-full:
    # ubuntu-latest is 26.04. Playwright 1.59.1 refuses that image
    # ("Cannot install dependencies for ubuntu26.04-x64") and the browser
    # install exits before any test. 24.04 is the image this job was measured on.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # check_fails_before and tests diff against the base branch, which needs full history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements-dev.txt -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps (Linux)
        # Bounded: an unbounded apt-get on a dead mirror outlasts the job's 45 minutes.
        timeout-minutes: 8
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-acquire-timeout >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          EOF
          sudo python3 - <<'PY'
          from pathlib import Path
          old = "azure.archive.ubuntu.com"
          new = "archive.ubuntu.com"
          apt = Path("/etc/apt")
          files = [apt] if apt.is_file() else []
          if apt.is_dir():
              files.extend(p for p in apt.rglob("*") if p.is_file())
          n = 0
          for path in files:
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  print(f"rewrote {path}")
                  n += 1
          print(f"rewrote {n} apt file(s) off azure.archive.ubuntu.com")
          PY
          # ubuntu-24.04 also reads /etc/apt/apt-mirrors.txt, so each attempt is bounded and a
          # dead mirror cannot consume the 8-minute step budget.
          ok=0
          for attempt in 1 2 3; do
            if timeout 90 npx playwright install-deps chromium; then
              ok=1
              break
            fi
            echo "install-deps attempt ${attempt} failed"
          done
          if [ "$ok" -ne 1 ]; then
            echo "install-deps failed after retries; ubuntu-24.04 already ships Chromium libs via the runner image"
            npx playwright install chromium
          fi

      - name: Run Playwright E2E then full pytest
        id: run
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          # Placeholders satisfy config startup in CI — not live Schwab credentials.
          # ED_CI_OFFLINE + config.is_schwab_ci_offline_mode() block live API calls.
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
          ED_PATCH_RECORD: ${{ runner.temp }}/patch-record
        run: |
          # xdist's `-n auto` reads os.process_cpu_count(), which reports fewer cores than the
          # runner has; the worker count is pinned to nproc.
          echo "CI_CPUS nproc=$(nproc) cpu_count=$(python -c 'import os; print(os.cpu_count())') process_cpu_count=$(python -c 'import os; p=getattr(os,"process_cpu_count",None); print(p() if p else None)')"
          # The two suites run one after the other: pytest on every core beside Playwright starves
          # Playwright's real-time timeouts past this job's 45-minute limit. The recorder writes
          # each patch the run applies for the patch check in pytest-windows. A test marked `alone`
          # holds a wall-clock limit, so it runs after the workers, with none beside it.
          set +e
          npm run test:e2e
          e2e_rc=$?
          echo "e2e_rc=$e2e_rc" >> "$GITHUB_OUTPUT"
          python -m pytest -p tools.patch_record -n "$(nproc)" --dist loadfile --durations=20 -rs -m "not alone"
          pytest_rc=$?
          ED_PATCH_RECORD="$ED_PATCH_RECORD/alone" python -m pytest -p tools.patch_record -rs -m alone
          alone_rc=$?
          set -e
          if [ "$e2e_rc" -ne 0 ]; then
            echo "Playwright E2E failed with ${e2e_rc}"
            exit "$e2e_rc"
          fi
          if [ "$pytest_rc" -ne 0 ]; then
            exit "$pytest_rc"
          fi
          exit "$alone_rc"

      - name: Upload Playwright failure traces and the E2E log
        if: failure() && steps.run.outputs.e2e_rc != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-failures
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
            logs/test_e2e_last.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

      - name: A changed end-to-end path test fails on the old code (AGENTS.md rule 1, Before writing code)
        if: github.event_name == 'pull_request'
        env:
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.check_fails_before --base "origin/$BASE_REF"

      - name: Keep the suite's patch record for pytest-windows
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: patch-record-linux
          path: ${{ runner.temp }}/patch-record
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  pytest-windows:
    # Production runs on Windows; pytest-full runs on Linux, where the launcher's console windows,
    # the daemon's pythonw start, the guards' Windows path handling and the guard against killing
    # it are skipped or take another path. The browser tests and the whole pytest suite run here,
    # one after the other as in pytest-full, so no Windows path is left to a guess of which tests
    # reach it. It starts after pytest-full, whatever that job's result, to judge both jobs' patch
    # records together.
    needs: pytest-full
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # tests read origin/main and diff against it, which needs full history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        shell: bash
        run: uv pip install --system -r requirements-dev.txt -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies and Chromium
        run: |
          npm ci
          npx playwright install chromium

      - name: Run the browser tests on Windows
        id: e2e
        shell: bash
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
        run: npm run test:e2e

      - name: Run the full pytest suite on Windows
        if: success() || failure()
        shell: bash
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
          ED_PATCH_RECORD: ${{ runner.temp }}/patch-record
        run: python -m pytest -p tools.patch_record -n auto --dist loadfile --durations=20 -rs -m "not alone"

      - name: Run the tests that hold a wall-clock limit, with no workers beside them
        if: success() || failure()
        shell: bash
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
          ED_PATCH_RECORD: ${{ runner.temp }}/patch-record/alone
        run: python -m pytest -p tools.patch_record -rs -m alone

      - name: Fetch pytest-full's patch record
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: patch-record-linux
          path: ${{ runner.temp }}/patch-record-linux

      - name: no new or changed test patches the code it tests, as both systems' runs recorded (TEST-PATCHES)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python -m tools.check_no_new_patches --base "origin/$BASE_REF" --record "$RUNNER_TEMP/patch-record" "$RUNNER_TEMP/patch-record/alone" "$RUNNER_TEMP/patch-record-linux" "$RUNNER_TEMP/patch-record-linux/alone"

      - name: Upload Playwright failure traces and the E2E log
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-failures-windows
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
            logs/test_e2e_last.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
