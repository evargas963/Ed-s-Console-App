name: Pytest Full Suite

# Playwright E2E then the full Python suite (npm run test:all), on Linux: a required check on
# main, alongside the Hardening job.

on:
  pull_request:
  # A feature branch is tested by its pull request; a push runs only on main.
  push:
    branches: [main]

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements-dev.txt -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps (Linux)
        # Bounded: an apt mirror that does not answer must not consume the job's 45 minutes.
        timeout-minutes: 8
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-acquire-timeout >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          EOF
          sudo python3 - <<'PY'
          from pathlib import Path
          old = "azure.archive.ubuntu.com"
          new = "archive.ubuntu.com"
          apt = Path("/etc/apt")
          files = [apt] if apt.is_file() else []
          if apt.is_dir():
              files.extend(p for p in apt.rglob("*") if p.is_file())
          n = 0
          for path in files:
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  print(f"rewrote {path}")
                  n += 1
          print(f"rewrote {n} apt file(s) off azure.archive.ubuntu.com")
          PY
          # Each attempt bounded, so a dead mirror cannot consume the step's 8 minutes.
          ok=0
          for attempt in 1 2 3; do
            if timeout 90 npx playwright install-deps chromium; then
              ok=1
              break
            fi
            echo "install-deps attempt ${attempt} failed"
          done
          if [ "$ok" -ne 1 ]; then
            echo "install-deps failed after retries; ubuntu-24.04 already ships Chromium libs via the runner image"
            npx playwright install chromium
          fi

      - name: Run Playwright E2E then full pytest
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          # Placeholders satisfy config startup in CI — not live Schwab credentials.
          # ED_CI_OFFLINE + config.is_schwab_ci_offline_mode() block live API calls.
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
        run: |
          # xdist `auto` reads `os.process_cpu_count()`, which can be below nproc on the runner;
          # the worker count is pinned to nproc.
          echo "CI_CPUS nproc=$(nproc) cpu_count=$(python -c 'import os; print(os.cpu_count())') process_cpu_count=$(python -c 'import os; p=getattr(os,"process_cpu_count",None); print(p() if p else None)')"
          # E2E then pytest, one after the other: a pytest run on every core starves
          # Playwright's real-time per-action timeouts.
          set +e
          npm run test:e2e
          e2e_rc=$?
          python -m pytest -n "$(nproc)" --dist loadfile --durations=20
          pytest_rc=$?
          set -e
          if [ "$e2e_rc" -ne 0 ]; then
            echo "Playwright E2E failed with ${e2e_rc}"
            exit "$e2e_rc"
          fi
          exit "$pytest_rc"
