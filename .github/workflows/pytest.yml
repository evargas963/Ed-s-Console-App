---
name: Pytest Full Suite

# Playwright E2E and the full Python suite, on Linux and on Windows. Each suite runs on a runner
# of its own, side by side; the two required jobs, pytest-full and pytest-windows, pass only when
# both suites of their system passed.

on:
  pull_request:
  # A feature branch runs once, as its pull request; a push runs only on main.
  push:
    branches: [main]

# A newer push to a pull request cancels the run it replaces; every commit to main runs whole.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every suite runs offline. The placeholders satisfy config startup in CI and are not live Schwab
# credentials; ED_CI_OFFLINE with config.is_schwab_ci_offline_mode() blocks live API calls.
env:
  CI: "true"
  ED_CI_OFFLINE: "1"
  ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
  SCHWAB_API_KEY: "ci-not-live-placeholder"
  SCHWAB_APP_SECRET: "ci-not-live-placeholder"

jobs:
  linux-browser:
    # ubuntu-latest is 26.04. Playwright 1.59.1 refuses that image
    # ("Cannot install dependencies for ubuntu26.04-x64") and the browser
    # install exits before any test. 24.04 is the image this job was measured on.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The steps every suite starts with are written once here and named by the other jobs (YAML
    # anchors, &name, and aliases, *name: docs/SOURCES.md github-actions-yaml-anchors).
    steps:
      - &check-out
        name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # tests read origin/main and diff against it, which needs full history
          fetch-depth: 0
          filter: blob:none # every commit; a file's old versions only when one is read

      - &set-up-tools
        name: Set up the tools
        uses: ./.github/actions/set-up-tools

      - &install
        name: Install Python and Node dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements-dev.txt -r requirements.txt
          npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps (Linux)
        # Bounded: an unbounded apt-get on a dead mirror outlasts the job's 45 minutes.
        timeout-minutes: 8
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-acquire-timeout >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          EOF
          sudo python3 - <<'PY'
          from pathlib import Path
          old = "azure.archive.ubuntu.com"
          new = "archive.ubuntu.com"
          apt = Path("/etc/apt")
          files = [apt] if apt.is_file() else []
          if apt.is_dir():
              files.extend(p for p in apt.rglob("*") if p.is_file())
          n = 0
          for path in files:
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  print(f"rewrote {path}")
                  n += 1
          print(f"rewrote {n} apt file(s) off azure.archive.ubuntu.com")
          PY
          # ubuntu-24.04 also reads /etc/apt/apt-mirrors.txt, so each attempt is bounded and a
          # dead mirror cannot consume the 8-minute step budget.
          ok=0
          for attempt in 1 2 3; do
            if timeout 90 npx playwright install-deps chromium; then
              ok=1
              break
            fi
            echo "install-deps attempt ${attempt} failed"
          done
          if [ "$ok" -ne 1 ]; then
            echo "install-deps failed after retries; the runner image has Chromium's libraries"
            npx playwright install chromium
          fi

      - name: Run the browser tests
        # each worker writes the lines of the page's scripts its tests ran, which the census counts
        # (tests/e2e/fixtures/test.js)
        env:
          ED_PAGE_COVERAGE: page-coverage
        run: npm run test:e2e

      - name: Upload which lines of the page's scripts the browser tests run
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: page-coverage
          path: page-coverage/
          retention-days: 14

      - name: Upload Playwright failure traces and the E2E log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
            logs/test_e2e_last.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  linux-pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *check-out
      - *set-up-tools
      - *install

      - name: Run the full pytest suite
        run: |
          # xdist's `-n auto` reads os.process_cpu_count(), which reports fewer cores than the
          # runner has; the worker count is pinned to nproc.
          counts=$(python -c 'import os; print(os.cpu_count(), os.process_cpu_count())')
          echo "CI_CPUS nproc=$(nproc) cpu_count process_cpu_count=$counts"
          # The browser tests run on a runner of their own (linux-browser): pytest on every core
          # beside Playwright starves Playwright's real-time timeouts. A test marked `alone` holds
          # a wall-clock limit, so it runs after the workers, with none beside it. Each side of an
          # if, a loop and a match is measured as well as each statement (--cov-branch, which
          # pytest-cov hands to every process a test starts; a setting in pyproject.toml reaches
          # only its own), and a side no test takes is counted by the census.
          set +e
          python -m pytest -n "$(nproc)" --dist loadfile --durations=20 -rs -m "not alone" \
            --cov --cov-branch --cov-context=test --cov-report=
          pytest_rc=$?
          # measured too, its data added to the workers' (--cov-append)
          python -m pytest --durations=1 -rs -m alone \
            --cov --cov-branch --cov-context=test --cov-append --cov-report=
          alone_rc=$?
          set -e
          if [ "$pytest_rc" -ne 0 ]; then
            exit "$pytest_rc"
          fi
          exit "$alone_rc"

      - name: Every test file serves the app (.claude/rules/tests.md)
        run: python -m tools.check_tests_serve_app .coverage

      - &upload-coverage
        name: Upload which product lines each test runs on this system
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ runner.os }}
          path: .coverage
          include-hidden-files: true
          retention-days: 14

  coverage:
    # The lines the suite runs on both systems, as one report: coverage.py combines the two
    # systems' data, its relative_files (pyproject.toml) mapping Windows' paths and Linux's to one
    # file in this checkout. The census reads this job's `coverage` (census.yml).
    needs: [linux-pytest, windows-pytest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - *check-out
      - *set-up-tools
      - *install

      - name: Download each system's data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-*
          path: systems

      - name: The product lines no test runs on either system
        run: |
          python -m coverage combine --keep systems/coverage-*/.coverage
          # a test's copy of a module in its temporary folder exists only on the runner that ran
          # it, and is no file of the repository
          copies="*/pytest-of-*/*"
          python -m coverage report --sort=cover --skip-covered --show-missing --omit="$copies" \
            | tee coverage.txt
          # every file's statements and those no test ran, which the census counts (census.yml)
          python -m coverage json -o coverage.json --omit="$copies"

      - name: Upload which product lines the suite runs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            .coverage
            coverage.txt
            coverage.json
          include-hidden-files: true
          retention-days: 14

  pytest-full:
    # The required check on Linux. A job a failed job is needed by is skipped, and GitHub reads a
    # skipped required check as passed, so this one always runs and reads both results itself.
    needs: [linux-browser, linux-pytest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both suites passed on Linux
        env:
          BROWSER: ${{ needs.linux-browser.result }}
          PYTEST: ${{ needs.linux-pytest.result }}
        run: |
          echo "browser tests: $BROWSER; pytest: $PYTEST"
          [ "$BROWSER" = "success" ] && [ "$PYTEST" = "success" ]

  windows-browser:
    # Production runs on Windows; the Linux jobs skip or take another path through the launcher's
    # console windows, the daemon's start in its window, the guards' Windows path handling and the
    # guard against killing it. The browser tests and the whole pytest suite run on Windows too,
    # each on a runner of its own, so no Windows path is left to a guess of which tests reach it.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - *check-out
      - *set-up-tools
      - *install

      - name: Install Chromium
        shell: bash
        run: npx playwright install chromium

      - name: Run the browser tests on Windows
        shell: bash
        run: npm run test:e2e

      - name: Upload Playwright failure traces and the E2E log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures-windows
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
            logs/test_e2e_last.log
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14

  windows-pytest:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - *check-out
      - *set-up-tools
      - *install

      - name: Run the full pytest suite on Windows
        shell: bash
        env:
          # the tests' files on the runner's local disk (D:), as production's databases are on
          # its machine's own disk; the default temp is on C:, the runner's network disk (the
          # runner context is a step's, not a job's)
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        # pinned to nproc as in linux-pytest: `-n auto` started 2 workers on this 4-core runner;
        # measured as linux-pytest measures, so the lines only Windows runs are counted as run
        run: |
          python -m pytest -n "$(nproc)" --dist loadfile --durations=20 -rs -m "not alone" \
            --cov --cov-branch --cov-context=test --cov-report=

      - name: Run the tests that hold a wall-clock limit, with no workers beside them
        if: success() || failure()
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python -m pytest --durations=1 -rs -m alone \
            --cov --cov-branch --cov-context=test --cov-append --cov-report=

      - *upload-coverage

  pytest-windows:
    # The required check on Windows; it reads both results itself, as pytest-full does.
    needs: [windows-browser, windows-pytest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both suites passed on Windows
        env:
          BROWSER: ${{ needs.windows-browser.result }}
          PYTEST: ${{ needs.windows-pytest.result }}
        run: |
          echo "browser tests: $BROWSER; pytest: $PYTEST"
          [ "$BROWSER" = "success" ] && [ "$PYTEST" = "success" ]
