name: Pytest Full Suite

# Full Python suite + Playwright E2E (npm run test:all): the required runtime-correctness
# gate under the ED CONSOLE SLIMMING charter (AGENTS.md), alongside the Hardening quality job.

on:
  pull_request:
  push:

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # FULL_FIXES_ONLY_V2: FINAL_SHA verification needs full history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright system deps (Linux)
        run: npx playwright install-deps chromium

      # ── TEMPORARY DIAGNOSTIC (RC-397) — REMOVE once the Linux-only causes are proven.
      # Three failure classes reproduce only on this runner and pass on every local
      # Windows checkout, so the runner is the only place the evidence exists. These steps
      # capture WHEN the tracked files change and WHAT the audit actually says. The single
      # `npm run test:all` step is split into its two halves for the same reason — one
      # combined step cannot say which half rewrote a file.
      - name: DIAG (temporary) — worktree state immediately after checkout
        run: |
          echo "--- git status ---"; git status --porcelain | head -40
          echo "--- core.autocrlf / core.eol ---"
          git config --get core.autocrlf || echo "autocrlf unset"
          git config --get core.eol || echo "eol unset"
          echo "--- CRLF count: worktree vs blob ---"
          for f in static/chart.html static/index.html \
                   reports/scoreboard_forensic/legacy_differential/legacy_differential_result.json; do
            w=$(grep -c $'\r$' "$f" 2>/dev/null || echo 0)
            b=$(git cat-file blob "HEAD:$f" | grep -c $'\r$' 2>/dev/null || echo 0)
            echo "$f  worktree_crlf=$w  blob_crlf=$b"
          done

      - name: Run Playwright E2E
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
        run: npm run test:e2e

      - name: DIAG (temporary) — worktree state after E2E
        if: always()
        run: |
          echo "--- git status after E2E ---"; git status --porcelain | head -40
          for f in static/chart.html static/index.html; do
            w=$(grep -c $'\r$' "$f" 2>/dev/null || echo 0)
            echo "$f  worktree_crlf=$w"
          done

      - name: Full pytest
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          # Placeholders satisfy config startup in CI — not live Schwab credentials.
          # ED_CI_OFFLINE + config.is_schwab_ci_offline_mode() block live API calls.
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
        run: python -m pytest -q

      - name: DIAG (temporary) — failure detail
        if: failure()
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
        run: |
          echo "--- git status at failure ---"; git status --porcelain | head -40
          echo "--- diff stat for tracked changes ---"; git diff --stat | tail -20
          echo "--- turn_self_audit_contract, first failure verbose ---"
          python -m pytest tests/test_turn_self_audit_contract_v1.py -x -vv --tb=long 2>&1 | tail -110
