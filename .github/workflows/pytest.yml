name: Pytest Full Suite

# Full Python suite + Playwright E2E (npm run test:all): the required runtime-correctness
# gate under the ED CONSOLE SLIMMING charter (AGENTS.md), alongside the Hardening quality job.

on:
  pull_request:
  # RC-405 (engineering-cycle latency): run the full suite once per change. `pull_request`
  # already runs full CI before merge (branch protection's required check), so a `push` event
  # on a FEATURE branch only duplicates it. Restrict the push trigger to `main` — that keeps
  # post-merge validation of the trunk while removing the redundant per-feature-push run. No
  # check is weakened or skipped; the pre-merge proof is unchanged.
  push:
    branches: [main]

jobs:
  pytest-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # FULL_FIXES_ONLY_V2: FINAL_SHA verification needs full history
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        shell: bash
        run: |
          uv pip install --system -r requirements-dev.txt -r requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps (Linux)
        # Bound this step. Unbounded apt-get is what cancelled required pytest-full:
        # run 32223509912 (#134) and 32161696563 (main, #129) both sat ~43m on
        # `playwright install-deps` after `Ign: azure.archive.ubuntu.com`, then the
        # job `timeout-minutes: 45` cancelled before E2E/pytest started.
        timeout-minutes: 8
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-acquire-timeout >/dev/null <<'EOF'
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::Retries "2";
          EOF
          sudo python3 - <<'PY'
          from pathlib import Path
          old = "azure.archive.ubuntu.com"
          new = "archive.ubuntu.com"
          apt = Path("/etc/apt")
          files = [apt] if apt.is_file() else []
          if apt.is_dir():
              files.extend(p for p in apt.rglob("*") if p.is_file())
          n = 0
          for path in files:
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
                  print(f"rewrote {path}")
                  n += 1
          print(f"rewrote {n} apt file(s) off azure.archive.ubuntu.com")
          PY
          # Apt still hung after the .list/.sources-only rewrite (run 32231391764)
          # because ubuntu-24.04 GHA uses /etc/apt/apt-mirrors.txt. Bound each
          # attempt so a dead mirror cannot consume the 8-minute step budget.
          ok=0
          for attempt in 1 2 3; do
            if timeout 90 npx playwright install-deps chromium; then
              ok=1
              break
            fi
            echo "install-deps attempt ${attempt} failed"
          done
          if [ "$ok" -ne 1 ]; then
            echo "install-deps failed after retries; ubuntu-24.04 already ships Chromium libs via the runner image"
            npx playwright install chromium
          fi

      - name: Run Playwright E2E then full pytest
        env:
          CI: "true"
          ED_CI_OFFLINE: "1"
          ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
          # Placeholders satisfy config startup in CI — not live Schwab credentials.
          # ED_CI_OFFLINE + config.is_schwab_ci_offline_mode() block live API calls.
          SCHWAB_API_KEY: "ci-not-live-placeholder"
          SCHWAB_APP_SECRET: "ci-not-live-placeholder"
          # The E2E webServer uvicorn runs CONCURRENTLY with the pytest wave (see the
          # `npm run test:e2e &` overlap below) and pytest's conftest env cannot reach
          # it. Offline hard-failures made that server quarantine its ticker mid-wave,
          # appending ~480B to the TRACKED reports/terrain_quarantine_ledger.jsonl —
          # the byte firewall then failed whichever innocent test's window caught it
          # (runs 32794981545, 32796571126). CI must never write a tracked operator
          # audit file: point every process in this job at a scratch ledger.
          ED_TERRAIN_QUARANTINE_LEDGER: /tmp/ci-terrain-quarantine-ledger.jsonl
        run: |
          # MEASURED on required pytest-full 32234684073: nproc=4 and
          # os.cpu_count()=4 but `pytest -n auto` still created 2/2 workers
          # (Python 3.13 `os.process_cpu_count()` is what xdist `auto` reads).
          # Pin the worker count to the runner's nproc — same suite, more cores.
          echo "CI_CPUS nproc=$(nproc) cpu_count=$(python -c 'import os; print(os.cpu_count())') process_cpu_count=$(python -c 'import os; p=getattr(os,"process_cpu_count",None); print(p() if p else None)')"
          # SEQUENTIAL, not overlapped (2026-09-15 reversal of the prior "overlap E2E with the
          # pytest wave" optimization). That optimization was sized for the E2E suite AS IT WAS
          # THEN: "78 passed / 54.4s serial *before* pytest's 232s" -- i.e. E2E was the SHORTER
          # run and overlap was pure upside. The E2E suite has since grown to 207 tests and is
          # now the LONGER-RUNNING half; backgrounding it alongside a `pytest -n $(nproc)` run
          # that consumes every core on this 4-CPU runner starves Playwright's own real-time
          # per-action timeouts, and this job was OBSERVED to run past its 45-minute ceiling and
          # get force-cancelled twice in a row (runs 34931697740, 34957824709) with
          # `npm run test:e2e` still alive at kill time -- not a deadlock, just resource
          # starvation inflating E2E's wall-clock well past the budget. Each suite now gets the
          # full runner to itself; a locally uncontended E2E run of this same suite completes in
          # well under 15 minutes, so sequential is both correct and still comfortably within
          # this job's 45-minute limit. UNIVERSAL_QUANTITATIVE_CLOSURE_V1 (RC-542): the
          # `.playwright_last_run_success` marker and tests/test_playwright_must_run.py
          # are retired — a tracked, hand-editable JSON stamp compared to file mtimes
          # was a proxy for the run this job already performs and reports exactly.
          # Local `npm run test:all` stays serial (unchanged by this).
          set +e
          npm run test:e2e
          e2e_rc=$?
          python -m pytest -n "$(nproc)" --dist loadfile --durations=20 --junitxml=/tmp/pytest-report.xml
          pytest_rc=$?
          # Skip-transparency gate (2026-09-20): a full-suite "N passed, M skipped" run was
          # being read as green without anyone checking what the M skips actually were --
          # a direct audit found 8 of 10 skips in one run were tests that had NEVER executed
          # in ANY CI environment. tools/check_skip_ledger.py consumes this same run's own
          # --junitxml output (pytest-xdist already aggregates it correctly across every
          # worker) and fails if any skip is neither self-declared (a "PRODUCTION-DATA-ONLY"
          # reason) nor an exact, reviewed entry in tests/skip_ledger.json. See that script's
          # module docstring for why this is a separate step rather than a conftest hook --
          # a pytest_sessionfinish exitstatus mutation was tried and verified NOT to affect
          # the process exit code under xdist.
          python tools/check_skip_ledger.py /tmp/pytest-report.xml
          skip_ledger_rc=$?
          set -e
          if [ "$e2e_rc" -ne 0 ]; then
            echo "Playwright E2E failed with ${e2e_rc}"
            exit "$e2e_rc"
          fi
          if [ "$skip_ledger_rc" -ne 0 ]; then
            echo "Skip ledger gate failed with ${skip_ledger_rc}"
            exit "$skip_ledger_rc"
          fi
          exit "$pytest_rc"
