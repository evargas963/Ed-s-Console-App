name: Probe of the locks step

# Throwaway, never merged: the install and lint-imports lines of locks.yml at 18f86b0c, on GitHub's
# runner, on a clean tree and on this branch's planted import.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: 18f86b0c3b54b10d2e4bc2c0f3142d4600831733
          persist-credentials: false
          path: judge
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          path: head
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: the base's ruff and import-linter
        run: |
          python -m pip install "$(grep '^ruff==' judge/requirements-dev.txt)" \
            "$(grep '^import-linter==' judge/requirements-dev.txt)" \
            "$(grep '^grimp==' judge/requirements-dev.txt)"
      - name: clean tree, must keep both contracts
        run: |
          mkdir clean
          cp -r judge clean/head
          cd clean
          lint-imports --config ../judge/locks.imports.toml --no-cache
      - name: planted import, must be refused
        run: |
          cd head
          cd ..
          lint-imports --config judge/locks.imports.toml --no-cache
