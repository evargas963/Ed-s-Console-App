name: DO NOT MERGE diag keep on Windows

# Measures tests/test_data_path_stream_kept_v1.py's keep test on the Windows runner: alone on C:
# (pytest's temp) and on D: (the runner's temp), and beside the suite's other workers, with the
# disks' write latency and the CPU sampled every second.

on:
  pull_request:

jobs:
  keep-probe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      ED_CI_OFFLINE: "1"
      ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
      SCHWAB_API_KEY: "ci-not-live-placeholder"
      SCHWAB_APP_SECRET: "ci-not-live-placeholder"
      KEEP: "tests/test_data_path_stream_kept_v1.py::test_every_message_arriving_during_the_keep_is_written_while_old_rows_are_still_being_removed"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        shell: bash
        run: uv pip install --system -r requirements-dev.txt -r requirements.txt
      - name: Runner
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
          Get-PSDrive C, D | Format-Table
          Get-PhysicalDisk | Format-Table FriendlyName, MediaType, Size
          "TEMP=$env:TEMP RUNNER_TEMP=$env:RUNNER_TEMP nproc=$env:NUMBER_OF_PROCESSORS"
      - name: Start the disk and CPU sampler
        shell: pwsh
        run: |
          Start-Process typeperf -ArgumentList '"\LogicalDisk(C:)\Avg. Disk sec/Write"','"\LogicalDisk(C:)\Disk Writes/sec"','"\LogicalDisk(C:)\Current Disk Queue Length"','"\LogicalDisk(D:)\Avg. Disk sec/Write"','"\Processor(_Total)\% Processor Time"','-si','1','-o',"$env:RUNNER_TEMP\perf.csv",'-y' -WindowStyle Hidden
      - name: The keep test alone, three times on C and three on D
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "== C $i $(date +%T)"
            python -m pytest "$KEEP" -q -p no:cacheprovider --durations=2 2>&1 | grep -e "s call" -e "s setup" -e passed -e failed
          done
          for i in 1 2 3; do
            echo "== D $i $(date +%T)"
            python -m pytest "$KEEP" -q -p no:cacheprovider --durations=2 --basetemp="$RUNNER_TEMP/pt$i" 2>&1 | grep -e "s call" -e "s setup" -e passed -e failed
          done
      - name: The keep test beside three suite workers, five times
        shell: bash
        run: |
          python -m pytest -n 3 --dist loadfile -q -p no:cacheprovider -m "not alone" \
            --deselect tests/test_data_path_stream_kept_v1.py > suite.log 2>&1 &
          suite=$!
          sleep 30
          for i in 1 2 3 4 5; do
            echo "== beside $i $(date +%T)"
            python -m pytest "$KEEP" -q -p no:cacheprovider --durations=2 2>&1 | grep -e "s call" -e "s setup" -e passed -e failed -e "timed out"
          done
          wait $suite || true
          tail -2 suite.log
      - name: The suite as CI runs it, three times
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "== suite $i $(date +%T)"
            python -m pytest -n "$(nproc)" --dist loadfile -q -p no:cacheprovider -m "not alone" \
              --durations=40 2>&1 | grep -e stream_kept -e " passed" -e " failed" | tail -6
          done
      - name: Disk and CPU samples
        if: always()
        shell: pwsh
        run: |
          Get-Process typeperf -ErrorAction SilentlyContinue | Stop-Process
          Get-Content "$env:RUNNER_TEMP\perf.csv"
