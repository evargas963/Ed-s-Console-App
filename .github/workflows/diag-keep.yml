name: DO NOT MERGE diag keep on Windows

# Forces tests/test_data_path_stream_kept_v1.py's keep test to fail on the Windows runner: its
# database on C: (pytest's temp, the runner's network OS disk) while induced write-through 4 KB
# writes load C:. The same command with TEMP and TMP on D: (the runner's local NVMe). Then the
# whole suite with its temp on D:, three times. The disks' write latency is sampled each second.

on:
  pull_request:

jobs:
  keep-probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      ED_CI_OFFLINE: "1"
      ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
      SCHWAB_API_KEY: "ci-not-live-placeholder"
      SCHWAB_APP_SECRET: "ci-not-live-placeholder"
      KEEP: "tests/test_data_path_stream_kept_v1.py::test_every_message_arriving_during_the_keep_is_written_while_old_rows_are_still_being_removed"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - name: Install Python dependencies
        shell: bash
        run: uv pip install --system -r requirements-dev.txt -r requirements.txt
      - name: Start the disk sampler
        shell: pwsh
        run: |
          Start-Process typeperf -ArgumentList '"\LogicalDisk(C:)\Avg. Disk sec/Write"','"\LogicalDisk(D:)\Avg. Disk sec/Write"','"\Processor(_Total)\% Processor Time"','-si','1','-o',"$env:RUNNER_TEMP\perf.csv",'-y' -WindowStyle Hidden
      - name: Forced, the keep test with C loaded, temp on C then on D
        shell: pwsh
        run: |
          $churn = {
            param($path, $seconds)
            $fs = [IO.FileStream]::new($path, 'Create', 'ReadWrite', 'None', 4096, [IO.FileOptions]::WriteThrough)
            $fs.SetLength(32MB)
            $b = New-Object byte[] 4096
            $r = [Random]::new()
            $end = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $end) { $fs.Position = $r.Next(8192) * 4096; $fs.Write($b, 0, 4096) }
            $fs.Close()
          }
          $jobs = 1..4 | ForEach-Object { Start-Job $churn -ArgumentList "$env:TEMP\churn$_.bin", 900 }
          Start-Sleep 5
          foreach ($i in 1..3) {
            "== forced C $i $(Get-Date -Format T)"
            python -m pytest $env:KEEP -q -p no:cacheprovider --durations=2 -rf 2>&1 | Select-String "s call|s setup|passed|failed|timed out|assert "
          }
          $env:TEMP = $env:RUNNER_TEMP; $env:TMP = $env:RUNNER_TEMP
          foreach ($i in 1..3) {
            "== forced D $i $(Get-Date -Format T)"
            python -m pytest $env:KEEP -q -p no:cacheprovider --durations=2 -rf 2>&1 | Select-String "s call|s setup|passed|failed|timed out|assert "
          }
          $jobs | Stop-Job; $jobs | Remove-Job
      - name: The suite with its temp on D, three times
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          for i in 1 2 3; do
            echo "== suite on D $i $(date +%T)"
            python -m pytest -n "$(nproc)" --dist loadfile -q -p no:cacheprovider -m "not alone" \
              -rf --durations=40 2>&1 | grep -e stream_kept -e FAILED -e " passed" -e " failed" | tail -25
          done
      - name: Disk samples
        if: always()
        shell: pwsh
        run: |
          Get-Process typeperf -ErrorAction SilentlyContinue | Stop-Process
          Get-Content "$env:RUNNER_TEMP\perf.csv"
