---
name: Mutation

# Mutation testing (mutmut): deliberate mistakes in the code pyproject.toml's [tool.mutmut] names,
# each run against the tests that reach it; a mistake no test catches survives and shows where a
# test is too weak. A measurement: every Saturday on main, whose newest run the census counts
# (tools/census/census.py), by hand, or by pushing a mutation/* branch; it gates nothing.
on:
  schedule:
    # Saturday 08:00 UTC, the market closed
    - cron: "0 8 * * 6"
  workflow_dispatch:
  push:
    branches: ["mutation/**"]

env:
  CI: "true"
  ED_CI_OFFLINE: "1"
  ED_CONSOLE_ALLOW_NONCANONICAL_DB: "1"
  SCHWAB_API_KEY: "ci-not-live-placeholder"
  SCHWAB_APP_SECRET: "ci-not-live-placeholder"

permissions:
  contents: read

jobs:
  # every module of calc/ that holds a function, read from the code: a module added is measured,
  # and one with nothing to mutate (a record alone) is not run
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: The modules of calc/ that hold a function
        id: list
        run: |
          python -c '
          import ast, json, pathlib
          held = [
              p.stem
              for p in sorted(pathlib.Path("calc").glob("*.py"))
              if any(
                  isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
                  for n in ast.walk(ast.parse(p.read_text(encoding="utf-8")))
              )
          ]
          print("list=" + json.dumps(held))
          ' >> "$GITHUB_OUTPUT"

  # one job per module, each on a runner of its own: one whole run of every module lost its runner
  # twice, about halfway (runs 44688655892 and 44695117505, no results kept); a module's job is
  # short, and a lost runner loses that module alone
  mutmut:
    needs: modules
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up the tools
        uses: ./.github/actions/set-up-tools

      - name: Install Python dependencies
        run: uv pip install --system -r requirements-dev.txt -r requirements.txt

      # two workers: each forks the whole test process, and four ran the runner out
      - name: Run the mutants
        run: mutmut run --max-children 2 "calc.${{ matrix.module }}.*"

      # the score and each surviving mutant are kept however the job ends
      - name: The score
        if: always()
        run: |
          mutmut export-cicd-stats
          cat mutants/mutmut-cicd-stats.json
          mutmut results | tee mutants/survivors.txt
          # each surviving mutant's change, the test that would catch it is written from
          grep ': survived' mutants/survivors.txt | cut -d: -f1 | xargs -r -n1 mutmut show \
            | tee mutants/survivor_diffs.txt

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutmut-${{ matrix.module }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/survivors.txt
            mutants/survivor_diffs.txt
            mutants/**/*.meta
          if-no-files-found: warn
