name: Schwab V4 Register Closure

# Heavy register pipeline + D17 closure metrics. Fails until unreviewed_count == 0
# on the scoped canonical register (gitignore + SCAN_SCOPE_EXCLUDE_PREFIXES).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - governance/SCHWAB_*
      - governance/OPERATOR_DECISION_REGISTER.md
      - governance/register_slices/**
      - governance/artifacts/schwab_v4_*
      - governance/artifacts/schwab_ablation_field_registry.json
      - governance/artifacts/perf_proof/**
      - tools/schwab_*
      - tools/check_schwab_csv_first.py
      - tools/stream_revert_v4_register_and_sync_perf.py
      - tests/test_schwab_*
      - tests/test_check_schwab_csv_first.py
      - .github/workflows/schwab-v4-closure.yml

jobs:
  schwab-v4-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Schwab scanner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate V4 register (gitignored; slice reconciliation follows)
        shell: bash
        run: |
          python -m tools.schwab_universal_coverage_scanner_v3 \
            --output governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv \
            --embedding-mode mock

      - name: Merge register_slices dispositions into generated register
        shell: bash
        run: |
          python tools/stream_revert_v4_register_and_sync_perf.py --merge-slices

      - name: Revert slice-bleed REPLACED rows (no perf_proof governed_ref)
        shell: bash
        run: |
          python <<'PY'
          import csv
          import re
          import subprocess
          import sys
          from pathlib import Path

          pp = re.compile(r"pp_[^/\\]+\.json")
          ids: list[str] = []
          reg = Path("governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv")
          with reg.open(newline="", encoding="utf-8") as f:
              for row in csv.DictReader(f):
                  if (row.get("disposition") or "").strip() != "REPLACED":
                      continue
                  ref = (row.get("governed_ref") or "").strip()
                  if not pp.search(ref):
                      ids.append((row.get("register_id") or "").strip())
          if not ids:
              print("no slice-bleed REPLACED rows to revert")
              sys.exit(0)
          print("reverting", len(ids), "register_ids without pp governed_ref")
          subprocess.run(
              [
                  sys.executable,
                  "tools/stream_revert_v4_register_and_sync_perf.py",
                  "--revert-ids",
                  ",".join(ids),
              ],
              check=True,
          )
          PY

      - name: Verify reconciled register pin matches schwab_v4_register_build_meta.json
        shell: bash
        run: |
          python <<'PY'
          import csv, hashlib, json, pathlib, sys
          meta = json.loads(pathlib.Path("governance/artifacts/schwab_v4_register_build_meta.json").read_text(encoding="utf-8"))
          p = pathlib.Path("governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          exp = meta.get("register_content_sha256")
          if not exp or h != exp:
              print("register_content_sha256 mismatch", h, exp, file=sys.stderr)
              sys.exit(1)
          want_rows = meta.get("register_rows_written")
          if want_rows:
              with p.open(newline="", encoding="utf-8") as f:
                  n = sum(1 for _ in csv.DictReader(f))
              if n != want_rows:
                  print("register_rows_written mismatch", n, want_rows, file=sys.stderr)
                  sys.exit(1)
          print("V4 reconciled register pin OK", h[:16])
          PY

      - name: Rebuild V4 scoreboard (D17 + register_build from current register/meta)
        shell: bash
        run: |
          python -m tools.schwab_v4_scoreboard

      - name: Fail if reconciliation changed unexpected tracked files
        shell: bash
        run: |
          python <<'PY'
          import subprocess
          import sys

          allowed_prefixes = (
              "governance/artifacts/schwab_v4_register_build_meta.json",
              "governance/artifacts/schwab_v4_scoreboard.json",
              "governance/artifacts/perf_proof/",
          )
          proc = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          )
          changed = [ln.strip() for ln in proc.stdout.splitlines() if ln.strip()]
          unexpected = sorted(
              p
              for p in changed
              if not any(p == pref or p.startswith(pref) for pref in allowed_prefixes)
          )
          if unexpected:
              print("unexpected tracked file changes after reconciliation:", file=sys.stderr)
              for p in unexpected:
                  print(" ", p, file=sys.stderr)
              sys.exit(1)
          if changed:
              print("tracked reconciliation touch OK:", ", ".join(changed))
          else:
              print("no tracked file drift after reconciliation")
          PY

      - name: Verify register file, meta, and scoreboard register_build SHA256 alignment
        shell: bash
        run: |
          python <<'PY'
          import csv, hashlib, json, pathlib, sys

          reg = pathlib.Path("governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv")
          meta = json.loads(
              pathlib.Path("governance/artifacts/schwab_v4_register_build_meta.json").read_text(encoding="utf-8")
          )
          sb = json.loads(
              pathlib.Path("governance/artifacts/schwab_v4_scoreboard.json").read_text(encoding="utf-8")
          )
          h = hashlib.sha256(reg.read_bytes()).hexdigest()
          m_sha = meta.get("register_content_sha256")
          s_sha = (sb.get("register_build") or {}).get("register_content_sha256")
          if not (h == m_sha == s_sha):
              print("SHA256 misalignment register/meta/scoreboard", h, m_sha, s_sha, file=sys.stderr)
              sys.exit(1)
          rep = sum(
              1
              for r in csv.DictReader(reg.open(newline="", encoding="utf-8"))
              if (r.get("disposition") or "").strip() == "REPLACED"
          )
          rc = int((sb.get("d17") or {}).get("replaced_count", -1))
          if rc != rep:
              print("d17.replaced_count != CSV REPLACED row count", rc, rep, file=sys.stderr)
              sys.exit(1)
          print("triple SHA + replaced_count OK", h[:16], "replaced", rep)
          PY

      - name: Schwab V4 register O-XX validation
        shell: bash
        run: |
          python -m tools.schwab_oxx_validator \
            --register governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv \
            --operator-register governance/OPERATOR_DECISION_REGISTER.md

      - name: Schwab V4 closure metrics (non-zero exit if UNREVIEWED or bare GOVERNED_EXCEPTION)
        shell: bash
        run: |
          python -m tools.schwab_coverage_v4_metrics \
            --register governance/SCHWAB_UNIVERSAL_COVERAGE_REGISTER_V4.csv \
            --operator-register governance/OPERATOR_DECISION_REGISTER.md
