# EXTERNAL_STANDARDS_CONTROL_MAP_V1 — traceability map (operator-approved 2026-07-06).
# Maps SR 11-7 / NIST AI RMF / IOSCO / SEC market-access principles onto EXISTING
# repo controls. This file CITES enforcement; it does not create parallel process.
# Validated by tools/check_lane_closure_scopes.py (cited paths must exist).
schema_version: external_standards_control_map_v1
controls:
  - id: CTL-1_LANE_SCOPE_SCHEMA
    purpose: Machine-readable closure scopes (layers x tickers x horizons x environment + caveats + parent)
    standards: [SR11-7 governance, NIST accountable/transparent]
    repo_controls:
      - governance/artifacts/lane_closure_register_v1.json
      - tools/check_lane_closure_scopes.py
      - tests/test_lane_closure_scopes.py
  - id: CTL-2_PARENT_LANE_LOCK
    purpose: Scoped/caveated/research evidence structurally cannot close full-stack/universal/all-horizon/production parents
    standards: [SR11-7 validation scope, IOSCO segregated testing, operator full-stack rule]
    repo_controls:
      - tools/check_lane_closure_scopes.py::check_register
      - tools/enforce_all_rules.py
  - id: CTL-3_STACK_ACCOUNTING
    purpose: Layer/ticker/horizon authorities derived from code; drift fails loudly
    standards: [SR11-7 model inventory, NIST valid/reliable]
    repo_controls:
      - governed_stack_contract.py
      - ml_horizon.py
      - tools/check_lane_closure_scopes.py::check_horizon_authority_consistency
      - tools/check_ablation_pipeline_parity.py
  - id: CTL-4_VALIDATION_AND_TESTING
    purpose: Component validation + adversarial + governance test surface on every push
    standards: [SR11-7 validation, IOSCO robust testing]
    repo_controls:
      - .github/workflows/pytest.yml
      - .github/workflows/objective-audit.yml
      - .github/workflows/hardening.yml
      - tests/test_bayesian_fusion_numeric_contract_v1.py
      - tests/test_multi_horizon_decision_numeric_contract_v1.py
  - id: CTL-5_DATA_QUALITY_AND_LABEL_TRUTH
    purpose: Bar/label/snapshot integrity, dedup throttle, recompute parity, fingerprints
    standards: [IOSCO data quality, SR11-7 conceptual soundness]
    repo_controls:
      - db_health_audit.py
      - tools/verify_db_coverage.py
      - tools/verify_horizon_health.py
      - tests/test_card_wiring_transport_locks.py
      - normalized_training_sync.py
  - id: CTL-6_LEAKAGE_AND_PARITY
    purpose: Lookahead/leakage protection and train-live parity
    standards: [SR11-7 soundness, NIST valid/reliable]
    repo_controls:
      - tests/test_feature_leakage_similarity_as_of.py
      - tools/check_ablation_pipeline_parity.py
      - tools/check_encoder_cone_tests.py
  - id: CTL-7_RESEARCH_LIVE_ISOLATION
    purpose: Research runs cannot touch production DB/labels/model tree
    standards: [IOSCO segregated testing]
    repo_controls:
      - tools/research/d2_run_dual_label_matrix.py
      - tests/test_issue14_horizon_training_eligibility.py
  - id: CTL-8_MONITORING_OUTCOMES
    purpose: RTH-scoped accuracy vs baseline, calibration no-harm gate, drift checks
    standards: [SR11-7 ongoing monitoring + outcomes analysis, IOSCO continuous monitoring]
    repo_controls:
      - calibration/fusion_temperature.py
      - tools/check_universality_drift_closure.py
      - tests/test_model_accuracy_wire.py
  - id: CTL-9_EXPLAINABILITY_AUDITABILITY
    purpose: Provenance stamps, decision reconstruction, similarity traces
    standards: [NIST explainable, SR11-7 documentation]
    repo_controls:
      - multi_horizon_ml_bundle.py
      - tests/decision_reconstruction
      - verification/decision_explain.py
  - id: CTL-10_FAIL_CLOSED_KILL_CONTROLS
    purpose: WAIT/NO_TRADE posture, promotion gates, fail-closed serving, guest NO_TRADE
    standards: [IOSCO kill switch/control framework, NIST safe]
    repo_controls:
      - governed_stack_contract.py
      - tests/test_fusion_temperature_calibration.py
      - tools/run_phase10_reliability_enforcement_v1.py
  - id: CTL-11_CHANGE_CONTROL_EVIDENCE
    purpose: Fix+test same commit, unverified-claim cites, upfront/stop gates, branch protection
    standards: [SR11-7 policies/controls, SEC documented controls + review + remediation]
    repo_controls:
      - tools/enforce_all_rules.py
      - tools/check_fix_everything_we_touch.py
      - tools/check_branch_protection_proof.py
      - tools/check_required_status_checks.py
