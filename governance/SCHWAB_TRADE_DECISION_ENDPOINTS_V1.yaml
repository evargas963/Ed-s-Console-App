# Program: Schwab Coverage Proof Program (ENGINEERING_GATEKEEPING_POLICY § Active Status)
#
# trace_root: if true, backward dependency closure (call graph → field inventory)
#   MUST include all reachable callees until primitives / library boundary per tool contract.
# If false, node is documented for lineage labeling only (invoked only under a trace_root).
#
# qualified_name: importable "module.submodule:attr" style used by the dependency tool
#   (exact format TBD in tools/schwab_decision_dependency_inventory_v1.py — align when tool lands).

program: schwab_coverage_proof
artifact_id: SCHWAB_TRADE_DECISION_ENDPOINTS_V1
version: 1
status: DRAFT_OPERATOR_REVIEW

schema_note: |
  This list seeds static call-graph backward traces. Missing endpoints = missed lineage.
  Operator verifies: (1) every live/API path that emits trade-visible state is covered;
  (2) no duplicate roots for the same closure unless intentionally disjoint stacks;
  (3) calibration / replay-only paths explicitly IN or OUT of scope.

operator_review:
  - Confirm each trace_root is still the real entry symbol (renames/refactors).
  - Confirm server.py / live_market_plane paths eventually reach these roots.
  - Add any alternate entry (e.g. replay harness) if it can emit user-visible decisions.

endpoints:
  - id: TDE-001
    qualified_name: call_engine.compute_call
    trace_root: true
    role: call_card
    summary: >
      The Call — stack order 8–10; consumes fusion, rules, pred, vol_regime, canonical;
      invokes validation and sizing.
    primary_files:
      - call_engine.py

  - id: TDE-002
    qualified_name: signals.compute_signals
    trace_root: true
    role: signal_stack
    summary: >
      Required stack order 1–7+ orchestration; market data through Bayesian fusion into
      decision path; canonical snapshot via inference_snapshot.
    primary_files:
      - signals.py

  - id: TDE-003
    qualified_name: market_state.build_market_state
    trace_root: true
    role: market_state_bundle
    summary: >
      Assembles MarketState / server-visible bundle; invokes signal stack and OE recommendation
      paths per server wiring.
    primary_files:
      - market_state.py

  - id: TDE-004
    qualified_name: market_state.recommend_option_expression
    trace_root: true
    role: option_expression
    summary: >
      Option expression (strike/side) recommendation and chain-row proof payload.
    primary_files:
      - market_state.py

  - id: TDE-005
    qualified_name: v2_decision.a2_option_expression.build_a2_option_expression
    trace_root: true
    role: a2_v2_adapter
    summary: >
      Live v2 A2 option expression adapter from market_state + A1 decision dict.
    primary_files:
      - v2_decision/a2_option_expression.py

  - id: TDE-006
    qualified_name: call_engine._validate_trade
    trace_root: false
    role: validation_gate
    parent_trace: call_engine.compute_call
    summary: >
      Structure / probability / risk gates inside The Call; closure expected under TDE-001.

  - id: TDE-007
    qualified_name: call_engine.compute_position_size
    trace_root: false
    role: position_sizing
    parent_trace: call_engine.compute_call
    summary: >
      Execution sizing tier; closure expected under TDE-001.

  - id: TDE-008
    qualified_name: bayesian_fusion.fuse
    trace_root: true
    role: bayesian_fusion
    summary: >
      Bayesian fusion of model + rules evidence; explicit root so fusion math lineage is not
      skipped if static analysis misses edges from signals.
    primary_files:
      - bayesian_fusion.py

  - id: TDE-009
    qualified_name: prediction_engine.compute_prediction
    trace_root: true
    role: prediction_core
    summary: >
      Core prediction / enrichment path used by stack and downstream consumers.
    primary_files:
      - prediction_engine.py

  - id: TDE-010
    qualified_name: prediction_engine.build_fusion_model_overlay_for_stack
    trace_root: true
    role: fusion_model_overlay
    summary: >
      Shared per-tick fusion overlay built inside compute_signals; explicit root for overlay lineage.
    primary_files:
      - prediction_engine.py

  - id: TDE-011
    qualified_name: ml_predict.get_model_outputs_for_fusion
    trace_root: true
    role: ml_model_bundle
    summary: >
      ML model outputs fed into fusion stack; use if this is the narrowest stable API surface
      (operator may collapse to run_base_models_once if graph demands).
    primary_files:
      - ml_predict.py

  - id: TDE-012
    qualified_name: monte_carlo.simulate
    trace_root: true
    role: monte_carlo
    summary: >
      MC path feeding fusion / stack health; explicit root for sigma / path simulations.
    primary_files:
      - monte_carlo.py

  - id: TDE-013
    qualified_name: mc_fusion_adjustment.fuse_payload_apply_mc_adjustment
    trace_root: true
    role: mc_post_fusion_adjustment
    summary: >
      Post-fusion MC probability adjustment; market-data-sensitive provenance.
    primary_files:
      - mc_fusion_adjustment.py

  - id: TDE-014
    qualified_name: governed_stack_contract.classify_stack_health
    trace_root: true
    role: stack_health_gate
    summary: >
      Governed stack health / fail-closed gating for horizon and MC inputs.
    primary_files:
      - governed_stack_contract.py

  - id: TDE-015
    qualified_name: features.inference_snapshot.build_inference_snapshot_v1_from_signal_input
    trace_root: true
    role: inference_snapshot
    summary: >
      Canonical InferenceSnapshotV1 construction — upstream of vol/regime/ML/fusion consumers.
    primary_files:
      - features/inference_snapshot.py

  - id: TDE-016
    qualified_name: calibration.writer.append_calibration_decision
    trace_root: true
    role: calibration_persist
    summary: >
      Persists live advisory / calibration rows to production DB; include if program scope covers
      persisted decision artifacts (operator: IN vs OUT).
    primary_files:
      - calibration/writer.py

notes: |
  Rules / regime helpers (e.g. signals.compute_rules, signals.classify_regime,
  signals.classify_volatility_regime) are expected to appear as callees under TDE-002/TDE-003,
  not as separate trace roots, unless operator finds a second entry path.
  Server route handlers are intentionally omitted here: they should resolve to these roots.
