[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "venv", "node_modules", "__pycache__"]

[tool.ruff.lint]
#: unused imports, undefined names, and every error CPython's compiler raises (syntax, F7, PLE0118, PLE1142)
select = ["F401", "F821", "E9", "F7", "PLE0118", "PLE1142"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
omit = ["tests/*", "*/node_modules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["node_modules", ".venv"]
