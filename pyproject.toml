[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "venv", "node_modules", "__pycache__"]

[tool.ruff.lint]
#: the commit hook's and the hardening job's one selection; CI's compileall step is what proves every file compiles
select = ["F401", "F821", "E9", "E402", "E501", "E741", "I", "UP", "W", "S110"]
#: UP042 (str + Enum to StrEnum): its one fix is ruff-labelled unsafe, and no unsafe fix is taken
#: (operator, AGENTS.md "Fix what you find")
ignore = ["UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
omit = ["tests/*", "*/node_modules/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["node_modules", ".venv"]
