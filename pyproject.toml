[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "venv", "node_modules", "__pycache__"]

[tool.ruff.lint]
#: the commit hook's and the hardening job's one selection; CI's compileall step is what proves every file compiles
select = [
  "F401",
  "F821",
  "E",
  "B",
  "I",
  "SIM107",
  "SIM113",
  "SIM114",
  "SIM116",
  "SIM117",
  "SIM118",
  "SIM208",
  "SIM300",
  "SIM905",
  "SIM910",
  "SIM911",
  "UP",
  "W",
  "S110",
  "BLE",
  "TID251",
]
#: UP042 (str + Enum to StrEnum), E711 and E712 (== None, == True), E731 (a lambda assigned to a
#: name), B004, B006, B007, B011, B028, B905 and B912: the one fix of each is ruff-labelled unsafe,
#: and no unsafe fix is taken (operator, AGENTS.md "Fix what you find")
ignore = [
  "UP042",
  "E711",
  "E712",
  "E731",
  "B004",
  "B006",
  "B007",
  "B011",
  "B028",
  "B905",
  "B912",
]

#: One clock, repo wide (operator 2026-11-05: "fix the fucking clock ... REPO WIDE NO
#: EXCEPTIONS"): the computer's clock is read in one place, time_et.py (time_et.now, the time of
#: day; time_et.elapsed, the one stopwatch), and everything else takes it from there
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "One clock: time_et.now()."
"time.time_ns".msg = "One clock: time_et.now()."
"time.monotonic".msg = "One clock: time_et.elapsed()."
"time.monotonic_ns".msg = "One clock: time_et.elapsed()."
"time.perf_counter".msg = "One clock: time_et.elapsed()."
"time.perf_counter_ns".msg = "One clock: time_et.elapsed()."
"time.process_time".msg = "One clock: time_et.elapsed()."
"time.localtime".msg = "One clock: time_et.now()."
"time.gmtime".msg = "One clock: time_et.now()."
"time.ctime".msg = "One clock: time_et.now()."
"datetime.datetime.now".msg = "One clock: time_et.now()."
"datetime.datetime.today".msg = "One clock: time_et.now()."
"datetime.datetime.utcnow".msg = "One clock: time_et.now()."
"datetime.date.today".msg = "One clock: time_et.now()."
"datetime.time".msg = "No clock time is typed: the market's sessions are Schwab's /markets answers (AGENTS.md rule 8)."

[tool.ruff.lint.per-file-ignores]
#: the one producer of the time
"time_et.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
relative_files = true
source = ["."]
omit = ["tests/*", "*/node_modules/*", "*/pytest-of-*/*"]

# AGENTS.md rule 12: a value that crosses a module boundary is a typed record, held by pyright's
# strict mode
[tool.pyright]
pythonVersion = "3.13"
# every product module; schwab-py ships no types, so Feed's calls into it read typings/schwab
include = ["."]
exclude = [
  "tests",
  "tools",
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["node_modules", ".venv"]
markers = [
  "alone: a limit on the wall clock, which CI runs with no test workers beside it",
  "rail: guards production or the credentials rather than an app value (tools/check_tests_serve_app.py)",
]

# Mutation testing (mutmut, https://github.com/boxed/mutmut): how many deliberate mistakes in the
# code the tests catch. Run by .github/workflows/mutation.yml on Linux (mutmut needs fork). The
# code it mutates; everything else the tests read is copied beside it.
[tool.mutmut]
source_paths = ["calc/"]
also_copy = [
  "app/",
  "calibration/",
  "docs/",
  "feed/",
  "push/",
  "state/",
  "static/",
  "tests/",
  "tools/",
  "typings/",
  "config.py",
  "db.py",
  "db_authority.py",
  "instrument_identity.py",
  "json_blob_codec.py",
  "launch.py",
  "live_market_plane.py",
  "live_price_rows.py",
  "numeric_contract.py",
  "open_gap.py",
  "option_contract.py",
  "runtime_layout.py",
  "server.py",
  "stream_spine.py",
  "time_et.py",
  "AGENTS.md",
  "ACTIVE_PROGRAM.md",
  "CLAUDE.md",
  "locks.imports.toml",
  "locks.ruff.toml",
  "requirements.txt",
  "requirements-dev.txt",
]
# every test of the app; the tests of the check tools and guards (tools/) reach no line of it
pytest_add_cli_args_test_selection = [
  "tests/",
  "--ignore=tests/e2e",
  "--ignore-glob=tests/test_check_*",
  "--ignore-glob=tests/test_census_*",
  "--ignore-glob=tests/test_operator_*",
  "--ignore-glob=tests/test_operating_process_lock_*",
  "--ignore-glob=tests/test_hook_chain_*",
  "--ignore-glob=tests/test_keep_going_*",
  "--ignore-glob=tests/test_wiring_rules_*",
  "--ignore-glob=tests/test_reset_guard_*",
  "--ignore-glob=tests/test_protected_paths_*",
  "--ignore-glob=tests/test_guards_read_*",
  "--ignore-glob=tests/test_shell_reader_*",
  "--ignore-glob=tests/test_bootstrap_worktree_venv_*",
  "--ignore-glob=tests/test_runtime_governance_decoupling_*",
  "--ignore-glob=tests/test_schwab_field_inventory_*",
  # the import contracts read the source's imports, which mutmut's instrumented copy adds to
  "--ignore-glob=tests/test_data_path_only_feed_*",
  "-m",
  "not alone and not rail",
]
