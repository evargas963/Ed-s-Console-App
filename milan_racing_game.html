<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MILAN'S TURBO RACER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;justify-content:center;align-items:center;overflow:hidden;touch-action:none}
canvas{display:block;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════
//   MILAN'S TURBO RACER  ·  Arcade Edition
// ═══════════════════════════════════════════════════════════
const C = document.getElementById('c');
const X = C.getContext('2d');
const DPR = Math.min(window.devicePixelRatio||1, 2);
const LW = 480, LH = 760;           // logical canvas size
C.width  = LW * DPR;
C.height = LH * DPR;
X.scale(DPR, DPR);

function fitCanvas(){
  const s = Math.min(innerWidth/LW, innerHeight/LH);
  C.style.width  = Math.floor(LW*s)+'px';
  C.style.height = Math.floor(LH*s)+'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ── roundRect polyfill ────────────────────────────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    this.beginPath();
    this.moveTo(x+r,y);
    this.lineTo(x+w-r,y); this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r); this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h); this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r); this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();
  };
}

// ── AUDIO ─────────────────────────────────────────────────
let AC=null, engNode=null, engGain=null, engFilter=null;
function ensureAudio(){
  if(AC) return;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function tone(f,type,dur,vol=0.3,fEnd=null){
  if(!AC) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=type; o.frequency.setValueAtTime(f,AC.currentTime);
  if(fEnd) o.frequency.linearRampToValueAtTime(fEnd,AC.currentTime+dur);
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.start(); o.stop(AC.currentTime+dur);
}
function noise(dur,vol=0.5,fc=600){
  if(!AC) return;
  const n=AC.sampleRate*dur;
  const buf=AC.createBuffer(1,n,AC.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc; f.Q.value=1;
  const g=AC.createGain();
  s.connect(f); f.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  s.start(); s.stop(AC.currentTime+dur);
}
function sfxCrash(){ noise(0.35,1.0,400); tone(90,'sawtooth',0.4,0.5); }
function sfxCoin(){
  tone(880,'sine',0.08,0.25);
  setTimeout(()=>tone(1320,'sine',0.1,0.2),70);
  setTimeout(()=>tone(1760,'sine',0.12,0.15),140);
}
function sfxBoostPick(){ tone(440,'square',0.05,0.2); tone(880,'square',0.05,0.15); }
function sfxBoostUse(){ tone(200,'sawtooth',0.3,0.3,1200); }
function sfxLevelUp(){
  [523,659,784,880,1047].forEach((f,i)=>setTimeout(()=>tone(f,'square',0.15,0.2),i*80));
}
function sfxGameOver(){
  [400,320,240,160,100].forEach((f,i)=>setTimeout(()=>tone(f,'sawtooth',0.25,0.35),i*180));
}
function startEngineSound(){
  if(!AC||engNode) return;
  engNode=AC.createOscillator(); engGain=AC.createGain();
  engFilter=AC.createBiquadFilter(); engFilter.type='lowpass'; engFilter.frequency.value=350;
  engNode.type='sawtooth'; engNode.frequency.value=65;
  engNode.connect(engFilter); engFilter.connect(engGain); engGain.connect(AC.destination);
  engGain.gain.value=0.06; engNode.start();
}
function setEngineThrottle(t){ // t 0..1
  if(!engNode) return;
  engNode.frequency.value = 65+t*100;
  engGain.gain.value = 0.04+t*0.10;
}
function stopEngineSound(){
  if(!engNode) return;
  engGain.gain.setValueAtTime(engGain.gain.value,AC.currentTime);
  engGain.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.4);
  engNode.stop(AC.currentTime+0.4);
  engNode=null; engGain=null; engFilter=null;
}

// Chiptune music ──────────────────────────────────────────
let musicTimer=null;
const melody=[
  [523,0.2],[523,0.1],[659,0.3],[784,0.3],[523,0.2],[440,0.2],[494,0.4],
  [523,0.2],[523,0.1],[659,0.3],[880,0.3],[784,0.2],[659,0.5],
  [698,0.2],[784,0.2],[880,0.3],[784,0.2],[659,0.2],[523,0.2],[440,0.4],
  [523,0.2],[659,0.2],[784,0.3],[880,0.3],[1047,0.5],[880,0.5],
];
let melI=0;
function playMelNote(){
  if(!AC||!musicPlaying) return;
  const [f,dur]=melody[melI%melody.length]; melI++;
  tone(f,'square',dur*0.7,0.06);
  musicTimer=setTimeout(playMelNote,dur*1000);
}
let musicPlaying=false;
function startMusic(){ if(musicPlaying||!AC) return; musicPlaying=true; melI=0; playMelNote(); }
function stopMusic(){ musicPlaying=false; clearTimeout(musicTimer); }

// ── ROAD CONSTANTS ────────────────────────────────────────
const N_LANES = 5;
const RL = 55, RR = 425;         // road left/right x
const RW = RR - RL;
const LW2 = RW / N_LANES;        // lane width
const laneCenter = l => RL + LW2*(l+0.5);

// ── STATE MACHINE ─────────────────────────────────────────
const S={TITLE:0,PLAY:1,OVER:2,PAUSE:3};
let gs=S.TITLE;

// ── GAME VARIABLES ───────────────────────────────────────
let score,hiScore,lives,level,dist,spd,maxSpd;
let boostStock,boostActive,boostT,invT,shakeT,shakeAmt;
let combo,comboT;
let animT=0;                      // title/over animation timer
let player;
let traffic,coins,boostPads,particles,popups;
let roadOff=0;
const STRIPE=55;

try{ hiScore=parseInt(localStorage.getItem('milanHi2')||'0'); }catch(e){ hiScore=0; }

// ── INIT ──────────────────────────────────────────────────
function initGame(){
  score=0; lives=3; level=1; dist=0;
  spd=3.5; maxSpd=7;
  boostStock=2; boostActive=false; boostT=0; invT=0;
  shakeT=0; shakeAmt=0;
  combo=1; comboT=0;
  player={
    lane:2, x:laneCenter(2), tx:laneCenter(2),
    y:LH-140, w:34, h:58,
    color:'#00eeff', accent:'#ffffff',
    trail:[],
  };
  traffic=[]; coins=[]; boostPads=[]; particles=[]; popups=[];
  // Initial population
  for(let i=0;i<5;i++) addTraffic(true);
  for(let i=0;i<4;i++) addCoin(true);
  addBoostPad(true);
  startEngineSound();
  startMusic();
}

// ── SPAWN ─────────────────────────────────────────────────
const CAR_COLORS=[
  ['#ff3333','#ff9999'],['#ff8800','#ffcc88'],['#44ff44','#aaffaa'],
  ['#ff44ff','#ffaaff'],['#4488ff','#aaccff'],['#ff8844','#ffccaa'],
  ['#ffffff','#cccccc'],['#ff0099','#ff88dd'],['#00ffcc','#88ffee'],
];
function addTraffic(init=false){
  const lane=Math.floor(Math.random()*N_LANES);
  const cc=CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)];
  traffic.push({
    lane, x:laneCenter(lane),
    y: init ? -50-Math.random()*(LH*0.8) : -70-Math.random()*120,
    w:30, h:52,
    color:cc[0], accent:cc[1],
    relSpd: spd*(0.15+Math.random()*0.4), // relative to player
  });
}
function addCoin(init=false){
  const lane=Math.floor(Math.random()*N_LANES);
  coins.push({
    lane, x:laneCenter(lane),
    y: init ? -30-Math.random()*(LH*0.8) : -30-Math.random()*100,
    r:13, ang:Math.random()*Math.PI*2,
  });
}
function addBoostPad(init=false){
  const lane=Math.floor(Math.random()*N_LANES);
  boostPads.push({
    lane, x:laneCenter(lane),
    y: init ? -50-Math.random()*(LH*0.5) : -50-Math.random()*150,
    w:30, h:44, ang:0,
  });
}

// ── INPUT ─────────────────────────────────────────────────
const keys={};
let tx0=0,ty0=0;

document.addEventListener('keydown',e=>{
  ensureAudio();
  if(!keys[e.code]){
    keys[e.code]=true;
    onKey(e.code);
  }
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup',e=>{ keys[e.code]=false; });

C.addEventListener('touchstart',e=>{
  ensureAudio();
  tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
  e.preventDefault();
},{passive:false});
C.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx0;
  const dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>25 && Math.abs(dx)>Math.abs(dy)){
    if(gs===S.PLAY){ moveLane(dx>0?1:-1); }
  } else if(Math.abs(dx)<20 && Math.abs(dy)<20){
    onTap();
  }
  e.preventDefault();
},{passive:false});

// Arrow button zones (bottom of screen)
C.addEventListener('click',e=>{
  ensureAudio();
  const r=C.getBoundingClientRect();
  const scale=LW/r.width;
  const cx=(e.clientX-r.left)*scale;
  const cy=(e.clientY-r.top)*scale*(LH/LW);
  // Ignore if touch (handled above)
  if(gs===S.PLAY && cy>LH-90){
    if(cx<LW/2) moveLane(-1); else moveLane(1);
  } else if(gs!==S.PLAY) onTap();
});

function onKey(c){
  if(gs===S.TITLE||gs===S.OVER){
    startGame(); return;
  }
  if(gs===S.PLAY){
    if(c==='ArrowLeft'||c==='KeyA') moveLane(-1);
    if(c==='ArrowRight'||c==='KeyD') moveLane(1);
    if(c==='Space'||c==='ArrowUp'||c==='KeyW') doBoost();
    if(c==='Escape'||c==='KeyP') togglePause();
  } else if(gs===S.PAUSE){
    if(c==='Escape'||c==='KeyP'||c==='Space') togglePause();
  }
}
function onTap(){
  if(gs===S.TITLE||gs===S.OVER) startGame();
  else if(gs===S.PLAY) doBoost();
  else if(gs===S.PAUSE) togglePause();
}
function moveLane(d){
  const nl=player.lane+d;
  if(nl<0||nl>=N_LANES) return;
  player.lane=nl; player.tx=laneCenter(nl);
}
function doBoost(){
  if(!boostStock||boostActive) return;
  boostStock--; boostActive=true; boostT=200;
  sfxBoostUse();
  burst(player.x,player.y+20,20,'#00ffff');
}
function togglePause(){
  if(gs===S.PLAY){ gs=S.PAUSE; stopEngineSound(); stopMusic(); }
  else if(gs===S.PAUSE){ gs=S.PLAY; startEngineSound(); startMusic(); }
}
function startGame(){
  initGame(); gs=S.PLAY;
}

// ── PARTICLES ─────────────────────────────────────────────
function burst(x,y,n,col){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:35,ml:35,r:2+Math.random()*5,col});
  }
}
function burstCoin(x,y){
  for(let i=0;i<10;i++){
    const a=(i/10)*Math.PI*2;
    particles.push({x,y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,
      life:28,ml:28,r:3+Math.random()*3,col:'#ffcc00'});
  }
}
function popup(x,y,txt,col='#ffff00'){
  popups.push({x,y:y-10,txt,col,life:70,ml:70});
}

// ── COLLISION (AABB center-based) ─────────────────────────
function hits(ax,ay,aw,ah,bx,by,bw,bh){
  return Math.abs(ax-bx)<(aw+bw)*0.42 && Math.abs(ay-by)<(ah+bh)*0.42;
}

// ── UPDATE ────────────────────────────────────────────────
let lastT=0;
function update(ts){
  const dt=Math.min((ts-lastT)/16.667,3); lastT=ts;
  if(gs!==S.PLAY) return;

  dist+=spd*dt;
  // Speed ramp
  const tgt=Math.min(3.5+level*1.4,16);
  spd+=(tgt-spd)*0.008*dt;

  // Level up
  if(dist>level*2000){
    level++;
    sfxLevelUp();
    shakeT=25; shakeAmt=10;
    popup(LW/2,LH/2-50,`LEVEL ${level}!`,'#00ffff');
    if(level%2===0) addTraffic();
  }

  // Countdown timers
  if(boostT>0){ boostT-=dt; if(boostT<=0){ boostActive=false; } }
  if(invT>0) invT-=dt;
  if(shakeT>0) shakeT-=dt;
  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=1; }

  // Player slide
  player.x += (player.tx-player.x)*0.22*dt;

  // Boost trail
  if(boostActive){
    player.trail.push({x:player.x,y:player.y,life:18});
  }
  player.trail=player.trail.filter(t=>--t.life>0);

  // Road scroll offset
  roadOff=(roadOff+spd*dt)%STRIPE;

  // Effective scroll speed for objects
  const effSpd = boostActive ? spd*1.85 : spd;

  // ── Traffic ──
  traffic.forEach(t=>{ t.y+=(effSpd-t.relSpd)*dt; });
  while(traffic.filter(t=>t.y<LH+80).length < 4+level){ addTraffic(); }
  traffic=traffic.filter(t=>t.y<LH+80);

  // ── Coins ──
  coins.forEach(c=>{ c.y+=effSpd*dt; c.ang+=0.05*dt; });
  while(coins.filter(c=>c.y<LH+40).length < 3+Math.floor(level*0.7)){ addCoin(); }
  coins=coins.filter(c=>c.y<LH+40);

  // ── Boost pads ──
  boostPads.forEach(b=>{ b.y+=effSpd*dt; b.ang+=0.08*dt; });
  while(boostPads.filter(b=>b.y<LH+60).length < 1){ addBoostPad(); }
  boostPads=boostPads.filter(b=>b.y<LH+60);

  // ── Particles ──
  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.2*dt; p.life-=dt; });
  particles=particles.filter(p=>p.life>0);

  // ── Popups ──
  popups.forEach(p=>{ p.y-=1.2*dt; p.life-=dt; });
  popups=popups.filter(p=>p.life>0);

  // ── Collision: traffic ──
  if(invT<=0){
    for(const t of traffic){
      if(hits(player.x,player.y,player.w,player.h,t.x,t.y,t.w,t.h)){
        sfxCrash();
        burst(player.x,player.y,30,'#ff4400');
        burst(t.x,t.y,20,'#ffaa00');
        shakeT=40; shakeAmt=16;
        invT=150;
        combo=1; comboT=0;
        lives--;
        t.y+=100; // push away
        if(lives<=0){
          stopEngineSound(); stopMusic(); sfxGameOver();
          try{ if(score>hiScore){ hiScore=Math.floor(score); localStorage.setItem('milanHi2',hiScore); }}catch(e){}
          gs=S.OVER;
        }
        break;
      }
    }
  }

  // ── Collision: coins ──
  coins=coins.filter(c=>{
    if(hits(player.x,player.y,player.w,player.h,c.x,c.y,c.r*2,c.r*2)){
      sfxCoin(); burstCoin(c.x,c.y);
      const pts=10*combo;
      score+=pts;
      popup(c.x,c.y,`+${pts}`,combo>1?'#ff8800':'#ffff00');
      combo=Math.min(combo+1,8); comboT=100;
      return false;
    }
    return true;
  });

  // ── Collision: boost pads ──
  boostPads=boostPads.filter(b=>{
    if(hits(player.x,player.y,player.w,player.h,b.x,b.y,b.w,b.h)){
      if(boostStock<3) boostStock++;
      sfxBoostPick();
      burst(b.x,b.y,15,'#00ffff');
      popup(b.x,b.y,'BOOST!','#00ffff');
      return false;
    }
    return true;
  });

  // Distance score
  score+=0.04*dt*level;

  // Engine sound
  setEngineThrottle(Math.min(spd/16,1));
}

// ── DRAW HELPERS ──────────────────────────────────────────
function fillRR(x,y,w,h,r,style){
  X.fillStyle=style; X.beginPath(); X.roundRect(x,y,w,h,r); X.fill();
}
function hexPath(cx,cy,r){
  X.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2-Math.PI/6;
    i===0?X.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)
         :X.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  }
  X.closePath();
}

// ── DRAW ROAD ─────────────────────────────────────────────
function drawRoad(){
  // Sky
  const sky=X.createLinearGradient(0,0,0,LH);
  sky.addColorStop(0,'#020008');
  sky.addColorStop(1,'#0e0025');
  X.fillStyle=sky; X.fillRect(0,0,LW,LH);

  // Side gutters
  const gl=X.createLinearGradient(0,0,RL,0);
  gl.addColorStop(0,'#030008'); gl.addColorStop(1,'#180038');
  X.fillStyle=gl; X.fillRect(0,0,RL,LH);
  const gr=X.createLinearGradient(RR,0,LW,0);
  gr.addColorStop(0,'#180038'); gr.addColorStop(1,'#030008');
  X.fillStyle=gr; X.fillRect(RR,0,LW-RR,LH);

  // Road tarmac
  const road=X.createLinearGradient(RL,0,RR,0);
  road.addColorStop(0,'#14142a'); road.addColorStop(0.5,'#1e1e38'); road.addColorStop(1,'#14142a');
  X.fillStyle=road; X.fillRect(RL,0,RW,LH);

  // Kerb stripes (alternating red/white)
  const KW=6;
  for(let y=-STRIPE+roadOff;y<LH+STRIPE;y+=STRIPE){
    X.fillStyle=((Math.floor(y/STRIPE)%2)===0)?'#cc0000':'#ffffff';
    X.fillRect(RL-KW,y,KW,STRIPE);
    X.fillRect(RR,y,KW,STRIPE);
  }

  // Road edge neon glow lines
  X.save();
  X.strokeStyle='#ff00ff'; X.lineWidth=2.5;
  X.shadowColor='#ff00ff'; X.shadowBlur=14;
  X.beginPath(); X.moveTo(RL,0); X.lineTo(RL,LH); X.stroke();
  X.beginPath(); X.moveTo(RR,0); X.lineTo(RR,LH); X.stroke();
  X.restore();

  // Lane dashes
  X.save();
  X.strokeStyle='rgba(255,255,120,0.28)'; X.lineWidth=2;
  X.setLineDash([28,28]); X.lineDashOffset=-roadOff;
  for(let i=1;i<N_LANES;i++){
    const lx=RL+LW2*i;
    X.beginPath(); X.moveTo(lx,0); X.lineTo(lx,LH); X.stroke();
  }
  X.setLineDash([]);
  X.restore();

  // Center neon glow strip (subtle)
  X.save();
  X.strokeStyle='rgba(0,255,255,0.07)'; X.lineWidth=2;
  X.beginPath(); X.moveTo(LW/2,0); X.lineTo(LW/2,LH); X.stroke();
  X.restore();
}

// ── DRAW SCENERY ──────────────────────────────────────────
// Pre-seeded scenery rows
const SCEN=[];
for(let i=0;i<22;i++){
  SCEN.push({
    y:i*90-300,
    side:i%2,
    kind:i%3,
    x:(i%2===0)?5+((i*37)%38):RR+8+((i*41)%36),
    phase:i*0.8,
  });
}
function scrollScenery(){
  SCEN.forEach(s=>{
    s.y+=spd*(boostActive?1.85:1)*0.5; // slightly slower for parallax
    if(s.y>LH+100){
      s.y=-100-Math.random()*80;
      s.kind=Math.floor(Math.random()*3);
      s.x=s.side===0?5+Math.random()*38:RR+8+Math.random()*36;
    }
  });
}
function drawScenery(){
  SCEN.forEach(s=>{
    X.save(); X.translate(s.x,s.y);
    if(s.kind===0) drawTree();
    else if(s.kind===1) drawPillar(s.phase);
    else drawBarrel(s.phase);
    X.restore();
  });
}
function drawTree(){
  X.fillStyle='#2a1500';
  X.fillRect(-3,-2,6,22);
  [[0,0,16],[0,-13,12],[0,-24,8]].forEach(([ox,oy,r])=>{
    X.beginPath(); X.arc(ox,oy,r,0,Math.PI*2);
    X.fillStyle='#0a3a0a'; X.fill();
    X.strokeStyle='#0f5a0f'; X.lineWidth=1; X.stroke();
  });
}
function drawPillar(ph){
  const glow=(Math.sin(ph+performance.now()*0.003)+1)/2;
  X.save();
  X.shadowColor=`hsl(${200+glow*40},100%,60%)`; X.shadowBlur=8+glow*6;
  X.fillStyle='#333355'; X.fillRect(-5,-30,10,50);
  X.fillStyle=`hsl(${200+glow*40},100%,${50+glow*20}%)`;
  X.beginPath(); X.arc(0,-32,6,0,Math.PI*2); X.fill();
  X.restore();
}
function drawBarrel(ph){
  const c=(Math.sin(ph+performance.now()*0.002)+1)/2;
  fillRR(-9,-10,18,18,3,`hsl(${c*30},90%,40%)`);
  X.fillStyle='#888'; X.fillRect(-9,-3,18,3);
}

// ── DRAW CAR ──────────────────────────────────────────────
function drawCar(x,y,w,h,col,acc,isPlayer,boosting,invT,fr){
  if(invT>0 && Math.floor(fr/5)%2===0) return;
  X.save(); X.translate(x,y);

  const hw=w/2,hh=h/2;

  // Boost glow aura
  if(boosting){
    X.save();
    X.shadowColor='#00ffff'; X.shadowBlur=30;
    X.globalAlpha=0.5;
    X.beginPath(); X.ellipse(0,0,hw+8,hh+12,0,0,Math.PI*2);
    const eg=X.createRadialGradient(0,0,4,0,0,hw+8);
    eg.addColorStop(0,'rgba(0,255,255,0.6)');
    eg.addColorStop(1,'rgba(0,100,200,0)');
    X.fillStyle=eg; X.fill();
    X.restore();
  }

  // Shadow
  X.save(); X.globalAlpha=0.3;
  X.fillStyle='#000';
  X.beginPath(); X.ellipse(4,hh+4,hw*0.8,6,0,0,Math.PI*2);
  X.fill(); X.restore();

  // Body
  const bg=X.createLinearGradient(-hw,-hh,hw,-hh);
  bg.addColorStop(0,darken(col,40)); bg.addColorStop(0.35,col);
  bg.addColorStop(0.65,lighten(col,25)); bg.addColorStop(1,darken(col,25));
  X.shadowColor=col; X.shadowBlur=boosting?14:4;
  fillRR(-hw,-hh,w,h,6,bg);
  X.shadowBlur=0;

  // Roof
  fillRR(-hw+5,-hh+h*0.32,w-10,h*0.28,4,darken(col,20));

  // Windshield
  X.fillStyle=isPlayer?'rgba(120,230,255,0.75)':'rgba(90,130,220,0.65)';
  X.beginPath(); X.roundRect(-hw+4,-hh+3,w-8,h*0.26,3); X.fill();

  // Rear window
  X.fillStyle='rgba(60,80,160,0.6)';
  X.beginPath(); X.roundRect(-hw+5,hh-h*0.28,w-10,h*0.2,3); X.fill();

  // Wheels (4 corners)
  const wPos=[[-hw-3,-hh+8],[hw-4,-hh+8],[-hw-3,hh-18],[hw-4,hh-18]];
  wPos.forEach(([wx,wy])=>{
    X.fillStyle='#111'; X.fillRect(wx,wy,7,10);
    X.fillStyle='#555'; X.beginPath(); X.arc(wx+3.5,wy+5,2.5,0,Math.PI*2); X.fill();
  });

  // Headlights
  if(isPlayer){
    X.shadowColor='#ffffcc'; X.shadowBlur=12;
    X.fillStyle='#ffffcc'; X.fillRect(-hw+3,-hh+1,8,4); X.fillRect(hw-11,-hh+1,8,4);
  }
  // Taillights (bottom = facing us for traffic, back for player)
  X.shadowColor='#ff2200'; X.shadowBlur=10;
  X.fillStyle='#ff2200'; X.fillRect(-hw+3,hh-5,8,4); X.fillRect(hw-11,hh-5,8,4);

  // Player accent stripe
  if(isPlayer){
    X.shadowColor=acc; X.shadowBlur=6;
    X.fillStyle=acc; X.fillRect(-3,-hh+3,6,h*0.38);
  }

  X.shadowBlur=0;
  X.restore();
}

// ── DRAW COIN ─────────────────────────────────────────────
function drawCoin(c){
  const sx=Math.cos(c.ang);
  X.save(); X.translate(c.x,c.y); X.scale(sx,1);
  X.shadowColor='#ffcc00'; X.shadowBlur=18;
  X.beginPath(); X.arc(0,0,c.r,0,Math.PI*2);
  const cg=X.createRadialGradient(-3,-3,2,0,0,c.r);
  cg.addColorStop(0,'#ffee66'); cg.addColorStop(0.7,'#ffcc00'); cg.addColorStop(1,'#cc8800');
  X.fillStyle=cg; X.fill();
  X.fillStyle='rgba(255,255,200,0.5)'; X.beginPath(); X.arc(-3,-3,c.r*0.4,0,Math.PI*2); X.fill();
  X.shadowBlur=0; X.fillStyle='#886600';
  X.font=`bold ${c.r*1.1}px Arial`; X.textAlign='center'; X.textBaseline='middle';
  X.fillText('$',0,1);
  X.restore();
}

// ── DRAW BOOST PAD ────────────────────────────────────────
function drawBoostPad(b){
  const pulse=(Math.sin(b.ang)*0.2+0.8);
  X.save(); X.translate(b.x,b.y);
  X.shadowColor='#00ffff'; X.shadowBlur=18*pulse;
  hexPath(0,0,18*pulse);
  const bg=X.createRadialGradient(0,0,0,0,0,18);
  bg.addColorStop(0,'rgba(0,255,255,0.9)'); bg.addColorStop(1,'rgba(0,60,160,0.2)');
  X.fillStyle=bg; X.fill();
  X.strokeStyle='#00ffff'; X.lineWidth=2; X.stroke();
  X.shadowBlur=0; X.fillStyle='#fff';
  X.font='bold 18px Arial'; X.textAlign='center'; X.textBaseline='middle';
  X.fillText('⚡',0,1);
  X.restore();
}

// ── DRAW HUD ──────────────────────────────────────────────
let frame=0;
function drawHUD(){
  // Score
  X.save();
  X.shadowColor='#00ffff'; X.shadowBlur=12;
  X.fillStyle='#00ffff'; X.font='bold 28px Arial Black,Arial';
  X.textAlign='left'; X.fillText(Math.floor(score).toString(),8,34);
  // Hi
  X.fillStyle='#ff88ff'; X.shadowColor='#ff88ff'; X.shadowBlur=6;
  X.font='bold 14px Arial'; X.fillText(`BEST ${Math.max(Math.floor(score),hiScore)}`,8,54);

  // Level badge
  X.textAlign='center';
  X.fillStyle='#ffff00'; X.shadowColor='#ffff00'; X.shadowBlur=10;
  X.font='bold 18px Arial Black,Arial';
  X.fillText(`LV.${level}`,LW/2,28);

  // Lives (hearts top right)
  X.shadowBlur=0; X.font='22px Arial'; X.textAlign='right';
  for(let i=0;i<3;i++){
    X.globalAlpha=i<lives?1.0:0.18;
    X.fillText('❤️',LW-6-i*30,32);
  }
  X.globalAlpha=1;

  // Boost icons
  X.font='20px Arial';
  for(let i=0;i<3;i++){
    X.globalAlpha=i<boostStock?1.0:0.18;
    X.fillText('⚡',LW-6-i*24,58);
  }
  X.globalAlpha=1;

  // Combo
  if(combo>1){
    const ca=Math.min(comboT/40,1);
    X.globalAlpha=ca;
    X.fillStyle='#ff8800'; X.shadowColor='#ff8800'; X.shadowBlur=14;
    X.font='bold 22px Arial Black,Arial'; X.textAlign='center';
    X.fillText(`×${combo} COMBO!`,LW/2,58);
    X.globalAlpha=1;
  }

  // Boost active bar
  if(boostActive){
    const pct=boostT/200;
    X.shadowColor='#00ffff'; X.shadowBlur=8;
    X.fillStyle='#003344';
    X.fillRect(RL,LH-8,RW,6);
    X.fillStyle='#00ffff';
    X.fillRect(RL,LH-8,RW*pct,6);
  }

  // Touch arrow buttons (always visible on mobile hint)
  X.save();
  X.globalAlpha=0.18;
  X.fillStyle='#ffffff';
  X.font='bold 36px Arial'; X.textAlign='center';
  X.fillText('◀',LW*0.25,LH-18);
  X.fillText('▶',LW*0.75,LH-18);
  X.restore();

  X.shadowBlur=0;
  X.restore();
}

// ── DRAW PARTICLES ────────────────────────────────────────
function drawParticles(){
  particles.forEach(p=>{
    const a=p.life/p.ml;
    X.save(); X.globalAlpha=a;
    X.fillStyle=p.col; X.shadowColor=p.col; X.shadowBlur=8;
    X.beginPath(); X.arc(p.x,p.y,p.r*a,0,Math.PI*2); X.fill();
    X.restore();
  });
}

// ── DRAW POPUPS ───────────────────────────────────────────
function drawPopups(){
  popups.forEach(p=>{
    const a=Math.min(p.life/p.ml,1)*Math.min((p.ml-p.life+10)/10,1);
    X.save(); X.globalAlpha=a;
    X.fillStyle=p.col; X.shadowColor=p.col; X.shadowBlur=10;
    X.font='bold 22px Arial Black,Arial'; X.textAlign='center';
    X.fillText(p.txt,p.x,p.y);
    X.restore();
  });
}

// ── TITLE SCREEN ──────────────────────────────────────────
function drawTitle(){
  animT+=0.025;

  // Background
  X.fillStyle='#000'; X.fillRect(0,0,LW,LH);

  // Starfield
  for(let i=0;i<120;i++){
    const x=((i*173+70)%LW), y=((i*103+40)%LH);
    const b=(Math.sin(animT*2.5+i*0.4)+1)/2;
    X.fillStyle=`rgba(255,255,255,${0.1+b*0.7})`;
    const sz=i%10===0?2:1;
    X.fillRect(x,y,sz,sz);
  }

  // Road preview
  X.fillStyle='#1a1a30'; X.fillRect(RL,0,RW,LH);
  X.save(); X.strokeStyle='#ff00ff'; X.lineWidth=2; X.shadowColor='#ff00ff'; X.shadowBlur=10;
  X.beginPath(); X.moveTo(RL,0); X.lineTo(RL,LH); X.stroke();
  X.beginPath(); X.moveTo(RR,0); X.lineTo(RR,LH); X.stroke();
  X.restore();

  // Title glows
  const p2=(Math.sin(animT*2.2)+1)/2;

  X.save();
  X.shadowColor='#ff00ff'; X.shadowBlur=40*p2+10;
  X.fillStyle='#ff44ff';
  X.font='bold 18px Arial Black,Arial'; X.textAlign='center';
  X.fillText("MILAN'S",LW/2,LH/2-110);
  X.restore();

  X.save();
  X.shadowColor='#00ffff'; X.shadowBlur=50*p2+15;
  X.fillStyle='#00ffff';
  X.font=`bold 66px Arial Black,Arial`;
  X.textAlign='center';
  X.fillText('TURBO',LW/2,LH/2-45);
  X.fillText('RACER',LW/2,LH/2+35);
  X.restore();

  X.save();
  X.shadowColor='#ffff00'; X.shadowBlur=12;
  X.fillStyle='#ffff00';
  X.font='bold 17px Arial Black'; X.textAlign='center';
  X.fillText('★  ARCADE EDITION  ★',LW/2,LH/2+68);
  X.restore();

  // Hi score
  X.fillStyle='#ff88ff'; X.font='bold 15px Arial'; X.textAlign='center';
  X.fillText(`HIGH SCORE: ${hiScore}`,LW/2,LH/2+96);

  // Press start blink
  const ba=(Math.sin(animT*3.5)+1)/2;
  X.globalAlpha=0.45+ba*0.55;
  X.fillStyle='#ffffff'; X.font='bold 19px Arial'; X.textAlign='center';
  X.fillText('PRESS ANY KEY  /  TAP TO PLAY',LW/2,LH/2+138);
  X.globalAlpha=1;

  // Controls
  X.fillStyle='rgba(255,255,255,0.45)'; X.font='14px Arial'; X.textAlign='center';
  X.fillText('← → MOVE  |  SPACE / ⚡ = BOOST  |  P = PAUSE',LW/2,LH/2+168);

  // Demo car
  const cy=LH/2+230+Math.sin(animT*1.8)*6;
  drawCar(LW/2,cy,34,58,'#00eeff','#ffffff',true,false,0,0);
}

// ── GAME OVER SCREEN ──────────────────────────────────────
function drawGameOver(){
  animT+=0.03;
  // Dim game
  X.fillStyle='rgba(0,0,0,0.72)'; X.fillRect(0,0,LW,LH);

  X.save();
  X.shadowColor='#ff0000'; X.shadowBlur=35;
  X.fillStyle='#ff3333'; X.font='bold 60px Arial Black,Arial'; X.textAlign='center';
  X.fillText('GAME',LW/2,LH/2-55);
  X.fillText('OVER',LW/2,LH/2+15);
  X.restore();

  const newHi=score>=hiScore;
  X.fillStyle=newHi?'#ffff00':'#ffffff';
  X.font='bold 22px Arial'; X.textAlign='center';
  X.fillText(`SCORE: ${Math.floor(score)}`,LW/2,LH/2+68);

  if(newHi){
    X.save(); X.shadowColor='#ff8800'; X.shadowBlur=14;
    X.fillStyle='#ff8800'; X.font='bold 19px Arial Black'; X.textAlign='center';
    X.fillText('★  NEW HIGH SCORE!  ★',LW/2,LH/2+100);
    X.restore();
  } else {
    X.fillStyle='#aaaaff'; X.font='16px Arial'; X.textAlign='center';
    X.fillText(`BEST: ${hiScore}`,LW/2,LH/2+100);
  }

  const ba=(Math.sin(animT*3.5)+1)/2;
  X.globalAlpha=0.45+ba*0.55;
  X.fillStyle='#00ffff'; X.font='bold 19px Arial'; X.textAlign='center';
  X.fillText('TAP / ANY KEY TO PLAY AGAIN',LW/2,LH/2+148);
  X.globalAlpha=1;
}

// ── PAUSE SCREEN ──────────────────────────────────────────
function drawPause(){
  X.fillStyle='rgba(0,0,20,0.78)'; X.fillRect(0,0,LW,LH);
  X.save(); X.shadowColor='#00ffff'; X.shadowBlur=22;
  X.fillStyle='#00ffff'; X.font='bold 52px Arial Black,Arial'; X.textAlign='center';
  X.fillText('PAUSED',LW/2,LH/2);
  X.restore();
  X.fillStyle='rgba(255,255,255,0.5)'; X.font='16px Arial'; X.textAlign='center';
  X.fillText('P / ESC to continue',LW/2,LH/2+50);
}

// ── COLOR UTILS ───────────────────────────────────────────
function parseHex(h){
  const r=parseInt(h.slice(1,3),16), g=parseInt(h.slice(3,5),16), b=parseInt(h.slice(5,7),16);
  return [r,g,b];
}
function darken(h,amt){
  const [r,g,b]=parseHex(h);
  return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
}
function lighten(h,amt){
  const [r,g,b]=parseHex(h);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}

// ── MAIN LOOP ─────────────────────────────────────────────
function draw(){
  X.save();
  // Screen shake
  if(shakeT>0){
    const s=shakeAmt*(shakeT/40);
    X.translate((Math.random()-.5)*s,(Math.random()-.5)*s);
  }

  if(gs===S.TITLE){
    drawTitle();
  } else if(gs===S.OVER){
    drawRoad();
    drawScenery();
    traffic.forEach(t=>drawCar(t.x,t.y,t.w,t.h,t.color,t.accent,false,false,0,frame));
    boostPads.forEach(b=>drawBoostPad(b));
    coins.forEach(c=>drawCoin(c));
    drawCar(player.x,player.y,player.w,player.h,player.color,player.accent,true,false,0,frame);
    drawParticles(); drawPopups(); drawHUD();
    drawGameOver();
  } else {
    drawRoad();
    drawScenery();

    // Boost trail behind player
    player.trail.forEach(t=>{
      const a=t.life/18;
      X.save(); X.globalAlpha=a*0.55;
      X.shadowColor='#00ffff'; X.shadowBlur=12;
      X.fillStyle='#00ddff';
      X.beginPath(); X.ellipse(t.x,t.y+22,10,16,0,0,Math.PI*2); X.fill();
      X.restore();
    });

    traffic.forEach(t=>drawCar(t.x,t.y,t.w,t.h,t.color,t.accent,false,false,0,frame));
    boostPads.forEach(b=>drawBoostPad(b));
    coins.forEach(c=>drawCoin(c));
    drawCar(player.x,player.y,player.w,player.h,player.color,player.accent,true,boostActive,invT,frame);
    drawParticles(); drawPopups(); drawHUD();

    if(gs===S.PAUSE) drawPause();
  }

  X.restore();
  frame++;
}

function loop(ts){
  scrollScenery();
  update(ts);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(ts=>{ lastT=ts; requestAnimationFrame(loop); });
</script>
